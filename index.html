<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eken Weather — ECMWF</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    #smooth-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 420;
      filter: blur(14px);
    }

    .panel-box {
      position: fixed;
      z-index: 950;
      background: rgba(11, 17, 30, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }


    #brand-logo {
      top: 10px;
      left: 10px;
      padding: 6px 12px 6px 8px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 10px;
      background: rgba(9, 17, 34, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.35);
      user-select: none;
    }
    #brand-logo img {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      object-fit: cover;
      display: block;
    }
    #brand-logo .logo-svg {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(12, 24, 46, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #brand-logo .logo-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #f8fafc;
      white-space: nowrap;
    }

    #cbar-box {
      top: 10px;
      right: 10px;
      width: 176px;
      padding: 6px 8px;
      font-size: 10px;
      border-radius: 7px;
    }
    #cbar-top { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
    #cbar-unit { color: #7dd3fc; }
    #cbar-grad {
      width: 100%;
      height: 9px;
      border-radius: 3px;
      background: linear-gradient(90deg, #2563eb 0%, #06b6d4 25%, #22c55e 50%, #eab308 75%, #ef4444 100%);
    }
    #cbar-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    #simple-panel {
      left: 10px;
      right: auto;
      bottom: 10px;
      width: min(680px, calc(100vw - 20px));
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
      border-radius: 8px;
    }
    .line {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .line::-webkit-scrollbar { display: none; }
    .line.vars {
      gap: 4px;
      padding-top: 1px;
    }
    .tag-title { font-weight: 700; color: #7dd3fc; font-size: 10px; }
    .muted { color: #cbd5e1; }
    .val-hi { font-weight: 700; color: #38bdf8; }

    select, input, button {
      background: rgba(30, 41, 59, 0.92);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 10px;
      line-height: 1.2;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }
    input[type="date"] { padding: 2px 5px; }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }
  
    /* Eken Weather çakışma önleyici yerleşim kuralları */
    :root {
      --logo-top: 12px;
      --logo-left: 12px;
      --logo-h: 52px;
      --zoom-top: 76px;
      --cbar-bottom: 64px;
      --music-bottom: 14px;
      --music-right: 14px;
    }

    #brand-logo {
      position: fixed !important;
      top: var(--logo-top) !important;
      left: var(--logo-left) !important;
      z-index: 1200 !important;
      max-width: min(320px, calc(100vw - 260px));
      padding: 6px 12px 6px 8px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 10px;
      background: rgba(9, 17, 34, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-sizing: border-box;
      user-select: none;
    }

    /* Harita/sayfa zoom butonlarını logonun altına al */
    .leaflet-top.leaflet-left,
    [class*="zoom-control"],
    #zoom-controls,
    .zoom-controls {
      top: var(--zoom-top) !important;
      left: var(--logo-left) !important;
      z-index: 1100 !important;
    }

    /* Ana kontrol paneli ve 90 değişken menüsü: logo, zoom ve cbar ile çakışmasın */
    #ew-var-panel {
      position: fixed;
      top: 12px;
      right: 14px;
      z-index: 1150;
      width: min(360px, calc(100vw - 28px));
      max-height: calc(100vh - 145px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(9, 17, 34, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #f8fafc;
      font-size: 12px;
      backdrop-filter: blur(8px);
      box-sizing: border-box;
    }

    #ew-var-panel.collapsed {
      width: auto;
      max-height: none;
    }

    #ew-var-panel.collapsed .ew-panel-body {
      display: none;
    }

    .ew-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ew-sec-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .ew-sec-btn, .ew-var-btn {
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(15, 23, 42, 0.9);
      color: #e2e8f0;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .ew-sec-btn.active, .ew-var-btn.active {
      background: rgba(2, 132, 199, 0.45);
      border-color: #38bdf8;
      color: #ffffff;
      font-weight: 600;
    }

    .ew-var-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      overflow-y: auto;
      max-height: 250px;
      padding-right: 2px;
    }

    .ew-var-btn {
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Colorbar (#cbar-box) altta müzik çubuğu ve panelle çakışmasın */
    #cbar-box {
      position: fixed !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      bottom: var(--cbar-bottom) !important;
      z-index: 1050 !important;
      max-width: min(560px, calc(100vw - 24px));
      box-sizing: border-box;
    }

    /* Müzik çubuğu sağ altta sabit */
    #music-bar {
      position: fixed !important;
      right: var(--music-right) !important;
      bottom: var(--music-bottom) !important;
      z-index: 1300 !important;
      max-width: calc(100vw - 28px);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 12px;
      backdrop-filter: blur(6px);
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      #ew-var-panel {
        top: auto;
        bottom: 112px;
        right: 12px;
        left: 12px;
        width: auto;
        max-height: 42vh;
      }
      #cbar-box {
        bottom: 58px !important;
      }
    }

  
    
    
    /* === TEKLEŞTİRİLMİŞ PANEL, AYRIK LOGO/ZOOM, KOMPAKT CBAR & SAĞ MÜZİK === */
    :root {
      --ew-bg: rgba(9, 17, 34, 0.92);
      --ew-border: rgba(56, 189, 248, 0.32);
      --ew-accent: #38bdf8;
      --ew-text: #f8fafc;
      --ew-muted: #94a3b8;
    }

    /* Logo üst-ortada, zoom ile asla temas etmez */
    #brand-logo {
      position: fixed !important;
      top: 12px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      z-index: 1250 !important;
      height: 40px;
      padding: 4px 14px 4px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      background: var(--ew-bg);
      border: 1px solid var(--ew-border);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #brand-logo img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
    }
    #brand-logo .logo-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--ew-text);
      white-space: nowrap;
    }

    /* Zoom sol üstte sabit ve logodan ayrı */
    .leaflet-top.leaflet-left {
      top: 14px !important;
      left: 12px !important;
      z-index: 1150 !important;
    }
    .leaflet-control-zoom {
      margin: 0 !important;
      border: 1px solid var(--ew-border) !important;
      border-radius: 9px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: var(--ew-bg) !important;
      color: var(--ew-text) !important;
    }

    /* Tek ECMWF Bilgi & Değişken Paneli (Sol üst zoom altında) */
    #ew-unified-panel {
      position: fixed !important;
      top: 90px !important;
      left: 12px !important;
      z-index: 1180 !important;
      width: min(320px, calc(100vw - 24px));
      max-height: calc(100vh - 150px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--ew-bg);
      border: 1px solid var(--ew-border);
      color: var(--ew-text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
      backdrop-filter: blur(10px);
      box-sizing: border-box;
      overflow-y: auto;
    }
    .ew-info-box {
      padding: 7px 9px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .ew-info-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 0;
    }
    .ew-k { color: var(--ew-muted); }
    .ew-v { font-weight: 600; color: var(--ew-text); text-align: right; }
    .ew-val-hi { color: var(--ew-accent); font-weight: 700; }

    .ew-var-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      max-height: 210px;
      overflow-y: auto;
    }
    .ew-vbtn, .ew-mbtn {
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.9);
      color: #cbd5e1;
      border-radius: 7px;
      padding: 4px 7px;
      font-size: 10.5px;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ew-vbtn.active {
      background: rgba(2, 132, 199, 0.45);
      border-color: var(--ew-accent);
      color: #fff;
      font-weight: 600;
    }

    /* Colorbar sola gelmesin ve az yer kaplasın */
    #cbar-box {
      position: fixed !important;
      left: auto !important;
      right: 12px !important;
      bottom: 74px !important;
      transform: none !important;
      z-index: 1140 !important;
      width: 190px !important;
      max-width: calc(100vw - 24px) !important;
      padding: 5px 8px !important;
      border-radius: 8px !important;
      background: var(--ew-bg) !important;
      border: 1px solid var(--ew-border) !important;
      font-size: 10px !important;
      box-sizing: border-box;
    }

    /* Müzik butonu sağ altta */
    #music-bar {
      position: fixed !important;
      right: 12px !important;
      bottom: 34px !important;
      left: auto !important;
      z-index: 1250 !important;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--ew-bg);
      border: 1px solid var(--ew-border);
      color: #fff;
      font-size: 11px;
      backdrop-filter: blur(8px);
    }

    .leaflet-control-attribution {
      background: var(--ew-bg) !important;
      border: 1px solid var(--ew-border) !important;
      border-radius: 8px !important;
      padding: 2px 8px !important;
      font-size: 14px !important;
    }

  </style>
</head>
<body>
  <div id="map"></div>

  <span class="logo-text">Eken Weather</span>
  </div>

  <div id="cbar-box" class="panel-box">
    <div id="cbar-top">
      <span id="cbar-name">2 m Sıcaklığı</span>
      <span id="cbar-unit">°C</span>
    </div>
    <div id="cbar-grad"></div>
    <div id="cbar-ticks"><span>--</span><span>--</span><span>--</span></div>
  </div>

  <div id="simple-panel" class="panel-box">
    <div class="line">
      <span id="ecmwf-range" class="muted">Aralık: --</span>
      <span class="muted">|</span>
      <span id="live-clocks" class="muted">UTC: -- | İstanbul (TSİ): --</span>
    </div>
    <div class="line">
      <input id="date-input" type="date" />
      <select id="hour-select"></select>
      <button id="btn-refresh" type="button">Yenile</button>
      <span id="point-summary" class="val-hi">İstanbul (41.0082, 28.9784) · 2 m Sıcaklığı: -- °C</span>
      <span id="point-addr" class="muted">İstanbul · Fatih · Eminönü · Hobyar Mah.</span>
    </div>
    <div id="var-row" class="line vars"></div>
  </div>

  <script>
  (function() {
    const VARS = [
      { key: "temperature_2m", name: "2 m Sıcaklığı", unit: "°C", palette: [[37,99,235],[6,182,212],[34,197,94],[234,179,8],[239,68,68]] },
      { key: "dew_point_2m", name: "2 m Çiy Noktası", unit: "°C", palette: [[30,64,175],[14,165,233],[45,212,191],[163,230,53],[245,158,11]] },
      { key: "wind_speed_10m", name: "10 m Rüzgar Hızı", unit: "m/s", palette: [[22,163,74],[132,204,22],[234,179,8],[249,115,22],[220,38,38]] },
      { key: "wind_direction_10m", name: "10 m Rüzgar Yönü", unit: "°", palette: [[59,130,246],[6,182,212],[16,185,129],[245,158,11],[239,68,68]] },
      { key: "precipitation", name: "Toplam Yağış", unit: "mm", palette: [[30,58,138],[37,99,235],[6,182,212],[52,211,153],[250,204,21]] },
      { key: "pressure_msl", name: "Deniz Seviyesi Basıncı", unit: "hPa", palette: [[124,58,237],[37,99,235],[34,197,94],[234,179,8],[239,68,68]] },
      { key: "cloud_cover", name: "Toplam Bulutluluk", unit: "%", palette: [[14,165,233],[56,189,248],[148,163,184],[100,116,139],[51,65,85]] },
      { key: "cape", name: "CAPE", unit: "J/kg", palette: [[34,197,94],[163,230,53],[250,204,21],[249,115,22],[220,38,38]] },
      { key: "temperature_850hPa", name: "850 hPa Sıcaklık", unit: "°C", palette: [[29,78,216],[6,182,212],[34,197,94],[234,179,8],[239,68,68]] },
      { key: "wind_speed_850hPa", name: "850 hPa Rüzgar Hızı", unit: "m/s", palette: [[16,185,129],[132,204,22],[234,179,8],[249,115,22],[239,68,68]] },
      { key: "geopotential_height_500hPa", name: "500 hPa Jeopotansiyel", unit: "gpm", palette: [[37,99,235],[14,165,233],[34,197,94],[234,179,8],[239,68,68]] },
      { key: "temperature_500hPa", name: "500 hPa Sıcaklık", unit: "°C", palette: [[30,64,175],[6,182,212],[52,211,153],[250,204,21],[239,68,68]] },
      { key: "wind_speed_500hPa", name: "500 hPa Rüzgar Hızı", unit: "m/s", palette: [[22,163,74],[132,204,22],[234,179,8],[249,115,22],[220,38,38]] }
    ];

    const SAMPLE_GRID = (() => {
      const pts = [];
      for (let lat = 38.0; lat <= 43.0; lat += 0.6) {
        for (let lon = 25.0; lon <= 32.5; lon += 0.75) {
          pts.push({ lat: Number(lat.toFixed(2)), lon: Number(lon.toFixed(2)) });
        }
      }
      for (let lat = -60; lat <= 75; lat += 25) {
        for (let lon = -165; lon <= 165; lon += 30) {
          pts.push({ lat, lon });
        }
      }
      return pts;
    })();

    const map = L.map("map", { center: [40.85, 29.0], zoom: 7, preferCanvas: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap",
      maxZoom: 18
    }).addTo(map);

    const canvas = document.createElement("canvas");
    canvas.id = "smooth-canvas";
    map.getContainer().appendChild(canvas);
    const ctx = canvas.getContext("2d");

    let curVar = VARS[0];
    let curCoord = { lat: 41.0082, lon: 28.9784 };
    let curAddr = "İstanbul · Fatih · Eminönü · Hobyar Mah.";
    let lastAddrKey = "";
    let gridData = null;
    let pointData = null;

    function updateClocks() {
      const now = new Date();
      const utcStr = now.toISOString().replace("T", " ").slice(0, 19) + " UTC";
      const istStr = now.toLocaleString("tr-TR", {
        timeZone: "Europe/Istanbul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
      const el = document.getElementById("live-clocks");
      if (el) el.textContent = `UTC: ${utcStr} | İstanbul (TSİ): ${istStr}`;
    }

    function applyPalette(v) {
      const grad = document.getElementById("cbar-grad");
      document.getElementById("cbar-name").textContent = v.name;
      document.getElementById("cbar-unit").textContent = v.unit;
      const parts = v.palette.map((c, idx) => `rgb(${c[0]},${c[1]},${c[2]}) ${Math.round((idx / (v.palette.length - 1)) * 100)}%`);
      grad.style.background = `linear-gradient(90deg, ${parts.join(", ")})`;
    }

    function sampleRgb(val, minV, maxV, palette) {
      const t = Math.max(0, Math.min(1, (val - minV) / Math.max(1e-6, maxV - minV)));
      const s = t * (palette.length - 1);
      const i = Math.min(palette.length - 2, Math.floor(s));
      const f = s - i;
      const c0 = palette[i], c1 = palette[i + 1];
      return [
        Math.round(c0[0] + (c1[0] - c0[0]) * f),
        Math.round(c0[1] + (c1[1] - c0[1]) * f),
        Math.round(c0[2] + (c1[2] - c0[2]) * f)
      ];
    }

    function buildVarRow() {
      const row = document.getElementById("var-row");
      row.innerHTML = "";
      VARS.forEach((v, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = `${v.name} (${v.unit})`;
        if (idx === 0) btn.classList.add("active");
        btn.addEventListener("click", async () => {
          row.querySelectorAll("button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          curVar = v;
          gridData = null;
          pointData = null;
          applyPalette(v);
          await loadAndRender(false, false);
        });
        row.appendChild(btn);
      });
      applyPalette(curVar);
    }

    function syncTimeControls(times, forceHourPick) {
      const dIn = document.getElementById("date-input");
      const hSel = document.getElementById("hour-select");
      const rangeEl = document.getElementById("ecmwf-range");
      if (!times || !times.length) return { idx: 0, iso: "" };

      const dates = [...new Set(times.map(t => t.slice(0, 10)))];
      const minD = dates[0], maxD = dates[dates.length - 1];
      dIn.min = minD;
      dIn.max = maxD;
      if (!dIn.value || dIn.value < minD || dIn.value > maxD) {
        const nowDay = new Date().toISOString().slice(0, 10);
        dIn.value = dates.includes(nowDay) ? nowDay : minD;
      }

      const dayTimes = times.filter(t => t.startsWith(dIn.value));
      const prevHour = hSel.value;
      hSel.innerHTML = "";
      dayTimes.forEach(t => {
        const hh = t.slice(11, 16);
        const opt = document.createElement("option");
        opt.value = hh;
        opt.textContent = `${hh} UTC`;
        hSel.appendChild(opt);
      });

      if (!forceHourPick && prevHour && [...hSel.options].some(o => o.value === prevHour)) {
        hSel.value = prevHour;
      } else if (hSel.options.length) {
        const curUtcH = String(new Date().getUTCHours()).padStart(2, "0") + ":00";
        const match = [...hSel.options].find(o => o.value === curUtcH);
        hSel.value = match ? match.value : hSel.options[0].value;
      }

      const targetIso = `${dIn.value}T${hSel.value}`;
      let idx = times.indexOf(targetIso);
      if (idx < 0) idx = times.findIndex(t => t.startsWith(dIn.value));
      if (idx < 0) idx = 0;

      if (rangeEl) {
        rangeEl.textContent = `Tarih Aralığı: ${minD} → ${maxD} · Seçili: ${(times[idx] || targetIso).replace("T", " ")} UTC`;
      }
      return { idx, iso: times[idx] || targetIso };
    }

    async function fetchEcmwf() {
      if (!gridData) {
        const lats = SAMPLE_GRID.map(p => p.lat).join(",");
        const lons = SAMPLE_GRID.map(p => p.lon).join(",");
        const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${lats}&longitude=${lons}&hourly=${encodeURIComponent(curVar.key)}&wind_speed_unit=ms&timezone=UTC&forecast_days=5`;
        const res = await fetch(url);
        if (res.ok) gridData = await res.json();
      }
      const pUrl = `https://api.open-meteo.com/v1/ecmwf?latitude=${encodeURIComponent(curCoord.lat)}&longitude=${encodeURIComponent(curCoord.lon)}&hourly=${encodeURIComponent(curVar.key)}&wind_speed_unit=ms&timezone=UTC&forecast_days=5`;
      const pRes = await fetch(pUrl);
      if (pRes.ok) pointData = await pRes.json();
    }

    async function fetchAddress(lat, lon) {
      const k = `${lat.toFixed(3)},${lon.toFixed(3)}`;
      if (k === lastAddrKey) return curAddr;
      lastAddrKey = k;
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1&accept-language=tr`;
        const res = await fetch(url);
        if (res.ok) {
          const j = await res.json();
          const a = j.address || {};
          const parts = [
            a.province || a.city || a.state || a.county,
            a.town || a.city_district || a.district,
            a.suburb || a.neighbourhood,
            a.quarter || a.residential || a.hamlet || a.road
          ].filter((v, i, arr) => v && arr.indexOf(v) === i);
          curAddr = parts.length ? parts.join(" · ") : (j.display_name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`);
        }
      } catch (_) {}
      return curAddr;
    }

    function renderCanvas(forceHourPick) {
      if (!gridData) return;
      const list = Array.isArray(gridData) ? gridData : [gridData];
      const times = (list[0] && list[0].hourly && list[0].hourly.time) || [];
      const { idx } = syncTimeControls(times, forceHourPick);

      const sz = map.getSize();
      if (!sz || sz.x <= 0 || sz.y <= 0) return;
      const w = Math.max(120, Math.floor(sz.x / 3));
      const h = Math.max(90, Math.floor(sz.y / 3));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }

      const pts = [];
      list.forEach((item, i) => {
        const arr = (item && item.hourly && item.hourly[curVar.key]) || [];
        const val = arr[idx];
        const g = SAMPLE_GRID[i];
        if (!g || typeof val !== "number" || !Number.isFinite(val)) return;
        const px = map.latLngToContainerPoint([g.lat, g.lon]);
        pts.push({ x: px.x / 3, y: px.y / 3, val });
      });
      if (!pts.length) return;

      const minV = Math.min(...pts.map(p => p.val));
      const maxV = Math.max(...pts.map(p => p.val));
      document.getElementById("cbar-ticks").innerHTML = `<span>${minV.toFixed(1)} ${curVar.unit}</span><span>${((minV + maxV) / 2).toFixed(1)}</span><span>${maxV.toFixed(1)} ${curVar.unit}</span>`;

      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let y = 0; y < h; y += 2) {
        for (let x = 0; x < w; x += 2) {
          let wSum = 0, vSum = 0;
          for (let k = 0; k < pts.length; k++) {
            const dx = x - pts[k].x;
            const dy = y - pts[k].y;
            const d2 = dx * dx + dy * dy + 220;
            const wt = 1.0 / (d2 * Math.sqrt(d2));
            wSum += wt;
            vSum += wt * pts[k].val;
          }
          const v = wSum > 0 ? vSum / wSum : minV;
          const [r, g, b] = sampleRgb(v, minV, maxV, curVar.palette);
          for (let oy = 0; oy < 2 && y + oy < h; oy++) {
            for (let ox = 0; ox < 2 && x + ox < w; ox++) {
              const pIdx = ((y + oy) * w + (x + ox)) * 4;
              d[pIdx] = r;
              d[pIdx + 1] = g;
              d[pIdx + 2] = b;
              d[pIdx + 3] = 115;
            }
          }
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    function renderPoint(forceHourPick) {
      const times = (pointData && pointData.hourly && pointData.hourly.time) || [];
      const { idx, iso } = syncTimeControls(times, forceHourPick);
      const arr = (pointData && pointData.hourly && pointData.hourly[curVar.key]) || [];
      const raw = arr[idx];
      const valText = (typeof raw === "number" && Number.isFinite(raw))
        ? `${raw.toFixed(2)} ${curVar.unit}`
        : `-- ${curVar.unit}`;

      const istHourStr = iso ? new Date(iso + ":00Z").toLocaleString("tr-TR", {
        timeZone: "Europe/Istanbul",
        hour: "2-digit",
        minute: "2-digit"
      }) : "--";

      document.getElementById("point-summary").textContent =
        `(${curCoord.lat.toFixed(4)}, ${curCoord.lon.toFixed(4)}) · ${curVar.name}: ${valText} · ${iso ? iso.replace("T", " ") + " UTC" : "--"} / ${istHourStr} TSİ`;
      document.getElementById("point-addr").textContent = curAddr;
    }

    async function loadAndRender(needAddr, forceHourPick) {
      if (needAddr) await fetchAddress(curCoord.lat, curCoord.lon);
      await fetchEcmwf();
      renderCanvas(forceHourPick);
      renderPoint(forceHourPick);
    }

    buildVarRow();
    updateClocks();
    setInterval(updateClocks, 1000);
    setTimeout(() => map.invalidateSize(), 200);

    document.getElementById("date-input").addEventListener("change", () => {
      renderCanvas(true);
      renderPoint(true);
    });
    document.getElementById("hour-select").addEventListener("change", () => {
      renderCanvas(false);
      renderPoint(false);
    });
    document.getElementById("btn-refresh").addEventListener("click", async () => {
      gridData = null;
      pointData = null;
      await loadAndRender(true, true);
    });
    map.on("moveend zoomend resize", () => renderCanvas(false));
    map.on("click", async (e) => {
      curCoord = { lat: e.latlng.lat, lon: e.latlng.lng };
      await loadAndRender(true, false);
    });

    loadAndRender(true, true);
  })();
  </script>

})();

      { code: "sm_7_28", om: "soil_moisture_7_to_28cm", name: "Toprak Nem 7-28cm", unit: "m³/m³", min: 0, max: 0.5, stops: PAL.hum, desc: "7-28 cm hacimsel toprak nemi." },
      { code: "sm_28_100", om: "soil_moisture_28_to_100cm", name: "Toprak Nem 28-100cm", unit: "m³/m³", min: 0, max: 0.5, stops: PAL.hum, desc: "28-100 cm hacimsel toprak nemi." },
      { code: "sm_100_255", om: "soil_moisture_100_to_255cm", name: "Toprak Nem 100-255cm", unit: "m³/m³", min: 0, max: 0.5, stops: PAL.hum, desc: "100-255 cm hacimsel toprak nemi." },
      { code: "msl", om: "pressure_msl", name: "Deniz Basıncı (MSL)", unit: "hPa", min: 990, max: 1035, stops: PAL.pres, desc: "Deniz seviyesi basıncı (hPa)." },
      { code: "sp", om: "surface_pressure", name: "Yüzey Basıncı (SP)", unit: "hPa", min: 860, max: 1030, stops: PAL.pres, desc: "Yüzey atmosfer basıncı (hPa)." },
      { code: "rh2m", om: "relative_humidity_2m", name: "2m Bağıl Nem", unit: "%", min: 10, max: 100, stops: PAL.hum, desc: "2m bağıl nem (%)." },
      { code: "tp", om: "precipitation", name: "Toplam Yağış", unit: "mm", min: 0, max: 25, stops: PAL.rain, desc: "Toplam yağış (mm)." },
      { code: "rain", om: "rain", name: "Yağmur", unit: "mm", min: 0, max: 25, stops: PAL.rain, desc: "Yağmur miktarı (mm)." },
      { code: "showers", om: "showers", name: "Sağanak Yağış", unit: "mm", min: 0, max: 20, stops: PAL.rain, desc: "Sağanak yağış miktarı (mm)." },
      { code: "sf", om: "snowfall", name: "Kar Yağışı", unit: "cm", min: 0, max: 20, stops: PAL.cold, desc: "Kar yağışı (cm)." },
      { code: "tcc", om: "cloud_cover", name: "Toplam Bulut", unit: "%", min: 0, max: 100, stops: PAL.hum, desc: "Toplam bulut örtüsü (%)." },

      { code: "wd100", om: "wind_direction_100m", name: "100m Rüzgar Yönü", unit: "°", min: 0, max: 360, stops: PAL.wind, desc: "100m rüzgar yönü (°)." },
      { code: "ws120", om: "wind_speed_120m", name: "120m Rüzgar Hızı", unit: "km/h", min: 0, max: 120, stops: PAL.wind, desc: "120m rüzgar hızı (km/h)." },
      { code: "wd120", om: "wind_direction_120m", name: "120m Rüzgar Yönü", unit: "°", min: 0, max: 360, stops: PAL.wind, desc: "120m rüzgar yönü (°)." },
      ...(function() {
        const lvls = [1000, 925, 850, 700, 500, 300, 250, 200, 150, 100, 50];
        const out = [];
        for (const l of lvls) {
          out.push({ code: `t${l}`, om: `temperature_${l}hPa`, name: `${l}hPa Sıcaklık`, unit: "°C", min: l >= 700 ? -25 : -65, max: l >= 700 ? 32 : -5, stops: l >= 700 ? PAL.temp : PAL.cold, desc: `${l} hPa basınç seviyesi sıcaklığı (°C).` });

    const VARS = RAW_90.slice(0, 90);
    let curVar = VARS[0];

    const listEl = document.getElementById("ew-var-list");
    const extraInfoEl = document.getElementById("ew-extra-info");
    const bottomInfoBtn = document.getElementById("ew-bottom-info-btn");

    const buildCssGrad = (v) => {
      const parts = v.stops.map(([pos, col]) => `${col} ${Math.round(pos * 100)}%`).join(", ");
      return `linear-gradient(90deg, ${parts})`;
    };

    const hexToRgb = (hex) => {
      if (!hex || hex.startsWith("rgba")) return [56, 189, 248];
      const clean = hex.replace("#", "");
      const n = parseInt(clean, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    };

    const valueToColor = (val, v, alpha = 0.5) => {
      const ratio = Math.max(0, Math.min(1, (val - v.min) / (v.max - v.min || 1)));
      let s0 = v.stops[0], s1 = v.stops[v.stops.length - 1];
      for (let i = 0; i < v.stops.length - 1; i++) {
        if (ratio >= v.stops[i][0] && ratio <= v.stops[i + 1][0]) {
          s0 = v.stops[i];
          s1 = v.stops[i + 1];
          break;
        }
      }
      const span = (s1[0] - s0[0]) || 1;
      const t = (ratio - s0[0]) / span;
      const c0 = hexToRgb(s0[1]);
      const c1 = hexToRgb(s1[1]);
      const r = Math.round(c0[0] + (c1[0] - c0[0]) * t);
      const g = Math.round(c0[1] + (c1[1] - c0[1]) * t);
      const b = Math.round(c0[2] + (c1[2] - c0[2]) * t);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    };

          <span>${v.name}</span><span>${v.unit}</span>
        </div>
        <div style="height:8px;border-radius:4px;background:${buildCssGrad(v)};border:1px solid rgba(255,255,255,0.18);"></div>
        <div style="display:flex;justify-content:space-between;color:#cbd5e1;margin-top:2px;">
          <span>${v.min}</span><span>${v.max}</span>
        </div>
      `;
    };

    const updateExtraInfoBox = () => {
      if (!extraInfoEl) return;
      const idxNo = VARS.findIndex(x => x.code === curVar.code) + 1;
      const coordStr = lastPt ? `${lastPt.lat.toFixed(4)}, ${lastPt.lng.toFixed(4)}` : "Seçilmedi";
      extraInfoEl.innerHTML = `
        <div><strong>Değişken (#${idxNo}/90):</strong> ${curVar.name} (${curVar.code}) [${curVar.unit}]</div>
        <div><strong>Seçili Nokta Değeri:</strong> ${lastPointValText} (${coordStr})</div>
        <div><strong>Konum:</strong> ${lastLocationSummary.il} / ${lastLocationSummary.ilce} / ${lastLocationSummary.mah}</div>
        <div><strong>Açıklama:</strong> ${curVar.desc}</div>
        <div><strong>Ölçek:</strong> ${curVar.min} .. ${curVar.max} ${curVar.unit} | <strong>Saat:</strong> ${lastGridFetchTime || "—"}</div>
      `;
    };

    const fetchEcmwfValue = async (lat, lng, omParam) => {
      const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${lat}&longitude=${lng}&current=${encodeURIComponent(omParam)}&hourly=${encodeURIComponent(omParam)}&forecast_days=1`;
      const res = await fetch(url);
      const data = await res.json();
      const items = Array.isArray(data) ? data : [data];
      return items.map(loc => {
        let val = loc?.current?.[omParam];
        if (val === undefined && Array.isArray(loc?.hourly?.[omParam])) {
          val = loc.hourly[omParam][0];
        }
        const t = loc?.current?.time ? loc.current.time.replace("T", " ") : "";
        return { val, time: t };
      });
    };

    const renderLiveEcmwfMapLayer = async () => {
      if (!mapRef || typeof L === "undefined") return;
      if (!liveLayerGroup) {
        liveLayerGroup = L.layerGroup().addTo(mapRef);
      }
      liveLayerGroup.clearLayers();

      const bounds = mapRef.getBounds();
      const s = Math.max(35.0, bounds.getSouth());
      const n = Math.min(43.5, bounds.getNorth());
      const w = Math.max(25.0, bounds.getWest());
      const e = Math.min(45.0, bounds.getEast());

      const rows = 5, cols = 6;
      const gridLat = [], gridLon = [];
      for (let r = 0; r < rows; r++) {
        const la = Number((s + ((n - s) * (r + 0.5)) / rows).toFixed(3));
        for (let c = 0; c < cols; c++) {
          const lo = Number((w + ((e - w) * (c + 0.5)) / cols).toFixed(3));
          gridLat.push(la);
          gridLon.push(lo);
        }
      }

      try {
        const results = await fetchEcmwfValue(gridLat.join(","), gridLon.join(","), curVar.om);
        results.forEach((item, idx) => {
          const la = gridLat[idx], lo = gridLon[idx];
          if (la === undefined || lo === undefined) return;
          if (typeof item.val !== "number" || Number.isNaN(item.val)) return;
          if (item.time) lastGridFetchTime = item.time;

          const color = valueToColor(item.val, curVar, 0.48);
          L.circleMarker([la, lo], {
            radius: 28,
            color: color,
            fillColor: color,
            fillOpacity: 0.48,
            weight: 0,
            interactive: false
          }).addTo(liveLayerGroup);
        });
        updateExtraInfoBox();
      } catch (_) {}
    };

    const queryPoint = async (lat, lng) => {
      const cEl = document.getElementById("ew-coord");
      const cityEl = document.getElementById("ew-city");
      const distEl = document.getElementById("ew-dist");
      const hoodEl = document.getElementById("ew-hood");
      const vlEl = document.getElementById("ew-vlabel");
      const vvEl = document.getElementById("ew-vval");

      if (mapRef && typeof L !== "undefined") {
        if (!clickMarker) {
          clickMarker = L.circleMarker([lat, lng], {
            radius: 6,
            color: "#38bdf8",
            fillColor: "#0284c7",
            fillOpacity: 0.9,
            weight: 2
          }).addTo(mapRef);
        } else {
          clickMarker.setLatLng([lat, lng]);
        }
      }

      if (cEl) cEl.textContent = `${lat.toFixed(4)}°K, ${lng.toFixed(4)}°D`;
      if (vlEl) vlEl.textContent = `${curVar.name} (${curVar.code}):`;
      if (vvEl) vvEl.textContent = "Yükleniyor...";

      try {
        const arr = await fetchEcmwfValue(lat.toFixed(4), lng.toFixed(4), curVar.om);
        const first = arr[0] || {};
        if (first.time) lastGridFetchTime = first.time;
        if (typeof first.val === "number" && !Number.isNaN(first.val)) {
          lastPointValText = `${Number(first.val).toFixed(2)} ${curVar.unit}`;
        } else {
          lastPointValText = "Veri yok";
        }
        if (vvEl) vvEl.textContent = lastPointValText;
        updateExtraInfoBox();
      } catch (_) {
        lastPointValText = "Veri alınamadı";
        if (vvEl) vvEl.textContent = lastPointValText;
      }

      if (cityEl) cityEl.textContent = "Sorgulanıyor...";
      if (distEl) distEl.textContent = "—";
      if (hoodEl) hoodEl.textContent = "—";

      try {
        const gr = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=tr`);
        const gj = await gr.json();
        const a = gj?.address || {};
        const il = a.province || a.city || a.state || "Açık Alan / Deniz";
        const ilce = a.town || a.county || a.city_district || a.district || "—";
        const mah = a.neighbourhood || a.suburb || a.quarter || a.village || a.hamlet || "—";
        lastLocationSummary = { il, ilce, mah };
        if (cityEl) cityEl.textContent = il;
        if (distEl) distEl.textContent = ilce;
        if (hoodEl) hoodEl.textContent = mah;
        updateExtraInfoBox();
      } catch (_) {
        if (cityEl) cityEl.textContent = "Konum alınamadı";
      }
    };

    const pickVar = (v) => {
      curVar = v;
      paintCbar(v);
      renderList();
      updateExtraInfoBox();
      const vlEl = document.getElementById("ew-vlabel");
      if (vlEl) vlEl.textContent = `${v.name} (${v.code}):`;
      renderLiveEcmwfMapLayer();
      if (lastPt) queryPoint(lastPt.lat, lastPt.lng);
    };

    const renderList = () => {
      if (!listEl) return;
      listEl.innerHTML = "";
      VARS.forEach((v, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "ew-vbtn" + (v.code === curVar.code ? " active" : "");
        b.textContent = `${i + 1}. ${v.name} (${v.unit})`;
        b.title = `${i + 1}/90 — ${v.name} [${v.unit}]`;
        b.addEventListener("click", (ev) => {
          ev.stopPropagation();
          pickVar(v);
        });
        listEl.appendChild(b);
      });
    };

    if (bottomInfoBtn && extraInfoEl) {
      bottomInfoBtn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        extraInfoEl.classList.toggle("open");
        updateExtraInfoBox();
      });
    }

    const bindMapClick = (m) => {
      if (!m || m._ewClickBound) return;
      m._ewClickBound = true;
      m.on("click", (e) => {
        if (!e || !e.latlng) return;
        lastPt = { lat: e.latlng.lat, lng: e.latlng.lng };
        queryPoint(lastPt.lat, lastPt.lng);
      });
      m.on("moveend", () => {
        renderLiveEcmwfMapLayer();
      });
      renderLiveEcmwfMapLayer();
    };

    const findAndBindMap = () => {
      let m = window.map;
      if (!m || typeof m.on !== "function") {
        for (const k of Object.keys(window)) {
          const obj = window[k];
          if (obj && typeof obj.on === "function" && typeof obj.getCenter === "function") {
            m = obj;
            break;
          }
        }
      }
      if (m) {
        mapRef = m;
        bindMapClick(m);
      }
      document.querySelectorAll(".leaflet-control-attribution").forEach(el => {
        if (el.innerHTML !== "🇹🇷") el.innerHTML = "🇹🇷";
      });
    };

    // #ew-unified-panel içindeki tıklamaların haritaya sızmasını engelle
    const panelRoot = document.getElementById("ew-unified-panel");
    if (panelRoot) {
      panelRoot.addEventListener("click", (ev) => ev.stopPropagation());
      panelRoot.addEventListener("mousedown", (ev) => ev.stopPropagation());
    }

    renderList();
    paintCbar(curVar);
    updateExtraInfoBox();
    findAndBindMap();
    window.addEventListener("load", findAndBindMap);
    setInterval(findAndBindMap, 800);
  })();
  </script>

  <audio id="bg-music" src="/ambient.mp3" autoplay loop preload="auto" playsinline></audio>
  <div id="music-bar">
    <span id="music-title" style="display:none;">♪ Eken Weather — Atmospheric Forecast Music</span>
    <button id="music-toggle" type="button" class="ew-mbtn" style="border-radius:999px;">♪ Müzik: Açık</button>
  </div>

  

</body>
