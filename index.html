  function renderCategoryAndVarButtons() {
    ensureShellElements();
    const catBar = document.getElementById("ew-pro-cat-bar");
    const varList = document.getElementById("ew-pro-var-list");
    if (!catBar || !varList) return;

    catBar.innerHTML = "";
    CATS.forEach(cat => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ew-pro-cat-btn" + (cat === curCat ? " is-active" : "");
      const cnt = VARS_125.filter(([k]) => catOf(k) === cat).length;
      btn.textContent = `${cat} (${cnt})`;
      btn.addEventListener("click", ev => {
        ev.stopPropagation();
        curCat = cat;
        renderCategoryAndVarButtons();
      });
      catBar.appendChild(btn);
    });

    varList.innerHTML = "";
    const items = VARS_125.filter(([k]) => catOf(k) === curCat);
    items.forEach(([k, u]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "ew-pro-var-btn" + (k === curVar ? " is-active" : "");
      b.dataset.key = k;
      b.dataset.unit = u;
      b.textContent = `${prettyName(k)} [${u}]`;
      b.addEventListener("click", ev => {
        ev.stopPropagation();
        activateVariable(k, u);
      });
      varList.appendChild(b);
    });
  }

  function paintFullMapWithVariable(centerLat, centerLon, series, nowVal, lo, hi) {
    if (typeof window.L === "undefined") return;
    const mp = mapsFound.values().next().value || window.map || window._map;
    if (!mp || typeof mp.addLayer !== "function") return;

    if (!colorGridGroup) {
      colorGridGroup = window.L.layerGroup().addTo(mp);
    } else if (mp.hasLayer && !mp.hasLayer(colorGridGroup)) {
      colorGridGroup.addTo(mp);
    }
    colorGridGroup.clearLayers();

    const valid = (Array.isArray(series) ? series : []).filter(Number.isFinite);
    const minV = Number.isFinite(lo) ? lo : (valid.length ? Math.min(...valid) : 0);
    const maxV = Number.isFinite(hi) ? hi : (valid.length ? Math.max(...valid) : 1);
    const span = Math.max(1e-6, maxV - minV);

    // Harita üzerinde seçili değişkenin değerine göre geniş bölgesel grid/renk katmanı oluştur
    const cols = 7;
    const rows = 5;
    const dLat = 0.45;
    const dLon = 0.65;

    for (let r = -Math.floor(rows / 2); r <= Math.floor(rows / 2); r++) {
      for (let c = -Math.floor(cols / 2); c <= Math.floor(cols / 2); c++) {
        const dist = Math.hypot(r, c);
        const sampleIdx = Math.min(valid.length - 1, Math.max(0, Math.floor(((r + 2) * cols + (c + 3)) / (rows * cols) * Math.max(1, valid.length - 1))));
        const baseCellVal = valid.length ? valid[sampleIdx] : (Number.isFinite(nowVal) ? nowVal : minV);
        const cellVal = Number.isFinite(nowVal)
          ? (nowVal * 0.72 + baseCellVal * 0.28)
          : baseCellVal;
        const ratio = (cellVal - minV) / span;
        const fillCol = colorForRatio(ratio);

        const lat0 = centerLat + r * dLat - dLat * 0.5;
        const lat1 = centerLat + r * dLat + dLat * 0.5;
        const lon0 = centerLon + c * dLon - dLon * 0.5;
        const lon1 = centerLon + c * dLon + dLon * 0.5;

        const rect = window.L.rectangle([[lat0, lon0], [lat1, lon1]], {
          stroke: false,
          fillColor: fillCol,
          fillOpacity: Math.max(0.14, 0.34 - dist * 0.03),
          interactive: false
        });
        colorGridGroup.addLayer(rect);
      }
    }
  }

  function refreshCbarAndRightPanel() {
    ensureShellElements();
    const pName = prettyName(curVar);
    const unit = curUnit || "";
    const valStr = Number.isFinite(ptState.val) ? `${fmtNum(ptState.val, unit)} ${unit}`.trim() : `- ${unit}`.trim();

    let lo = ptState.minV;
    let hi = ptState.maxV;
    if (!Number.isFinite(lo) || !Number.isFinite(hi)) {
      const s = (ptState.series || []).filter(Number.isFinite);
      if (s.length) {
        lo = Math.min(...s);
        hi = Math.max(...s);
      }
    }
    if (Number.isFinite(lo) && Number.isFinite(hi) && lo === hi) {
      lo -= 1;
      hi += 1;
    }

    // Sağ panel güncelle
    const coordEl = document.getElementById("ew-pro-coord-val");
    const ilIlceEl = document.getElementById("ew-pro-il-ilce");
    const mahEl = document.getElementById("ew-pro-mahalle");
    const vValEl = document.getElementById("ew-pro-var-val");
    const vNameEl = document.getElementById("ew-pro-var-name");
    const rValEl = document.getElementById("ew-pro-range-val");
    const uSubEl = document.getElementById("ew-pro-unit-sub");

    if (coordEl) coordEl.textContent = `${ptState.lat.toFixed(4)}°N, ${ptState.lon.toFixed(4)}°E`;
    if (ilIlceEl) ilIlceEl.textContent = [ptState.il, ptState.ilce].filter(Boolean).join(" / ") || "Konum";
    if (mahEl) mahEl.textContent = `Mahalle: ${ptState.mahalle || "-"}`;
    if (vValEl) vValEl.textContent = valStr;
    if (vNameEl) vNameEl.textContent = pName;
    if (rValEl) rValEl.textContent = (Number.isFinite(lo) && Number.isFinite(hi)) ? `${fmtNum(lo, unit)}..${fmtNum(hi, unit)}` : "-";
    if (uSubEl) uSubEl.textContent = `Birim: ${unit || "-"}`;

    // CBAR güncelle (İsim + Birim + Değer + Renk Skalası)
    const cbarTitle = document.getElementById("ew-pro-cbar-title");
    const cbarVal = document.getElementById("ew-pro-cbar-val");
    const cbarGrad = document.getElementById("ew-pro-cbar-grad");
    const cbarBins = document.getElementById("ew-pro-cbar-bins");

    if (cbarTitle) cbarTitle.textContent = `${pName} · Birim: ${unit || "-"}`;
    if (cbarVal) cbarVal.textContent = `${valStr}`;

    if (cbarGrad && cbarBins && Number.isFinite(lo) && Number.isFinite(hi)) {
      const bins = 6;
      const step = (hi - lo) / bins;
      const stops = [];
      const pills = [];
      for (let i = 0; i < bins; i++) {
        const a = lo + i * step;
        const b = i === bins - 1 ? hi : lo + (i + 1) * step;
        const col = PAL[Math.min(PAL.length - 1, Math.floor((i / bins) * PAL.length))];
        stops.push(`${col} ${((i / (bins - 1)) * 100).toFixed(1)}%`);
        pills.push(`<span class="ew-pro-bin" style="border-left:4px solid ${col};">${fmtNum(a, unit)}..${fmtNum(b, unit)}</span>`);
      }
      cbarGrad.style.background = `linear-gradient(90deg, ${stops.join(", ")})`;
      cbarBins.innerHTML = pills.join("");
    }

    paintFullMapWithVariable(ptState.lat, ptState.lon, ptState.series, ptState.val, lo, hi);
  }

  async function resolvePlace(lat, lon) {
    const k = `${lat.toFixed(4)},${lon.toFixed(4)}`;
    if (geoMemo.has(k)) return geoMemo.get(k);
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=17&addressdetails=1&accept-language=tr`;
    const r = await fetch(url, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error("geo");
    const j = await r.json();
    const a = (j && j.address) || {};
    const out = {
      il: a.province || a.state || a.city || a.region || "Açık Alan / Deniz",
      ilce: a.town || a.county || a.city_district || a.district || a.municipality || "",
      mahalle: a.neighbourhood || a.suburb || a.quarter || a.village || a.hamlet || a.road || "-"
    };
    geoMemo.set(k, out);
    return out;
  }

  async function resolveEcmwfVar(lat, lon, key, fallbackUnit) {
    const k = `${lat.toFixed(3)},${lon.toFixed(3)}:${key}`;
    if (varMemo.has(k)) return varMemo.get(k);
    const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&hourly=${encodeURIComponent(key)}&timezone=auto&forecast_days=7`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("ecmwf");
    const j = await r.json();
    const raw = (j && j.hourly && Array.isArray(j.hourly[key])) ? j.hourly[key] : [];
    const times = (j && j.hourly && Array.isArray(j.hourly.time)) ? j.hourly.time : [];
    const unit = (j && j.hourly_units && j.hourly_units[key]) ? j.hourly_units[key] : fallbackUnit;
    const series = raw.map(Number).filter(Number.isFinite);

    let bestIdx = 0, bestDiff = Infinity;
    const nowMs = Date.now();
    for (let i = 0; i < times.length; i++) {
      const ms = Date.parse(times[i]);
      if (Number.isFinite(ms) && Math.abs(ms - nowMs) < bestDiff) {
        bestDiff = Math.abs(ms - nowMs);
        bestIdx = i;
      }
    }
    const val = series.length ? series[Math.min(series.length - 1, bestIdx)] : NaN;
    const minV = series.length ? Math.min(...series) : NaN;
    const maxV = series.length ? Math.max(...series) : NaN;
    const out = { val, minV, maxV, series, unit };
    varMemo.set(k, out);
    return out;
  }

  function placePin(mp, lat, lon, htmlPopup) {
    if (!mp || typeof window.L === "undefined") return;
    try {
      if (pinMarker && mp.hasLayer(pinMarker)) mp.removeLayer(pinMarker);
      const icon = window.L.divIcon({
        className: "ew-blue-pin-wrap",
        html: '<div class="ew-blue-pin-dot"></div>',
        iconSize: [15, 15],
        iconAnchor: [7, 7]
      });
      pinMarker = window.L.marker([lat, lon], { icon, interactive: true }).addTo(mp);
      if (htmlPopup) pinMarker.bindPopup(htmlPopup).openPopup();
    } catch (_) {}
  }

  async function inspectPointAndVar(lat, lon, key, unit, showPopup) {
    const seq = ++seqId;
    ptState.lat = lat;
    ptState.lon = lon;
    ptState.val = NaN;
    refreshCbarAndRightPanel();

    const mp = mapsFound.values().next().value || window.map || window._map;
    if (showPopup && mp) {
      placePin(mp, lat, lon, `<b>${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E</b><br/>Yükleniyor...`);
    }

    const [pRes, vRes] = await Promise.allSettled([
      resolvePlace(lat, lon),
      resolveEcmwfVar(lat, lon, key, unit)
    ]);

    if (seq !== seqId) return;

    if (pRes.status === "fulfilled" && pRes.value) {
      ptState.il = pRes.value.il;
      ptState.ilce = pRes.value.ilce;
      ptState.mahalle = pRes.value.mahalle;
    }
    if (vRes.status === "fulfilled" && vRes.value) {
      ptState.val = vRes.value.val;
      ptState.minV = vRes.value.minV;
      ptState.maxV = vRes.value.maxV;
      ptState.series = vRes.value.series;
      curUnit = vRes.value.unit || unit || curUnit;
    }

    refreshCbarAndRightPanel();

    if (showPopup && mp) {
      const placeStr = [ptState.il, ptState.ilce, ptState.mahalle].filter(x => x && x !== "-").join(" / ");
      const valStr = Number.isFinite(ptState.val) ? `${fmtNum(ptState.val, curUnit)} ${curUnit}`.trim() : `- ${curUnit}`.trim();
      placePin(mp, lat, lon, `<b>${placeStr || "Konum"}</b><br/>${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E<br/><b>${prettyName(curVar)}:</b> ${valStr}`);
    }
  }

  async function activateVariable(key, unit) {
    curCat = catOf(key);
    curVar = key;
    curUnit = unit || curUnit;
    renderCategoryAndVarButtons();
    await inspectPointAndVar(ptState.lat, ptState.lon, curVar, curUnit, false);
  }

  function hookMapInstance(mp) {
    if (!mp || typeof mp.on !== "function" || mp.__ewProBound) return;
    mp.__ewProBound = true;
    mapsFound.add(mp);
    mp.on("click", function (ev) {
      if (ev && ev.latlng && Number.isFinite(ev.latlng.lat) && Number.isFinite(ev.latlng.lng)) {
        inspectPointAndVar(Number(ev.latlng.lat), Number(ev.latlng.lng), curVar, curUnit, true);
      }
    });
  }

  if (typeof window.L !== "undefined" && window.L.Map && window.L.Map.addInitHook && !window.__ewProInitHook) {
    window.__ewProInitHook = true;
    window.L.Map.addInitHook(function () {
      hookMapInstance(this);
    });
  }

  function scanGlobalMaps() {
    if (window.map) hookMapInstance(window.map);
    if (window._map) hookMapInstance(window._map);
    for (const k of Object.keys(window)) {
      try {
        const obj = window[k];
        if (obj && typeof obj === "object" && typeof obj.on === "function" && typeof obj.getCenter === "function") {
          hookMapInstance(obj);
        }
      } catch (_) {}
    }
  }

  function startProUi() {
    scanGlobalMaps();
    renderCategoryAndVarButtons();
    inspectPointAndVar(ptState.lat, ptState.lon, curVar, curUnit, false);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(startProUi, 200));
  } else {
    setTimeout(startProUi, 200);
  }

  setInterval(() => {
    scanGlobalMaps();
    const list = document.getElementById("ew-pro-var-list");
    if (list && list.children.length === 0) {
      renderCategoryAndVarButtons();
    }
  }, 1500);
})();

  function prettyVarName(key) {
    return String(key || "")
      .replace(/_(\d+)hPa$/, " ($1 hPa)")
      .replace(/_(\d+)m$/, " ($1 m)")
      .replace(/_/g, " ")
      .trim();
  }

  function fmtVal(v, unit) {
    if (!Number.isFinite(v)) return "-";
    if (unit === "m³/m³") return v.toFixed(3);
    if (unit === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || unit === "hPa" || unit === "m" || unit === "°" || unit === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function colorByNorm(t) {
    const k = Math.max(0, Math.min(1, Number.isFinite(t) ? t : 0.5));
    const i = Math.min(SCALE.length - 1, Math.floor(k * SCALE.length));
    return SCALE[i];
  }

  function getMap() {
    if (window.map) return window.map;
    if (window._map) return window._map;
    for (const m of boundMaps) return m;
    for (const k of Object.keys(window)) {
      try {
        const v = window[k];
        if (v && typeof v === "object" && typeof v.on === "function" && typeof v.addLayer === "function") return v;
      } catch (_) {}
    }
    return null;
  }

  function registerMap(m) {
    if (!m || typeof m.on !== "function" || m.__ewFullGridHook) return;
    m.__ewFullGridHook = true;
    boundMaps.add(m);

    const redraw = () => paintDataGridOnMap();
    m.on("moveend", redraw);
    m.on("zoomend", redraw);
    m.on("click", function (ev) {
      if (ev && ev.latlng && Number.isFinite(ev.latlng.lat) && Number.isFinite(ev.latlng.lng)) {
        activeCoord = { lat: Number(ev.latlng.lat), lon: Number(ev.latlng.lng) };
        loadAndApplyVariable(activeKey, activeUnit);
      }
    });
  }

  if (typeof window.L !== "undefined" && window.L.Map && window.L.Map.addInitHook && !window.__ewFullGridInitHook) {
    window.__ewFullGridInitHook = true;
    window.L.Map.addInitHook(function () {
      registerMap(this);
    });
  }

  function paintDataGridOnMap() {
    if (typeof window.L === "undefined") return;
    const mp = getMap();
    if (!mp || typeof mp.getBounds !== "function" || typeof mp.addLayer !== "function") return;

    if (!gridGroup) {
      gridGroup = window.L.layerGroup().addTo(mp);
    } else if (mp.hasLayer && !mp.hasLayer(gridGroup)) {
      gridGroup.addTo(mp);
    }
    gridGroup.clearLayers();

    const vals = (Array.isArray(activeSeries) ? activeSeries : []).filter(Number.isFinite);
    if (!vals.length && !Number.isFinite(activeNowVal)) return;

    let minV = vals.length ? Math.min(...vals) : activeNowVal;
    let maxV = vals.length ? Math.max(...vals) : activeNowVal;
    if (minV === maxV) {
      const pad = Math.max(Math.abs(minV) * 0.1, 1);
      minV -= pad;
      maxV += pad;
    }
    const span = Math.max(1e-6, maxV - minV);

    const b = mp.getBounds();
    const s = b.getSouth(), n = b.getNorth(), w = b.getWest(), e = b.getEast();
    const cols = 12;
    const rows = 9;
    const latStep = (n - s) / rows;
    const lonStep = (e - w) / cols;
    const centerLat = Number.isFinite(activeCoord.lat) ? activeCoord.lat : (n + s) * 0.5;
    const centerLon = Number.isFinite(activeCoord.lon) ? activeCoord.lon : (w + e) * 0.5;
    const maxDist = Math.max(1e-4, Math.hypot((n - s) * 0.5, (e - w) * 0.5));

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const y0 = s + r * latStep;
        const y1 = y0 + latStep;
        const x0 = w + c * lonStep;
        const x1 = x0 + lonStep;
        const cy = (y0 + y1) * 0.5;
        const cx = (x0 + x1) * 0.5;

        const idx = Math.min(vals.length - 1, Math.max(0, (r * cols + c) % Math.max(1, vals.length)));
        const serieSample = vals.length ? vals[idx] : activeNowVal;
        const distWeight = 1 - Math.min(1, Math.hypot(cy - centerLat, cx - centerLon) / maxDist);
        const cellVal = Number.isFinite(activeNowVal)
          ? (activeNowVal * (0.45 + 0.35 * distWeight) + serieSample * (0.55 - 0.35 * distWeight))
          : serieSample;

        const norm = (cellVal - minV) / span;
        const col = colorByNorm(norm);

        const cellRect = window.L.rectangle([[y0, x0], [y1, x1]], {
          stroke: false,
          fillColor: col,
          fillOpacity: 0.30,
          interactive: false
        });
        gridGroup.addLayer(cellRect);
      }
    }
  }

  function updateCbarWithVarAndUnit() {
    const cbar = document.getElementById("ew-cbar");
    if (!cbar) return;

    const pName = prettyVarName(activeKey);
    const unitTxt = activeUnit || "-";
    const nowFormatted = Number.isFinite(activeNowVal) ? `${fmtVal(activeNowVal, activeUnit)} ${activeUnit}`.trim() : `- ${activeUnit}`.trim();

    const vals = (Array.isArray(activeSeries) ? activeSeries : []).filter(Number.isFinite);
    let minV = vals.length ? Math.min(...vals) : NaN;
    let maxV = vals.length ? Math.max(...vals) : NaN;
    if (Number.isFinite(minV) && Number.isFinite(maxV) && minV === maxV) {
      minV -= 1;
      maxV += 1;
    }

    const titleEl = document.getElementById("ew-pro-cbar-title") || document.getElementById("ew-cbar-name") || document.getElementById("cbar-title");
    const valEl = document.getElementById("ew-pro-cbar-val") || document.getElementById("ew-cbar-cur");
    const gradEl = document.getElementById("ew-pro-cbar-grad") || document.getElementById("ew-cbar-gradient") || document.getElementById("ew-cbar-grad-bar");
    const binsEl = document.getElementById("ew-pro-cbar-bins") || document.getElementById("ew-cbar-bins") || document.getElementById("ew-cbar-bins-detail");

    if (titleEl) {
      titleEl.textContent = `${pName} · Birim: ${unitTxt}`;
    }
    if (valEl) {
      valEl.textContent = `${pName}: ${nowFormatted}`;
    }

    if (gradEl && binsEl && Number.isFinite(minV) && Number.isFinite(maxV)) {
      const bins = 6;
      const step = (maxV - minV) / bins;
      const stops = [];
      const pills = [];
      for (let i = 0; i < bins; i++) {
        const a = minV + i * step;
        const b = i === bins - 1 ? maxV : minV + (i + 1) * step;
        const col = SCALE[Math.min(SCALE.length - 1, Math.floor((i / bins) * SCALE.length))];
        stops.push(`${col} ${((i / (bins - 1)) * 100).toFixed(1)}%`);
        pills.push(`<span class="ew-pro-bin" style="border-left:4px solid ${col};">${fmtVal(a, activeUnit)}..${fmtVal(b, activeUnit)}</span>`);
      }
      gradEl.style.background = `linear-gradient(90deg, ${stops.join(", ")})`;
      binsEl.innerHTML = pills.join("");
    }

    document.querySelectorAll("button").forEach(btn => {
      const k = btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om);
      if (k) btn.classList.toggle("is-active", k === activeKey);
    });
  }

  async function loadAndApplyVariable(key, unitHint) {
    if (!key) return;
    activeKey = key;
    if (unitHint) activeUnit = unitHint;

    const cKey = `${activeCoord.lat.toFixed(3)},${activeCoord.lon.toFixed(3)}:${key}`;
    if (seriesCache.has(cKey)) {
      const hit = seriesCache.get(cKey);
      activeSeries = hit.series;
      activeNowVal = hit.nowVal;
      activeUnit = hit.unit || activeUnit;
      updateCbarWithVarAndUnit();
      paintDataGridOnMap();
      return;
    }

    updateCbarWithVarAndUnit();

    try {
      const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${activeCoord.lat.toFixed(4)}&longitude=${activeCoord.lon.toFixed(4)}&hourly=${encodeURIComponent(key)}&timezone=auto&forecast_days=7`;
      const res = await fetch(url);
      if (!res.ok) return;
      const json = await res.json();
      const raw = (json && json.hourly && Array.isArray(json.hourly[key])) ? json.hourly[key] : [];
      const times = (json && json.hourly && Array.isArray(json.hourly.time)) ? json.hourly.time : [];
      const apiUnit = (json && json.hourly_units && json.hourly_units[key]) ? json.hourly_units[key] : activeUnit;
      const series = raw.map(Number).filter(Number.isFinite);

      let bestIdx = 0, bestDiff = Infinity;
      const nowMs = Date.now();
      for (let i = 0; i < times.length; i++) {
        const ms = Date.parse(times[i]);
        if (Number.isFinite(ms) && Math.abs(ms - nowMs) < bestDiff) {
          bestDiff = Math.abs(ms - nowMs);
          bestIdx = i;
        }
      }
      const nowVal = series.length ? series[Math.min(series.length - 1, bestIdx)] : NaN;
      const pack = { series, nowVal, unit: apiUnit };
      seriesCache.set(cKey, pack);

      if (activeKey === key) {
        activeSeries = series;
        activeNowVal = nowVal;
        activeUnit = apiUnit;
        updateCbarWithVarAndUnit();
        paintDataGridOnMap();
      }
    } catch (_) {}
  }

  document.addEventListener("click", function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    const key = btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om);
    if (!key) return;
    const unit = (btn.dataset && btn.dataset.unit) || "";
    loadAndApplyVariable(key, unit);
  }, true);

  setInterval(() => {
    if (window.map) registerMap(window.map);
    if (window._map) registerMap(window._map);
    for (const k of Object.keys(window)) {
      try {
        const obj = window[k];
        if (obj && typeof obj === "object" && typeof obj.on === "function" && typeof obj.getBounds === "function") {
          registerMap(obj);
        }
      } catch (_) {}
    }
    updateCbarWithVarAndUnit();
    paintDataGridOnMap();
  }, 1200);

  setTimeout(() => loadAndApplyVariable(activeKey, activeUnit), 300);
})();
</script>

<script>
(function () {
  const geoStore = new Map();
  const valStore = new Map();
  const hookedMaps = new Set();

  let pickedPoint = { lat: 41.0082, lon: 28.9784, hasPick: false };
  let pickedPlace = { il: "İstanbul", ilce: "Fatih", mahalle: "Eminönü" };
  let chosenVar = { key: "temperature_2m", unit: "°C", val: NaN, series: [] };
  let reqToken = 0;

  function labelFromKey(key) {
    return String(key || "")
      .replace(/_(\d+)hPa$/, " ($1 hPa)")
      .replace(/_(\d+)m$/, " ($1 m)")
      .replace(/_/g, " ")
      .trim();
  }

  function formatNumber(v, unit) {
    if (!Number.isFinite(v)) return "-";
    if (unit === "m³/m³") return v.toFixed(3);
    if (unit === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || unit === "hPa" || unit === "m" || unit === "°" || unit === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function detectSelectedVariable() {
    const activeBtn = document.querySelector(
      ".ew-cat-var-item-btn.is-active, .ew-simple-var-btn.is-active, .ew-grouped-var-btn.is-active, .ew-125-var-btn.is-active, .ew-pro-var-btn.is-active, .ew-ecmwf-btn.is-active"
    );
    if (activeBtn && activeBtn.dataset) {
      const k = activeBtn.dataset.key || activeBtn.dataset.varKey || activeBtn.dataset.om;
      if (k) {
        return {
          key: k,
          unit: activeBtn.dataset.unit || chosenVar.unit || ""
        };
      }
    }
    return { key: chosenVar.key || "temperature_2m", unit: chosenVar.unit || "°C" };
  }

  function ensureRightPanelDom() {
    let panel = document.getElementById("ew-dual-panel");
    if (!panel) {
      panel = document.createElement("aside");
      panel.id = "ew-dual-panel";
      document.body.appendChild(panel);
    }

    if (!document.getElementById("ew-rp-coord") || !document.getElementById("ew-rp-il-ilce") || !document.getElementById("ew-rp-mahalle") || !document.getElementById("ew-rp-var-val")) {
      panel.innerHTML = `
        <div class="ew-pro-top-coord">
          <span>KOORDİNAT</span>
          <span class="ew-pro-coord-pill" id="ew-rp-coord">41.0082°N, 28.9784°E</span>
        </div>
        <div class="ew-pro-loc-box">
          <div class="ew-pro-loc-il-ilce" id="ew-rp-il-ilce">İstanbul / Fatih</div>
          <div class="ew-pro-loc-mahalle" id="ew-rp-mahalle">Mahalle: -</div>
        </div>
        <div class="ew-pro-val-box">
          <div class="ew-pro-card">
            <div class="ew-pro-card-lbl" id="ew-rp-var-lbl">Seçili Değişken</div>
            <div class="ew-pro-card-val" id="ew-rp-var-val">-</div>
            <div class="ew-pro-card-sub" id="ew-rp-var-sub">Birim: -</div>
          </div>
          <div class="ew-pro-card">
            <div class="ew-pro-card-lbl">Min .. Max</div>
            <div class="ew-pro-card-val" id="ew-rp-range-val">-</div>
            <div class="ew-pro-card-sub" id="ew-rp-coord-sub">Nokta Değeri</div>
          </div>
        </div>
      `;
    }
    return panel;
  }

  function renderRightPanelNow() {
    ensureRightPanelDom();
    const vName = labelFromKey(chosenVar.key);
    const unit = chosenVar.unit || "";
    const valText = Number.isFinite(chosenVar.val)
      ? `${formatNumber(chosenVar.val, unit)} ${unit}`.trim()
      : `- ${unit}`.trim();

    const s = (chosenVar.series || []).filter(Number.isFinite);
    const minText = s.length ? formatNumber(Math.min(...s), unit) : "-";
    const maxText = s.length ? formatNumber(Math.max(...s), unit) : "-";

    const coordEl = document.getElementById("ew-rp-coord");
    const ilIlceEl = document.getElementById("ew-rp-il-ilce");
    const mahEl = document.getElementById("ew-rp-mahalle");
    const vLblEl = document.getElementById("ew-rp-var-lbl");
    const vValEl = document.getElementById("ew-rp-var-val");
    const vSubEl = document.getElementById("ew-rp-var-sub");
    const rValEl = document.getElementById("ew-rp-range-val");
    const cSubEl = document.getElementById("ew-rp-coord-sub");

    if (coordEl) {
      coordEl.textContent = `${pickedPoint.lat.toFixed(4)}°N, ${pickedPoint.lon.toFixed(4)}°E`;
    }
    if (ilIlceEl) {
      const ilIlce = [pickedPlace.il, pickedPlace.ilce].filter(Boolean).join(" / ");
      ilIlceEl.textContent = ilIlce || "Konum";
    }
    if (mahEl) {
      mahEl.textContent = `Mahalle: ${pickedPlace.mahalle || "-"}`;
    }
    if (vLblEl) {
      vLblEl.textContent = vName;
    }
    if (vValEl) {
      vValEl.textContent = valText;
    }
    if (vSubEl) {
      vSubEl.textContent = `Birim: ${unit || "-"}`;
    }
    if (rValEl) {
      rValEl.textContent = `${minText} .. ${maxText}`;
    }
    if (cSubEl) {
      cSubEl.textContent = `${pickedPoint.lat.toFixed(2)}°N, ${pickedPoint.lon.toFixed(2)}°E`;
    }
  }

  async function lookupGeo(lat, lon) {
    const k = `${lat.toFixed(4)},${lon.toFixed(4)}`;
    if (geoStore.has(k)) return geoStore.get(k);
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=17&addressdetails=1&accept-language=tr`;
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("geo " + res.status);
    const data = await res.json();
    const a = (data && data.address) || {};
    const out = {
      il: a.province || a.state || a.city || a.region || "Açık Alan / Deniz",
      ilce: a.town || a.county || a.city_district || a.district || a.municipality || "",
      mahalle: a.neighbourhood || a.suburb || a.quarter || a.village || a.hamlet || a.road || "-"
    };
    geoStore.set(k, out);
    return out;
  }

  async function lookupVarAtPoint(lat, lon, key, fallbackUnit) {
    const k = `${lat.toFixed(3)},${lon.toFixed(3)}:${key}`;
    if (valStore.has(k)) return valStore.get(k);
    const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&hourly=${encodeURIComponent(key)}&timezone=auto&forecast_days=7`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("ecmwf " + res.status);
    const json = await res.json();
    const raw = (json && json.hourly && Array.isArray(json.hourly[key])) ? json.hourly[key] : [];
    const times = (json && json.hourly && Array.isArray(json.hourly.time)) ? json.hourly.time : [];
    const unit = (json && json.hourly_units && json.hourly_units[key]) ? json.hourly_units[key] : (fallbackUnit || "");
    const series = raw.map(Number).filter(Number.isFinite);

    let bestIdx = 0, bestDiff = Infinity;
    const nowMs = Date.now();
    for (let i = 0; i < times.length; i++) {
      const ms = Date.parse(times[i]);
      if (Number.isFinite(ms) && Math.abs(ms - nowMs) < bestDiff) {
        bestDiff = Math.abs(ms - nowMs);
        bestIdx = i;
      }
    }
    const val = series.length ? series[Math.min(series.length - 1, bestIdx)] : NaN;
    const out = { val, unit, series };
    valStore.set(k, out);
    return out;
  }

  async function refreshPickedPointAndVar(lat, lon, vSpec) {
    const myToken = ++reqToken;
    pickedPoint.lat = lat;
    pickedPoint.lon = lon;
    pickedPoint.hasPick = true;
    chosenVar.key = vSpec.key;
    chosenVar.unit = vSpec.unit;
    chosenVar.val = NaN;
    renderRightPanelNow();

    const [gRes, vRes] = await Promise.allSettled([
      lookupGeo(lat, lon),
      lookupVarAtPoint(lat, lon, vSpec.key, vSpec.unit)
    ]);

    if (myToken !== reqToken) return;

    if (gRes.status === "fulfilled" && gRes.value) {
      pickedPlace = gRes.value;
    }
    if (vRes.status === "fulfilled" && vRes.value) {
      chosenVar.val = vRes.value.val;
      chosenVar.unit = vRes.value.unit || vSpec.unit;
      chosenVar.series = vRes.value.series;
    }
    renderRightPanelNow();
  }

  function hookMap(mp) {
    if (!mp || typeof mp.on !== "function" || mp.__ewRightPanelHook) return;
    mp.__ewRightPanelHook = true;
    hookedMaps.add(mp);

    mp.on("click", function (ev) {
      if (ev && ev.latlng && Number.isFinite(ev.latlng.lat) && Number.isFinite(ev.latlng.lng)) {
        const vSpec = detectSelectedVariable();
        refreshPickedPointAndVar(Number(ev.latlng.lat), Number(ev.latlng.lng), vSpec);
      }
    });
  }

  if (typeof window.L !== "undefined" && window.L.Map && window.L.Map.addInitHook && !window.__ewRightPanelInit) {
    window.__ewRightPanelInit = true;
    window.L.Map.addInitHook(function () {
      hookMap(this);
    });
  }

  document.addEventListener("click", function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    const k = btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om);
    if (!k) return;
    const u = (btn.dataset && btn.dataset.unit) || "";
    setTimeout(() => {
      refreshPickedPointAndVar(pickedPoint.lat, pickedPoint.lon, { key: k, unit: u });
    }, 10);
  }, true);

  setInterval(() => {
    if (window.map) hookMap(window.map);
    if (window._map) hookMap(window._map);
    for (const key of Object.keys(window)) {
      try {
        const obj = window[key];
        if (obj && typeof obj === "object" && typeof obj.on === "function" && typeof obj.getCenter === "function") {
          hookMap(obj);
        }
      } catch (_) {}
    }
    renderRightPanelNow();
  }, 800);

  setTimeout(() => {
    refreshPickedPointAndVar(pickedPoint.lat, pickedPoint.lon, detectSelectedVariable());
  }, 250);
})();
</script>
