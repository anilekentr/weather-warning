<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eken Weather — ECMWF</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    #smooth-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 420;
      filter: blur(14px);
    }

    .panel-box {
      position: fixed;
      z-index: 950;
      background: rgba(11, 17, 30, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }

    #cbar-box {
      top: 10px;
      right: 10px;
      width: 176px;
      padding: 6px 8px;
      font-size: 10px;
      border-radius: 7px;
    }
    #cbar-top { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
    #cbar-unit { color: #7dd3fc; }
    #cbar-grad {
      width: 100%;
      height: 9px;
      border-radius: 3px;
      background: linear-gradient(90deg, #2563eb 0%, #06b6d4 25%, #22c55e 50%, #eab308 75%, #ef4444 100%);
    }
    #cbar-ticks {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    #simple-panel {
      left: 10px;
      right: auto;
      bottom: 10px;
      width: min(680px, calc(100vw - 20px));
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
      border-radius: 8px;
    }
    .line {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .line::-webkit-scrollbar { display: none; }
    .line.vars {
      gap: 4px;
      padding-top: 1px;
    }
    .tag-title { font-weight: 700; color: #7dd3fc; font-size: 10px; }
    .muted { color: #cbd5e1; }
    .val-hi { font-weight: 700; color: #38bdf8; }

    select, input, button {
      background: rgba(30, 41, 59, 0.92);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 10px;
      line-height: 1.2;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }
    input[type="date"] { padding: 2px 5px; }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="cbar-box" class="panel-box">
    <div id="cbar-top">
      <span id="cbar-name">2 m Sıcaklığı</span>
      <span id="cbar-unit">°C</span>
    </div>
    <div id="cbar-grad"></div>
    <div id="cbar-ticks"><span>--</span><span>--</span><span>--</span></div>
  </div>

  <div id="simple-panel" class="panel-box">
    <div class="line">
      <span class="tag-title">ECMWF</span>
      <span id="ecmwf-range" class="muted">Aralık: --</span>
      <span class="muted">|</span>
      <span id="live-clocks" class="muted">UTC: -- | İstanbul (TSİ): --</span>
    </div>
    <div class="line">
      <input id="date-input" type="date" />
      <select id="hour-select"></select>
      <button id="btn-refresh" type="button">Yenile</button>
      <span id="point-summary" class="val-hi">İstanbul (41.0082, 28.9784) · 2 m Sıcaklığı: -- °C</span>
      <span id="point-addr" class="muted">İstanbul · Fatih · Eminönü · Hobyar Mah.</span>
    </div>
    <div id="var-row" class="line vars"></div>
  </div>

  <script>
  (function() {
    const VARS = [
      { key: "temperature_2m", name: "2 m Sıcaklığı", unit: "°C", palette: [[37,99,235],[6,182,212],[34,197,94],[234,179,8],[239,68,68]] },
      { key: "dew_point_2m", name: "2 m Çiy Noktası", unit: "°C", palette: [[30,64,175],[14,165,233],[45,212,191],[163,230,53],[245,158,11]] },
      { key: "wind_speed_10m", name: "10 m Rüzgar Hızı", unit: "m/s", palette: [[22,163,74],[132,204,22],[234,179,8],[249,115,22],[220,38,38]] },
      { key: "wind_direction_10m", name: "10 m Rüzgar Yönü", unit: "°", palette: [[59,130,246],[6,182,212],[16,185,129],[245,158,11],[239,68,68]] },
      { key: "precipitation", name: "Toplam Yağış", unit: "mm", palette: [[30,58,138],[37,99,235],[6,182,212],[52,211,153],[250,204,21]] },
      { key: "pressure_msl", name: "Deniz Seviyesi Basıncı", unit: "hPa", palette: [[124,58,237],[37,99,235],[34,197,94],[234,179,8],[239,68,68]] },
      { key: "cloud_cover", name: "Toplam Bulutluluk", unit: "%", palette: [[14,165,233],[56,189,248],[148,163,184],[100,116,139],[51,65,85]] },
      { key: "cape", name: "CAPE", unit: "J/kg", palette: [[34,197,94],[163,230,53],[250,204,21],[249,115,22],[220,38,38]] },
      { key: "temperature_850hPa", name: "850 hPa Sıcaklık", unit: "°C", palette: [[29,78,216],[6,182,212],[34,197,94],[234,179,8],[239,68,68]] },
      { key: "wind_speed_850hPa", name: "850 hPa Rüzgar Hızı", unit: "m/s", palette: [[16,185,129],[132,204,22],[234,179,8],[249,115,22],[239,68,68]] },
      { key: "geopotential_height_500hPa", name: "500 hPa Jeopotansiyel", unit: "gpm", palette: [[37,99,235],[14,165,233],[34,197,94],[234,179,8],[239,68,68]] },
      { key: "temperature_500hPa", name: "500 hPa Sıcaklık", unit: "°C", palette: [[30,64,175],[6,182,212],[52,211,153],[250,204,21],[239,68,68]] },
      { key: "wind_speed_500hPa", name: "500 hPa Rüzgar Hızı", unit: "m/s", palette: [[22,163,74],[132,204,22],[234,179,8],[249,115,22],[220,38,38]] }
    ];

    const SAMPLE_GRID = (() => {
      const pts = [];
      for (let lat = 38.0; lat <= 43.0; lat += 0.6) {
        for (let lon = 25.0; lon <= 32.5; lon += 0.75) {
          pts.push({ lat: Number(lat.toFixed(2)), lon: Number(lon.toFixed(2)) });
        }
      }
      for (let lat = -60; lat <= 75; lat += 25) {
        for (let lon = -165; lon <= 165; lon += 30) {
          pts.push({ lat, lon });
        }
      }
      return pts;
    })();

    const map = L.map("map", { center: [40.85, 29.0], zoom: 7, preferCanvas: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap",
      maxZoom: 18
    }).addTo(map);

    const canvas = document.createElement("canvas");
    canvas.id = "smooth-canvas";
    map.getContainer().appendChild(canvas);
    const ctx = canvas.getContext("2d");

    let curVar = VARS[0];
    let curCoord = { lat: 41.0082, lon: 28.9784 };
    let curAddr = "İstanbul · Fatih · Eminönü · Hobyar Mah.";
    let lastAddrKey = "";
    let gridData = null;
    let pointData = null;

    function updateClocks() {
      const now = new Date();
      const utcStr = now.toISOString().replace("T", " ").slice(0, 19) + " UTC";
      const istStr = now.toLocaleString("tr-TR", {
        timeZone: "Europe/Istanbul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
      const el = document.getElementById("live-clocks");
      if (el) el.textContent = `UTC: ${utcStr} | İstanbul (TSİ): ${istStr}`;
    }

    function applyPalette(v) {
      const grad = document.getElementById("cbar-grad");
      document.getElementById("cbar-name").textContent = v.name;
      document.getElementById("cbar-unit").textContent = v.unit;
      const parts = v.palette.map((c, idx) => `rgb(${c[0]},${c[1]},${c[2]}) ${Math.round((idx / (v.palette.length - 1)) * 100)}%`);
      grad.style.background = `linear-gradient(90deg, ${parts.join(", ")})`;
    }

    function sampleRgb(val, minV, maxV, palette) {
      const t = Math.max(0, Math.min(1, (val - minV) / Math.max(1e-6, maxV - minV)));
      const s = t * (palette.length - 1);
      const i = Math.min(palette.length - 2, Math.floor(s));
      const f = s - i;
      const c0 = palette[i], c1 = palette[i + 1];
      return [
        Math.round(c0[0] + (c1[0] - c0[0]) * f),
        Math.round(c0[1] + (c1[1] - c0[1]) * f),
        Math.round(c0[2] + (c1[2] - c0[2]) * f)
      ];
    }

    function buildVarRow() {
      const row = document.getElementById("var-row");
      row.innerHTML = "";
      VARS.forEach((v, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = `${v.name} (${v.unit})`;
        if (idx === 0) btn.classList.add("active");
        btn.addEventListener("click", async () => {
          row.querySelectorAll("button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          curVar = v;
          gridData = null;
          pointData = null;
          applyPalette(v);
          await loadAndRender(false, false);
        });
        row.appendChild(btn);
      });
      applyPalette(curVar);
    }

    function syncTimeControls(times, forceHourPick) {
      const dIn = document.getElementById("date-input");
      const hSel = document.getElementById("hour-select");
      const rangeEl = document.getElementById("ecmwf-range");
      if (!times || !times.length) return { idx: 0, iso: "" };

      const dates = [...new Set(times.map(t => t.slice(0, 10)))];
      const minD = dates[0], maxD = dates[dates.length - 1];
      dIn.min = minD;
      dIn.max = maxD;
      if (!dIn.value || dIn.value < minD || dIn.value > maxD) {
        const nowDay = new Date().toISOString().slice(0, 10);
        dIn.value = dates.includes(nowDay) ? nowDay : minD;
      }

      const dayTimes = times.filter(t => t.startsWith(dIn.value));
      const prevHour = hSel.value;
      hSel.innerHTML = "";
      dayTimes.forEach(t => {
        const hh = t.slice(11, 16);
        const opt = document.createElement("option");
        opt.value = hh;
        opt.textContent = `${hh} UTC`;
        hSel.appendChild(opt);
      });

      if (!forceHourPick && prevHour && [...hSel.options].some(o => o.value === prevHour)) {
        hSel.value = prevHour;
      } else if (hSel.options.length) {
        const curUtcH = String(new Date().getUTCHours()).padStart(2, "0") + ":00";
        const match = [...hSel.options].find(o => o.value === curUtcH);
        hSel.value = match ? match.value : hSel.options[0].value;
      }

      const targetIso = `${dIn.value}T${hSel.value}`;
      let idx = times.indexOf(targetIso);
      if (idx < 0) idx = times.findIndex(t => t.startsWith(dIn.value));
      if (idx < 0) idx = 0;

      if (rangeEl) {
        rangeEl.textContent = `Tarih Aralığı: ${minD} → ${maxD} · Seçili: ${(times[idx] || targetIso).replace("T", " ")} UTC`;
      }
      return { idx, iso: times[idx] || targetIso };
    }

    async function fetchEcmwf() {
      if (!gridData) {
        const lats = SAMPLE_GRID.map(p => p.lat).join(",");
        const lons = SAMPLE_GRID.map(p => p.lon).join(",");
        const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${lats}&longitude=${lons}&hourly=${encodeURIComponent(curVar.key)}&wind_speed_unit=ms&timezone=UTC&forecast_days=5`;
        const res = await fetch(url);
        if (res.ok) gridData = await res.json();
      }
      const pUrl = `https://api.open-meteo.com/v1/ecmwf?latitude=${encodeURIComponent(curCoord.lat)}&longitude=${encodeURIComponent(curCoord.lon)}&hourly=${encodeURIComponent(curVar.key)}&wind_speed_unit=ms&timezone=UTC&forecast_days=5`;
      const pRes = await fetch(pUrl);
      if (pRes.ok) pointData = await pRes.json();
    }

    async function fetchAddress(lat, lon) {
      const k = `${lat.toFixed(3)},${lon.toFixed(3)}`;
      if (k === lastAddrKey) return curAddr;
      lastAddrKey = k;
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1&accept-language=tr`;
        const res = await fetch(url);
        if (res.ok) {
          const j = await res.json();
          const a = j.address || {};
          const parts = [
            a.province || a.city || a.state || a.county,
            a.town || a.city_district || a.district,
            a.suburb || a.neighbourhood,
            a.quarter || a.residential || a.hamlet || a.road
          ].filter((v, i, arr) => v && arr.indexOf(v) === i);
          curAddr = parts.length ? parts.join(" · ") : (j.display_name || `${lat.toFixed(4)}, ${lon.toFixed(4)}`);
        }
      } catch (_) {}
      return curAddr;
    }

    function renderCanvas(forceHourPick) {
      if (!gridData) return;
      const list = Array.isArray(gridData) ? gridData : [gridData];
      const times = (list[0] && list[0].hourly && list[0].hourly.time) || [];
      const { idx } = syncTimeControls(times, forceHourPick);

      const sz = map.getSize();
      if (!sz || sz.x <= 0 || sz.y <= 0) return;
      const w = Math.max(120, Math.floor(sz.x / 3));
      const h = Math.max(90, Math.floor(sz.y / 3));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }

      const pts = [];
      list.forEach((item, i) => {
        const arr = (item && item.hourly && item.hourly[curVar.key]) || [];
        const val = arr[idx];
        const g = SAMPLE_GRID[i];
        if (!g || typeof val !== "number" || !Number.isFinite(val)) return;
        const px = map.latLngToContainerPoint([g.lat, g.lon]);
        pts.push({ x: px.x / 3, y: px.y / 3, val });
      });
      if (!pts.length) return;

      const minV = Math.min(...pts.map(p => p.val));
      const maxV = Math.max(...pts.map(p => p.val));
      document.getElementById("cbar-ticks").innerHTML = `<span>${minV.toFixed(1)} ${curVar.unit}</span><span>${((minV + maxV) / 2).toFixed(1)}</span><span>${maxV.toFixed(1)} ${curVar.unit}</span>`;

      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let y = 0; y < h; y += 2) {
        for (let x = 0; x < w; x += 2) {
          let wSum = 0, vSum = 0;
          for (let k = 0; k < pts.length; k++) {
            const dx = x - pts[k].x;
            const dy = y - pts[k].y;
            const d2 = dx * dx + dy * dy + 220;
            const wt = 1.0 / (d2 * Math.sqrt(d2));
            wSum += wt;
            vSum += wt * pts[k].val;
          }
          const v = wSum > 0 ? vSum / wSum : minV;
          const [r, g, b] = sampleRgb(v, minV, maxV, curVar.palette);
          for (let oy = 0; oy < 2 && y + oy < h; oy++) {
            for (let ox = 0; ox < 2 && x + ox < w; ox++) {
              const pIdx = ((y + oy) * w + (x + ox)) * 4;
              d[pIdx] = r;
              d[pIdx + 1] = g;
              d[pIdx + 2] = b;
              d[pIdx + 3] = 115;
            }
          }
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    function renderPoint(forceHourPick) {
      const times = (pointData && pointData.hourly && pointData.hourly.time) || [];
      const { idx, iso } = syncTimeControls(times, forceHourPick);
      const arr = (pointData && pointData.hourly && pointData.hourly[curVar.key]) || [];
      const raw = arr[idx];
      const valText = (typeof raw === "number" && Number.isFinite(raw))
        ? `${raw.toFixed(2)} ${curVar.unit}`
        : `-- ${curVar.unit}`;

      const istHourStr = iso ? new Date(iso + ":00Z").toLocaleString("tr-TR", {
        timeZone: "Europe/Istanbul",
        hour: "2-digit",
        minute: "2-digit"
      }) : "--";

      document.getElementById("point-summary").textContent =
        `(${curCoord.lat.toFixed(4)}, ${curCoord.lon.toFixed(4)}) · ${curVar.name}: ${valText} · ${iso ? iso.replace("T", " ") + " UTC" : "--"} / ${istHourStr} TSİ`;
      document.getElementById("point-addr").textContent = curAddr;
    }

    async function loadAndRender(needAddr, forceHourPick) {
      if (needAddr) await fetchAddress(curCoord.lat, curCoord.lon);
      await fetchEcmwf();
      renderCanvas(forceHourPick);
      renderPoint(forceHourPick);
    }

    buildVarRow();
    updateClocks();
    setInterval(updateClocks, 1000);
    setTimeout(() => map.invalidateSize(), 200);

    document.getElementById("date-input").addEventListener("change", () => {
      renderCanvas(true);
      renderPoint(true);
    });
    document.getElementById("hour-select").addEventListener("change", () => {
      renderCanvas(false);
      renderPoint(false);
    });
    document.getElementById("btn-refresh").addEventListener("click", async () => {
      gridData = null;
      pointData = null;
      await loadAndRender(true, true);
    });
    map.on("moveend zoomend resize", () => renderCanvas(false));
    map.on("click", async (e) => {
      curCoord = { lat: e.latlng.lat, lon: e.latlng.lng };
      await loadAndRender(true, false);
    });

    loadAndRender(true, true);
  })();
  </script>
</body>
</html>
