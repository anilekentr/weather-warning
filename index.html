    { om: "wind_speed_80m", name: "80m Rüzgar Hızı", unit: "km/h", palette: ["#eff6ff", "#bfdbfe", "#60a5fa", "#22c55e", "#eab308", "#ef4444"] },
    { om: "wind_speed_120m", name: "120m Rüzgar Hızı", unit: "km/h", palette: ["#f0f9ff", "#bae6fd", "#38bdf8", "#2dd4bf", "#f59e0b", "#e11d48"] },
    { om: "wind_direction_10m", name: "10m Rüzgar Yönü", unit: "°", palette: ["#3b82f6", "#06b6d4", "#10b981", "#eab308", "#f97316", "#ef4444", "#8b5cf6", "#3b82f6"] },
    { om: "wind_gusts_10m", name: "10m Hamle", unit: "km/h", palette: ["#fef9c3", "#fde047", "#fb923c", "#ef4444", "#991b1b"] },
    { om: "soil_temperature_0_to_7cm", name: "Toprak Sıcaklığı", unit: "°C", palette: ["#1e3a8a", "#0284c7", "#34d399", "#fde047", "#f97316", "#b91c1c"] },
    { om: "soil_moisture_0_to_7cm", name: "Toprak Nemi", unit: "m³/m³", palette: ["#fef3c7", "#fcd34d", "#6ee7b7", "#38bdf8", "#1d4ed8"] }
  ];

  const dynamicRanges = new Map();
  let activeOm = "temperature_2m";
  let currentCoords = { lat: null, lon: null };

  const KEEP_IDS = new Set([
    "ew-dual-panel", "ew-panel-coords-top", "ew-panel-coord-vals",
    "ew-subpanel-live", "ew-subpanel-range", "ew-panel-range-foot",
    "ew-sp-live-val", "ew-sp-live-meta", "ew-sp-range-val", "ew-sp-range-meta",
    "ew-sp-var-badge", "ew-sp-time-badge",
    "ew-ecmwf-var-bar", "ew-cbar", "cbar-title", "ew-cbar-grad-bar", "ew-cbar-bins-detail"
  ]);

  function getVarDef(omCode) {
    return ECMWF_CATALOG.find(item => item.om === omCode) || {
      om: omCode, name: omCode, unit: "",
      palette: ["#38bdf8", "#22c55e", "#facc15", "#f97316", "#ef4444"]
    };
  }

  function hexToRgb(hex) {
    const clean = String(hex || "#38bdf8").replace("#", "").trim();
    const full = clean.length === 3 ? clean.split("").map(c => c + c).join("") : clean.padEnd(6, "0").slice(0, 6);
    const n = parseInt(full, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function lerpColor(c1, c2, t) {
    const k = Math.max(0, Math.min(1, Number.isFinite(t) ? t : 0));
    const a = hexToRgb(c1), b = hexToRgb(c2);
    return `rgb(${Math.round(a.r + (b.r - a.r) * k)}, ${Math.round(a.g + (b.g - a.g) * k)}, ${Math.round(a.b + (b.b - a.b) * k)})`;
  }

  function samplePalette(palette, t) {
    const list = Array.isArray(palette) && palette.length ? palette : ["#3b82f6", "#10b981", "#f59e0b", "#ef4444"];
    if (list.length === 1) return list[0];
    const s = Math.max(0, Math.min(1, t)) * (list.length - 1);
    const i = Math.min(list.length - 2, Math.floor(s));
    return lerpColor(list[i], list[i + 1], s - i);
  }

  function fmt(num, unit) {
    if (!Number.isFinite(num)) return "-";
    if (unit === "m³/m³") return num.toFixed(3);
    if (Math.abs(num) >= 100 || unit === "hPa" || unit === "m" || unit === "°") return num.toFixed(1);
    return num.toFixed(2);
  }

  function computeBins(values, def) {
    const nums = (Array.isArray(values) ? values : []).map(Number).filter(v => Number.isFinite(v));
    if (!nums.length) return { min: 0, max: 1, bins: [], hasData: false };
    let minVal = Math.min(...nums);
    let maxVal = Math.max(...nums);
    if (minVal === maxVal) {
      const pad = Math.max(Math.abs(minVal) * 0.1, 1);
      minVal -= pad;
      maxVal += pad;
    }
    const pal = Array.isArray(def.palette) && def.palette.length >= 2 ? def.palette : ["#38bdf8", "#10b981", "#f59e0b", "#ef4444"];
    const binCount = Math.min(8, Math.max(4, pal.length));
    const step = (maxVal - minVal) / binCount;
    const bins = [];
    for (let i = 0; i < binCount; i++) {
      bins.push({
        index: i,
        from: minVal + i * step,
        to: i === binCount - 1 ? maxVal : minVal + (i + 1) * step,
        color: samplePalette(pal, (i + 0.5) / binCount)
      });
    }
    return { min: minVal, max: maxVal, bins, hasData: true };
  }

  function extractSeries(omCode) {
    const vals = [];
    let times = [];
    try {
      if (typeof findLiveSeriesForCode === "function") {
        const s = findLiveSeriesForCode(omCode);
        if (s && Array.isArray(s.values)) {
          s.values.forEach(v => { if (Number.isFinite(Number(v))) vals.push(Number(v)); });
          if (Array.isArray(s.times)) times = s.times;
        }
      }
    } catch (_) {}

    if (!vals.length) {
      try {
        if (typeof gridPayload !== "undefined" && gridPayload && gridPayload.raw) {
          const raw = gridPayload.raw;
          const h = Array.isArray(raw) ? (raw[0] && raw[0].hourly ? raw[0].hourly : null) : (raw.hourly || null);
          if (h && Array.isArray(h[omCode])) {
            h[omCode].forEach(v => { if (Number.isFinite(Number(v))) vals.push(Number(v)); });
            if (Array.isArray(h.time)) times = h.time;
          }
        }
      } catch (_) {}
    }

    let stepIdx = 0;
    try {
      if (typeof pState !== "undefined" && pState && Number.isFinite(Number(pState.stepIdx))) {
        stepIdx = Math.max(0, Number(pState.stepIdx));
      }
    } catch (_) {}

    const idx = vals.length ? Math.min(vals.length - 1, stepIdx) : -1;
    const currentVal = idx >= 0 ? vals[idx] : NaN;
    const timeLabel = (times && idx >= 0 && times[idx]) ? String(times[idx]).replace("T", " ").slice(0, 16) : "";
    const minVal = vals.length ? Math.min(...vals) : NaN;
    const maxVal = vals.length ? Math.max(...vals) : NaN;
    return { vals, currentVal, minVal, maxVal, timeLabel };
  }

  function resolveCoords() {
    let lat = currentCoords.lat, lon = currentCoords.lon;
    try {
      if (typeof pState !== "undefined" && pState) {
        const a = Number(pState.lat ?? pState.selectedLat);
        const b = Number(pState.lon ?? pState.lng ?? pState.selectedLon);
        if (Number.isFinite(a) && Number.isFinite(b)) { lat = a; lon = b; }
      }
    } catch (_) {}
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
      try {
        const m = window.map || window._map || null;
        if (m && typeof m.getCenter === "function") {
          const c = m.getCenter();
          if (c && Number.isFinite(c.lat) && Number.isFinite(c.lng)) { lat = c.lat; lon = c.lng; }
        }
      } catch (_) {}
    }
    if (Number.isFinite(lat) && Number.isFinite(lon)) currentCoords = { lat, lon };
    return currentCoords;
  }

  function ensureUi() {
    if (!document.getElementById("ew-ecmwf-var-bar")) {
      const bar = document.createElement("div");
      bar.id = "ew-ecmwf-var-bar";
      ECMWF_CATALOG.forEach(item => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ew-ecmwf-btn" + (item.om === activeOm ? " is-active" : "");
        btn.dataset.om = item.om;
        btn.textContent = item.unit ? `${item.name} (${item.unit})` : item.name;
        btn.addEventListener("click", () => activateVar(item.om));
        bar.appendChild(btn);
      });
      document.body.appendChild(bar);
    }

    if (!document.getElementById("ew-dual-panel")) {
      const panel = document.createElement("aside");
      panel.id = "ew-dual-panel";
      panel.innerHTML = `
        <div id="ew-panel-coords-top">
          <span>Koordinat</span>
          <span id="ew-panel-coord-vals" class="ew-coord-pill">Lat: - · Lon: -</span>
        </div>
        <div class="ew-subpanels-grid">
          <div class="ew-subpanel" id="ew-subpanel-live">
            <div class="ew-subpanel-label">Seçili Değer</div>
            <div class="ew-subpanel-val" id="ew-sp-live-val">-</div>
            <div class="ew-subpanel-meta" id="ew-sp-live-meta">Değişken · Birim</div>
          </div>
          <div class="ew-subpanel" id="ew-subpanel-range">
            <div class="ew-subpanel-label">Veri Aralığı</div>
            <div class="ew-subpanel-val" id="ew-sp-range-val">-</div>
            <div class="ew-subpanel-meta" id="ew-sp-range-meta">Gelen veriye göre</div>
          </div>
        </div>
        <div id="ew-panel-range-foot">
          <span id="ew-sp-var-badge">ECMWF</span>
          <span id="ew-sp-time-badge"></span>
        </div>
      `;
      document.body.appendChild(panel);
    }
  }

  function purgeLegacy() {
    document.querySelectorAll('[id*="ecmwf" i], [class*="ecmwf" i], [id*="cbar" i], [class*="cbar" i], [id*="colorbar" i], [class*="colorbar" i]').forEach(el => {
      if (!el || el.nodeType !== 1) return;
      if (KEEP_IDS.has(el.id)) return;
      if (el.closest("#ew-dual-panel, #ew-ecmwf-var-bar, #ew-cbar, .leaflet-control-zoom")) return;
      if (el.classList && (el.classList.contains("ew-ecmwf-btn") || el.classList.contains("ew-cbar-chip"))) return;
      const idCls = `${el.id || ""} ${typeof el.className === "string" ? el.className : ""}`.toLowerCase();
      const oldPanel = (idCls.includes("ecmwf") && (idCls.includes("panel") || idCls.includes("box") || idCls.includes("card") || idCls.includes("drawer"))) && !idCls.includes("btn");
      const oldCbar = (idCls.includes("cbar") || idCls.includes("colorbar")) && el.id !== "ew-cbar";
      if (oldPanel || oldCbar) el.remove();
    });
  }

  function syncAll() {
    ensureUi();
    purgeLegacy();

    const def = getVarDef(activeOm);
    const series = extractSeries(activeOm);
    const range = computeBins(series.vals, def);
    if (range.hasData) dynamicRanges.set(activeOm, range);
    const activeRange = dynamicRanges.get(activeOm) || range;
    const coords = resolveCoords();

    const coordEl = document.getElementById("ew-panel-coord-vals");
    if (coordEl) {
      coordEl.textContent = (Number.isFinite(coords.lat) && Number.isFinite(coords.lon))
        ? `Lat: ${coords.lat.toFixed(4)}° · Lon: ${coords.lon.toFixed(4)}°`
        : "Lat: - · Lon: -";
    }

    const curText = Number.isFinite(series.currentVal)
      ? `${fmt(series.currentVal, def.unit)} ${def.unit}`.trim()
      : `- ${def.unit}`.trim();

    const rangeText = activeRange.hasData
      ? `${fmt(activeRange.min, def.unit)} .. ${fmt(activeRange.max, def.unit)}`
      : "-";

    const liveValEl = document.getElementById("ew-sp-live-val");
    const liveMetaEl = document.getElementById("ew-sp-live-meta");
    if (liveValEl) liveValEl.textContent = curText;
    if (liveMetaEl) liveMetaEl.textContent = `${def.name} (${def.unit || "-"})`;

    const rangeValEl = document.getElementById("ew-sp-range-val");
    const rangeMetaEl = document.getElementById("ew-sp-range-meta");
    if (rangeValEl) rangeValEl.textContent = rangeText;
    if (rangeMetaEl) rangeMetaEl.textContent = `Birim: ${def.unit || "-"}`;

    const varBadge = document.getElementById("ew-sp-var-badge");
    const timeBadge = document.getElementById("ew-sp-time-badge");
    if (varBadge) varBadge.textContent = `${def.name} [${def.om}] · ${def.unit || "-"}`;
    if (timeBadge) timeBadge.textContent = series.timeLabel;

    const cbar = document.getElementById("ew-cbar");
    if (cbar) {
      const titleEl = document.getElementById("cbar-title") || cbar.querySelector(".cbar-title");
      if (titleEl) {
        titleEl.innerHTML = `${def.name} <span style="opacity:.78;font-weight:500;">[${def.om}]</span> · <strong>${curText}</strong>`;
      }
      let gradEl = document.getElementById("ew-cbar-grad-bar");
      if (!gradEl) {
        gradEl = document.createElement("div");
        gradEl.id = "ew-cbar-grad-bar";
        cbar.appendChild(gradEl);
      }
      const stops = (activeRange.bins && activeRange.bins.length)
        ? activeRange.bins.map((b, i) => `${b.color} ${((i / Math.max(1, activeRange.bins.length - 1)) * 100).toFixed(1)}%`)
        : def.palette;
      gradEl.style.background = `linear-gradient(90deg, ${stops.join(", ")})`;

      let detailEl = document.getElementById("ew-cbar-bins-detail");
      if (!detailEl) {
        detailEl = document.createElement("div");
        detailEl.id = "ew-cbar-bins-detail";
        cbar.appendChild(detailEl);
      }
      const chips = (activeRange.bins || [])
        .map(b => `<span class="ew-cbar-chip" style="border-left:4px solid ${b.color};">${fmt(b.from, def.unit)}..${fmt(b.to, def.unit)}</span>`)
        .join("");
      detailEl.innerHTML = `
        <div><strong>${def.name}</strong> (<code>${def.om}</code>) · Birim: <strong>${def.unit || "-"}</strong> · Değer: <strong>${curText}</strong></div>
        <div class="ew-cbar-chips">${chips || '<span class="ew-cbar-chip">Veri bekleniyor</span>'}</div>
      `;
    }
  }

  function activateVar(omCode) {
    activeOm = omCode;
    document.querySelectorAll(".ew-ecmwf-btn").forEach(btn => btn.classList.toggle("is-active", btn.dataset.om === omCode));
    try {
      if (typeof pState !== "undefined" && pState) {
        pState.varCode = omCode;
        pState.variable = omCode;
      }
      const sel = document.querySelector('select[id*="var" i], select[name*="var" i]');
      if (sel && Array.from(sel.options).some(o => o.value === omCode)) {
        sel.value = omCode;
        sel.dispatchEvent(new Event("change", { bubbles: true }));
      }
    } catch (_) {}
    syncAll();
    try {
      if (typeof renderAll === "function") renderAll();
      else if (typeof redrawMap === "function") redrawMap();
    } catch (_) {}
  }

  const origColor = typeof window.colorByRange === "function" ? window.colorByRange : null;
  window.colorByRange = function (val, v) {
    const num = Number(val);
    const code = (v && v.om) ? v.om : activeOm;
    const def = getVarDef(code);
    if (!Number.isFinite(num)) return origColor ? origColor(val, v) : "#64748b";
    const r = dynamicRanges.get(code) || computeBins(extractSeries(code).vals, def);
    if (r && r.hasData && r.bins && r.bins.length) {
      const span = Math.max(1e-9, r.max - r.min);
      const norm = Math.max(0, Math.min(0.999999, (num - r.min) / span));
      return r.bins[Math.min(r.bins.length - 1, Math.floor(norm * r.bins.length))].color;
    }
    return origColor ? origColor(val, v) : samplePalette(def.palette, 0.5);
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", syncAll);
  } else {
    syncAll();
  }
  setInterval(syncAll, 800);
})();
</script>
<!-- EW_DYNAMIC_ECMWF_SUITE_END -->
