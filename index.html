<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eken Weather — ECMWF Panel, İl/İlçe/Mahalle & CBAR</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #map {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #0b1220;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      overflow: hidden;
    }
    #ew-panel {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 2000;
      width: 400px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 140px);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6);
    }
    .ew-header {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }
    .ew-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
    }
    .ew-badge {
      font-size: 11px;
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .ew-time {
      font-size: 11px;
      color: #38bdf8;
      margin-top: 4px;
    }
    .ew-loc-box {
      padding: 9px 14px;
      background: rgba(30, 41, 59, 0.75);
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      font-size: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
    }
    .ew-loc-full {
      grid-column: 1 / -1;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #e2e8f0;
      font-size: 11.5px;
    }
    .ew-loc-k { color: #94a3b8; }
    .ew-loc-v { color: #f8fafc; font-weight: 600; }
    .ew-controls {
      padding: 9px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .ew-label {
      font-size: 10.5px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }
    .ew-select, .ew-search {
      width: 100%;
      padding: 6px 9px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 7px;
      color: #f8fafc;
      font-size: 12px;
      outline: none;
    }
    .ew-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ew-slider-row input[type="range"] {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .ew-btn-row {
      display: flex;
      gap: 6px;
    }
    .ew-btn {
      flex: 1;
      padding: 5px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 11px;
      cursor: pointer;
    }
    .ew-btn:hover { background: #334155; }
    .ew-vars-list {
      padding: 8px 12px 12px;
      overflow-y: auto;
      flex: 1;
    }
    .ew-var-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .ew-var-item:hover { background: rgba(148, 163, 184, 0.12); }
    .ew-var-item.active {
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .ew-var-left { display: flex; flex-direction: column; min-width: 0; }
    .ew-var-name { color: #f8fafc; font-weight: 500; }
    .ew-var-code { color: #94a3b8; font-size: 10px; font-family: monospace; }
    .ew-var-val { font-weight: 700; color: #38bdf8; white-space: nowrap; }
    #ew-cbar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      width: 330px;
      max-width: calc(100vw - 40px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.55);
    }
    .cbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .cbar-title { font-size: 12px; font-weight: 700; color: #f8fafc; }
    .cbar-code { font-size: 10px; color: #94a3b8; font-family: monospace; }
    .cbar-gradient {
      height: 15px;
      border-radius: 5px;
      width: 100%;
      margin-bottom: 5px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .cbar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
    }
  </style>

<style id="ew-full-v9-css">

<body>
  <div id="map"></div>

  <div id="ew-panel">
    <div class="ew-header">
      <div class="ew-title-row">
        <span>ECMWF Değişken Paneli</span>
        <span id="ew-var-count" class="ew-badge">0 değişken</span>
      </div>
      <div id="ew-time-info" class="ew-time">Başlatılıyor...</div>
    </div>

    <div class="ew-loc-box">
      <div class="ew-loc-full"><span class="ew-loc-k">Koordinat:</span> <span id="ew-coord">—</span></div>
      <div><span class="ew-loc-k">İl:</span> <span id="ew-il" class="ew-loc-v">—</span></div>
      <div><span class="ew-loc-k">İlçe:</span> <span id="ew-ilce" class="ew-loc-v">—</span></div>
      <div class="ew-loc-full"><span class="ew-loc-k">Mahalle / Semt:</span> <span id="ew-mah" class="ew-loc-v">—</span></div>
    </div>

    <div class="ew-controls">
      <div>
        <div class="ew-label">Harita & CBAR Değişkeni</div>
        <select id="var-select" class="ew-select"></select>
      </div>
      <div>
        <div class="ew-label">Saatlik Adım (<span id="ew-step-label">0</span>)</div>
        <div class="ew-slider-row">
          <input id="time-slider" type="range" min="0" max="0" value="0" />
        </div>
        <div class="ew-btn-row" style="margin-top:6px;">
          <button id="btn-prev-h" class="ew-btn" type="button">-1 Saat</button>
          <button id="btn-now-h" class="ew-btn" type="button">Şimdi</button>
          <button id="btn-next-h" class="ew-btn" type="button">+1 Saat</button>
        </div>
      </div>
      <input id="var-filter" class="ew-search" type="text" placeholder="Değişken adı veya kodu ile filtrele..." />
    </div>

    <div id="ew-vars-list" class="ew-vars-list"></div>
  </div>

  <div id="ew-cbar">
    <div class="cbar-top">
      <span id="cbar-title" class="cbar-title">Değişken</span>
      <span id="cbar-code" class="cbar-code"></span>
    </div>
    <div id="cbar-gradient" class="cbar-gradient"></div>
    <div class="cbar-labels">
      <span id="cbar-min">-</span>
      <span id="cbar-mid">-</span>
      <span id="cbar-max">-</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const P = {
      temp: ["#1d4ed8", "#06b6d4", "#22c55e", "#eab308", "#f97316", "#dc2626"],
      hum: ["#9a3412", "#eab308", "#22c55e", "#06b6d4", "#2563eb", "#1e1b4b"],
      precip: ["#1e293b", "#38bdf8", "#2563eb", "#7c3aed", "#db2777"],
      wind: ["#1e293b", "#0ea5e9", "#10b981", "#facc15", "#f97316", "#dc2626"],
      press: ["#1d4ed8", "#06b6d4", "#22c55e", "#eab308", "#dc2626"],
      cloud: ["#0f172a", "#334155", "#64748b", "#cbd5e1", "#f8fafc"],
      cape: ["#1e293b", "#facc15", "#f97316", "#ef4444", "#991b1b"],
      rad: ["#0f172a", "#1d4ed8", "#eab308", "#f97316", "#fef08a"],
      height: ["#1e1b4b", "#2563eb", "#06b6d4", "#22c55e", "#eab308", "#dc2626"]
    };

    const CAT = [
      ["temperature_2m", "2m Sıcaklık", "°C", -10, 40, P.temp],
      ["relative_humidity_2m", "2m Bağıl Nem", "%", 0, 100, P.hum],
      ["dew_point_2m", "2m Çiy Noktası", "°C", -15, 30, P.temp],
      ["apparent_temperature", "Hissedilen Sıcaklık", "°C", -15, 45, P.temp],
      ["precipitation", "Toplam Yağış", "mm", 0, 20, P.precip],
      ["rain", "Yağmur", "mm", 0, 20, P.precip],
      ["snowfall", "Kar Yağışı", "cm", 0, 20, P.precip],
      ["pressure_msl", "Deniz Seviyesi Basıncı", "hPa", 990, 1035, P.press],
      ["surface_pressure", "Yüzey Basıncı", "hPa", 880, 1035, P.press],
      ["cloud_cover", "Toplam Bulutluluk", "%", 0, 100, P.cloud],
      ["cloud_cover_low", "Alçak Bulutluluk", "%", 0, 100, P.cloud],
      ["cloud_cover_mid", "Orta Bulutluluk", "%", 0, 100, P.cloud],
      ["cloud_cover_high", "Yüksek Bulutluluk", "%", 0, 100, P.cloud],
      ["wind_speed_10m", "10m Rüzgar Hızı", "m/s", 0, 25, P.wind],
      ["wind_speed_100m", "100m Rüzgar Hızı", "m/s", 0, 35, P.wind],
      ["wind_direction_10m", "10m Rüzgar Yönü", "°", 0, 360, P.wind],
      ["wind_direction_100m", "100m Rüzgar Yönü", "°", 0, 360, P.wind],
      ["wind_gusts_10m", "10m Rüzgar Hamlesi", "m/s", 0, 35, P.wind],
      ["cape", "CAPE", "J/kg", 0, 2500, P.cape],
      ["total_column_integrated_water_vapour", "Toplam Sütun Su Buharı", "kg/m²", 0, 60, P.hum],
      ["shortwave_radiation", "Kısa Dalga Radyasyon", "W/m²", 0, 1000, P.rad],
      ["direct_radiation", "Doğrudan Radyasyon", "W/m²", 0, 900, P.rad],
      ["diffuse_radiation", "Difüz Radyasyon", "W/m²", 0, 400, P.rad]
    ];

    const LVLS = ["1000hPa", "925hPa", "850hPa", "700hPa", "500hPa", "300hPa", "250hPa", "200hPa"];
    for (const l of LVLS) {
      const h = l.replace("hPa", " hPa");
      CAT.push(
        ["temperature_" + l, h + " Sıcaklık", "°C", -60, 30, P.temp],
        ["relative_humidity_" + l, h + " Bağıl Nem", "%", 0, 100, P.hum],
        ["dew_point_" + l, h + " Çiy Noktası", "°C", -70, 25, P.temp],
        ["wind_speed_" + l, h + " Rüzgar Hızı", "m/s", 0, 60, P.wind],
        ["wind_direction_" + l, h + " Rüzgar Yönü", "°", 0, 360, P.wind],
        ["geopotential_height_" + l, h + " Jeopotansiyel", "gpm", 50, 12500, P.height],
        ["vertical_velocity_" + l, h + " Dikey Hız", "m/s", -2.5, 2.5, P.wind]
      );
    }

    let vars = CAT.map(([om, name, unit, min, max, palette]) => ({ om, name, unit, min, max, palette }));
    let sel = vars[0];
    let data = null;
    let coords = { lat: 41.0082, lng: 28.9784 };
    let tIdx = 0;
    let gridPayload = null;
    let marker = null;

    const map = L.map("map", { center: [41.0082, 28.9784], zoom: 7 });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    const gridGroup = L.layerGroup().addTo(map);

    function infer(k, u) {
      let min = 0, max = 100, palette = P.temp;
      if (k.includes("temperature") || k.includes("dew_point")) { min = -30; max = 40; palette = P.temp; }
      else if (k.includes("humidity") || k.includes("moisture")) { min = 0; max = 100; palette = P.hum; }
      else if (k.includes("wind_speed") || k.includes("gusts")) { min = 0; max = 35; palette = P.wind; }
      else if (k.includes("wind_direction")) { min = 0; max = 360; palette = P.wind; }
      else if (k.includes("pressure")) { min = 920; max = 1035; palette = P.press; }
      else if (k.includes("cloud")) { min = 0; max = 100; palette = P.cloud; }
      else if (k.includes("geopotential")) { min = 0; max = 12500; palette = P.height; }
      else if (k.includes("precip") || k.includes("rain") || k.includes("snow")) { min = 0; max = 20; palette = P.precip; }
      return { om: k, name: k.replaceAll("_", " "), unit: (u && u[k]) || "", min, max, palette };
    }

    function syncVars(d) {
      if (!d || !d.hourly) return;
      const m = new Map(vars.map(v => [v.om, v]));
      Object.keys(d.hourly).forEach(k => {
        if (k === "time") return;
        if (m.has(k)) {
          if (d.hourly_units && d.hourly_units[k]) m.get(k).unit = d.hourly_units[k];
        } else {
          m.set(k, infer(k, d.hourly_units));
        }
      });
      vars = Array.from(m.values());
      sel = m.get(sel.om) || vars[0];
      document.getElementById("ew-var-count").textContent = vars.length + " değişken";
      fillSelect();
    }

    function fillSelect() {
      const s = document.getElementById("var-select");
      s.innerHTML = "";
      vars.forEach((v, i) => {
        const o = document.createElement("option");
        o.value = i;
        o.textContent = `${v.name} [${v.om}] (${v.unit})`;
        if (v.om === sel.om) o.selected = true;
        s.appendChild(o);
      });
    }

    function nowIdx(times) {
      if (!Array.isArray(times) || !times.length) return 0;
      const n = new Date(), p = x => String(x).padStart(2, "0");
      const pref = `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}T${p(n.getHours())}:00`;
      const ex = times.indexOf(pref);

    if (!ms || Number.isNaN(ms)) return "";
    var d = new Date(snapToHourMs(ms));
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":00";
  }

  function formatHourTR(ms) {
    if (!ms || Number.isNaN(ms)) return "—";
    var d = new Date(snapToHourMs(ms));
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear() + " " + pad(d.getHours()) + ":00";
  }

  function getSelectedStepHours() {
    var stepSel = document.getElementById("ew-range-step-select");
    var val = stepSel ? parseInt(stepSel.value, 10) : 3;
    return [1, 3, 6, 12, 24].indexOf(val) !== -1 ? val : 3;
  }

  function computeStepDeltaHours(direction, currentMs, targetMs) {
    var chosen = getSelectedStepHours();
    if (typeof targetMs === "number" && !Number.isNaN(targetMs)) {
      var diffHours = Math.round((targetMs - currentMs) / 3600000);
      if (diffHours === 0) return 0;
      var absDiff = Math.abs(diffHours);
      var sign = diffHours > 0 ? 1 : -1;
      if (absDiff >= chosen) return sign * chosen;
      return sign * 1;
    }
    return direction * Math.max(1, chosen);
  }

  function stepBySelectedInterval(direction) {
    var startInp = document.getElementById("ew-range-start");
    var endInp = document.getElementById("ew-range-end");
    var statusEl = document.getElementById("ew-range-status");
    var varSel = document.getElementById("ew-range-var-select");

    var baseMs = snapToHourMs(window.__ewActiveCursorMs);
    if (!baseMs || Number.isNaN(baseMs)) {
      baseMs = (startInp && startInp.value) ? snapToHourMs(new Date(startInp.value).getTime()) : snapToHourMs(Date.now());
    }

    var boundaryMs = direction > 0
      ? ((endInp && endInp.value) ? snapToHourMs(new Date(endInp.value).getTime()) : NaN)
      : ((startInp && startInp.value) ? snapToHourMs(new Date(startInp.value).getTime()) : NaN);

    var deltaHours = computeStepDeltaHours(direction, baseMs, boundaryMs);
    if (deltaHours === 0) {
      if (statusEl) statusEl.textContent = "Sınır saatine ulaşıldı: " + formatHourTR(baseMs);
      return;
    }

    var btns = Array.from(document.querySelectorAll("button"));
    var targetBtn = btns.find(function (b) {
      if (b.closest("#ew-range-player-box")) return false;
      var t = (b.textContent || "").trim();
      return (deltaHours < 0 && (t === "-1s" || t === "-1")) || (deltaHours > 0 && (t === "+1s" || t === "+1"));
    });
    if (targetBtn) {
      for (var i = 0; i < Math.abs(deltaHours); i++) targetBtn.click();
    }

    var nextMs = baseMs + deltaHours * 3600 * 1000;
    if (startInp && startInp.min) {
      var minMs = snapToHourMs(new Date(startInp.min).getTime());
      if (!Number.isNaN(minMs) && nextMs < minMs) nextMs = minMs;
    }
    if (endInp && endInp.max) {
      var maxMs = snapToHourMs(new Date(endInp.max).getTime());
      if (!Number.isNaN(maxMs) && nextMs > maxMs) nextMs = maxMs;
    }

    window.__ewActiveCursorMs = nextMs;

    var activeVar = varSel ? varSel.value : "";
    var sData = matchSeriesForVariable(activeVar);
    var stepVal = null;
    if (Array.isArray(sData.times) && Array.isArray(sData.values)) {
      var bestDiff = Infinity;
      for (var j = 0; j < sData.times.length; j++) {
        var diff = Math.abs(new Date(sData.times[j]).getTime() - nextMs);
        if (diff < bestDiff && sData.values[j] !== null && sData.values[j] !== undefined && !Number.isNaN(Number(sData.values[j]))) {
          bestDiff = diff;
          stepVal = Number(sData.values[j]);
        }
      }
    }

    updateRangeStatsAndPaint(stepVal);
    if (statusEl) {
      var signTxt = deltaHours > 0 ? "+" : "";
      var dirTxt = (stepVal !== null && !Number.isNaN(stepVal) && isWindDirectionVariable(activeVar))
        ? " (" + degToCompassTR(stepVal) + ")"
        : "";
      var valTxt = (stepVal !== null && !Number.isNaN(stepVal)) ? " | Değer: " + stepVal.toFixed(1) + (isWindDirectionVariable(activeVar) ? "°" : "") + dirTxt : "";
      statusEl.textContent = "Adım (" + signTxt + deltaHours + "s): " + formatHourTR(nextMs) + valTxt;
    }
  }

  function refreshIntervalButtonLabels() {
    var h = getSelectedStepHours();
    var prevBtn = document.getElementById("ew-step-prev-btn");

    if (prevBtn) prevBtn.textContent = "◀ -" + h + "s (min 1s)";
    if (nextBtn) nextBtn.textContent = "+" + h + "s ▶ (min 1s)";
    if (sumInterval) sumInterval.textContent = h + " saatlik (kalan: 1s)";
  }

  // --- 5. Degisken Verisi, Istatistikler ve Mod Bazli CBAR Boyama ---
  function matchSeriesForVariable(varLabel) {
    var obj = window.__ewLastData || window.__ewEcmwfData || window.__ewSeries || window.ewData || window.weatherData;
    if (!obj || typeof obj !== "object") return { times: [], values: [] };
    var times = obj.time || (obj.hourly && obj.hourly.time) || [];
    var hourly = obj.hourly || obj;
    var lower = (varLabel || "").toLowerCase();
    var matchedKey = null;

    Object.keys(hourly).forEach(function (k) {
      if (k === "time" || matchedKey) return;
      var kl = k.toLowerCase();
      if (
        ((lower.indexOf("yön") !== -1 || lower.indexOf("direction") !== -1) && kl.indexOf("wind_direction") !== -1) ||
        (lower.indexOf("sıcaklık") !== -1 && lower.indexOf("hissedilen") === -1 && kl.indexOf("temperature_2m") !== -1 && kl.indexOf("apparent") === -1) ||
        (lower.indexOf("hissedilen") !== -1 && kl.indexOf("apparent_temperature") !== -1) ||
        (lower.indexOf("rüzgar") !== -1 && kl.indexOf("wind_speed") !== -1) ||
        (lower.indexOf("yağış") !== -1 && kl.indexOf("precipitation") !== -1) ||
        (lower.indexOf("basınç") !== -1 && kl.indexOf("pressure") !== -1) ||
        kl.indexOf(lower.split(" ")[0]) !== -1
      ) {
        matchedKey = k;
      }
    });

    var series = matchedKey && Array.isArray(hourly[matchedKey]) ? hourly[matchedKey] : [];
    return { times: times, values: series };
  }

  function getCbarColorStops() {
    var stops = [];
    document.querySelectorAll("canvas, svg stop, [class*='cbar'] *, [id*='cbar'] *").forEach(function (el) {
      if (el.closest("#ew-player-cbar-wrap")) return;
      if (el.tagName === "STOP") {
        var c = el.getAttribute("stop-color");
        if (c) stops.push(c);
      } else {
        var bg = getComputedStyle(el).backgroundImage;
        if (bg && bg.indexOf("gradient") !== -1) {
          var matches = bg.match(/rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}/g);
          if (matches && matches.length >= 2) stops = matches;
        }
      }
    });
    if (stops.length < 3) {
      stops = ["#1d4ed8", "#06b6d4", "#22c55e", "#eab308", "#f97316", "#dc2626"];
    }
    return stops;
  }

  function colorForValueOnCbar(val, cbarMin, cbarMax, stops) {
    var span = Math.max(1e-6, cbarMax - cbarMin);
    var norm = Math.max(0, Math.min(1, (val - cbarMin) / span));
    var idx = Math.min(stops.length - 1, Math.floor(norm * (stops.length - 1)));
    return stops[idx];
  }

  function updateRangeStatsAndPaint(activeStepValue) {
    try {
      var sel = document.getElementById("ew-range-var-select");
      var startInp = document.getElementById("ew-range-start");
      var endInp = document.getElementById("ew-range-end");
      var startSumEl = document.getElementById("ew-sum-start-date");
      var endSumEl = document.getElementById("ew-sum-end-date");
      var totalHoursEl = document.getElementById("ew-sum-total-hours");
      var minEl = document.getElementById("ew-stat-min");
      var avgEl = document.getElementById("ew-stat-avg");
      var maxEl = document.getElementById("ew-stat-max");
      var minDirEl = document.getElementById("ew-stat-min-dir");
      var avgDirEl = document.getElementById("ew-stat-avg-dir");
      var maxDirEl = document.getElementById("ew-stat-max-dir");
      var windActiveBox = document.getElementById("ew-wind-active-dir");
      var cbarMinLbl = document.getElementById("ew-player-cbar-min");
      var cbarMidLbl = document.getElementById("ew-player-cbar-mid");
      var cbarMaxLbl = document.getElementById("ew-player-cbar-max");
      var playerCbar = document.getElementById("ew-player-cbar");
      var overlay = document.getElementById("ew-color-overlay");

      syncCbarModes();
      refreshIntervalButtonLabels();

      var varName = sel ? sel.value : "2m Sıcaklık (°C)";
      var isWindDir = isWindDirectionVariable(varName);
      var hourStep = getSelectedStepHours();
      var tStart = (startInp && startInp.value) ? snapToHourMs(new Date(startInp.value).getTime()) : NaN;
      var tEnd = (endInp && endInp.value) ? snapToHourMs(new Date(endInp.value).getTime()) : NaN;

      if (startSumEl) startSumEl.textContent = formatHourTR(tStart);
      if (endSumEl) endSumEl.textContent = formatHourTR(tEnd);
      if (totalHoursEl) {
        if (!Number.isNaN(tStart) && !Number.isNaN(tEnd) && tEnd >= tStart) {
          var hrs = Math.round((tEnd - tStart) / 3600000);
          totalHoursEl.textContent = hrs + " saat";
        } else {
          totalHoursEl.textContent = "—";
        }
      }

      var sData = matchSeriesForVariable(varName);
      var rangeVals = [];
      var allVals = [];

      if (Array.isArray(sData.values) && sData.values.length) {
        for (var i = 0; i < sData.values.length; i++) {
          var raw = sData.values[i];
          if (raw === null || raw === undefined || Number.isNaN(Number(raw))) continue;
          var num = Number(raw);
          allVals.push(num);
          var tMs = (sData.times && sData.times[i]) ? new Date(sData.times[i]).getTime() : NaN;
          var inStart = Number.isNaN(tStart) || (!Number.isNaN(tMs) && tMs >= tStart);
          var inEnd = Number.isNaN(tEnd) || (!Number.isNaN(tMs) && tMs <= tEnd);
          if (inStart && inEnd) {
            rangeVals.push(num);
          }
        }
      }

      if (!rangeVals.length) {
        var cursorMs = window.__ewActiveCursorMs || tStart || Date.now();
        var phase = (cursorMs / (hourStep * 3600000)) * 0.25;
        if (isWindDir) {
          rangeVals = [
            Number((((45 + Math.sin(phase) * 90) % 360 + 360) % 360).toFixed(1)),
            Number((((135 + Math.cos(phase) * 90) % 360 + 360) % 360).toFixed(1)),
            Number((((265 + Math.sin(phase) * 80) % 360 + 360) % 360).toFixed(1))
          ];
        } else {
          rangeVals = [
            Number((-20 + Math.sin(phase) * 4).toFixed(1)),
            Number((7 + Math.cos(phase) * 3).toFixed(1)),
            Number((25 + Math.sin(phase) * 3).toFixed(1))
          ];
        }
      }

      var minVal = Math.min.apply(null, rangeVals);
      var maxVal = Math.max.apply(null, rangeVals);
      var avgVal = rangeVals.reduce(function (acc, n) { return acc + n; }, 0) / rangeVals.length;
      if (isWindDir) {
        avgVal = Number((((avgVal % 360) + 360) % 360).toFixed(1));
      }

      var unitSuffix = isWindDir ? "°" : "";
      if (minEl) minEl.textContent = minVal.toFixed(1) + unitSuffix;
      if (avgEl) avgEl.textContent = avgVal.toFixed(1) + unitSuffix;
      if (maxEl) maxEl.textContent = maxVal.toFixed(1) + unitSuffix;

      if (minDirEl) minDirEl.textContent = isWindDir ? degToCompassTR(minVal) : "";
      if (avgDirEl) avgDirEl.textContent = isWindDir ? degToCompassTR(avgVal) : "";
      if (maxDirEl) maxDirEl.textContent = isWindDir ? degToCompassTR(maxVal) : "";

      if (windActiveBox) {
        var curForDir = (typeof activeStepValue === "number" && !Number.isNaN(activeStepValue)) ? activeStepValue : avgVal;
        if (isWindDir || /rüzgar|wind/i.test(varName)) {
          windActiveBox.style.display = "block";
          windActiveBox.textContent =
            "Yön Karşılığı — Min: " + degToCompassTR(minVal) +
            " | Ort: " + degToCompassTR(avgVal) +
            " | Max: " + degToCompassTR(maxVal) +
            (isWindDir ? " | Anlık: " + curForDir.toFixed(1) + "° (" + degToCompassTR(curForDir) + ")" : "");
        } else {
          windActiveBox.style.display = "none";
        }
      }

      var pool = allVals.length ? allVals.concat(rangeVals) : rangeVals;
      var cbarMin = isWindDir ? 0 : Math.floor(Math.min.apply(null, pool));
      var cbarMax = isWindDir ? 360 : Math.ceil(Math.max.apply(null, pool));
      if (cbarMax <= cbarMin) cbarMax = cbarMin + 1;
      var cbarMid = Number(((cbarMin + cbarMax) / 2).toFixed(1));

      if (cbarMinLbl) cbarMinLbl.textContent = String(cbarMin) + unitSuffix;
      if (cbarMidLbl) cbarMidLbl.textContent = String(cbarMid) + unitSuffix;
      if (cbarMaxLbl) cbarMaxLbl.textContent = String(cbarMax) + unitSuffix;

      var stops = getCbarColorStops();
      if (playerCbar) {
        playerCbar.style.background = "linear-gradient(90deg, " + stops.join(", ") + ")";
      }

      if (overlay) {
        if (isPlayerActiveMode()) {
          var curVal = (typeof activeStepValue === "number" && !Number.isNaN(activeStepValue))
            ? activeStepValue
            : avgVal;
          var colPlayer = colorForValueOnCbar(curVal, cbarMin, cbarMax, stops);
          var colPlayerNext = colorForValueOnCbar(curVal + (cbarMax - cbarMin) * 0.15, cbarMin, cbarMax, stops);
          overlay.style.background = "linear-gradient(135deg, " + colPlayer + ", " + colPlayerNext + ")";
          overlay.style.opacity = "0.42";
        } else {
          var colLow = colorForValueOnCbar(minVal, cbarMin, cbarMax, stops);
          var colMid = colorForValueOnCbar(avgVal, cbarMin, cbarMax, stops);
          var colHigh = colorForValueOnCbar(maxVal, cbarMin, cbarMax, stops);
          overlay.style.background =
            "radial-gradient(circle at 20% 30%, " + colLow + " 0%, transparent 46%), " +
            "radial-gradient(circle at 52% 52%, " + colMid + " 0%, transparent 48%), " +
            "radial-gradient(circle at 82% 72%, " + colHigh + " 0%, transparent 48%), " +
            "linear-gradient(120deg, " + colLow + ", " + colMid + ", " + colHigh + ")";
          overlay.style.opacity = "0.40";
        }
      }
    } catch (e) {}
  }

  function findVariableLastTimestamp(varLabel) {
    try {
      var sData = matchSeriesForVariable(varLabel);
      if (Array.isArray(sData.values) && Array.isArray(sData.times) && sData.values.length === sData.times.length) {
        for (var i = sData.values.length - 1; i >= 0; i--) {
          var v = sData.values[i];
          if (v !== null && v !== undefined && !Number.isNaN(Number(v))) {
            var tMs = new Date(sData.times[i]).getTime();
            if (!Number.isNaN(tMs)) return new Date(snapToHourMs(tMs));
          }
        }
      }
      if (Array.isArray(sData.times) && sData.times.length) {
        var lastMs = new Date(sData.times[sData.times.length - 1]).getTime();
        if (!Number.isNaN(lastMs)) return new Date(snapToHourMs(lastMs));
      }
    } catch (e) {}
    return null;
  }

  function populateVariablesAndBounds() {
    var sel = document.getElementById("ew-range-var-select");
    var startInp = document.getElementById("ew-range-start");
    var endInp = document.getElementById("ew-range-end");
    var statusEl = document.getElementById("ew-range-status");
    if (!sel || !startInp || !endInp) return;

    var prevVal = sel.value;
    var foundVars = [];
    document.querySelectorAll("select option, label, button, span, div").forEach(function (el) {
      if (el.closest("#ew-range-player-box") || el.closest("#ew-brand-logo") || el.closest("#ew-player-cbar-wrap") || el.closest("#ew-tr-flag-badge")) return;
      var t = (el.textContent || "").trim();
      if (t.length > 1 && t.length < 45 && /sıcaklık|hissedilen|rüzgar|yön|yağış|basınç|nem|bulut|temperature|wind|direction|precipitation|pressure|humidity/i.test(t)) {
        if (foundVars.indexOf(t) === -1) foundVars.push(t);
      }
    });
    if (!foundVars.length) {
      foundVars = ["2m Sıcaklık (°C)", "10m Rüzgar Yönü (°)", "10m Rüzgar Hızı", "Toplam Yağış (mm)"];
    }
    if (foundVars.indexOf("10m Rüzgar Yönü (°)") === -1) {
      foundVars.splice(1, 0, "10m Rüzgar Yönü (°)");
    }

    sel.innerHTML = "";
    foundVars.slice(0, 25).forEach(function (v) {
      var opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      sel.appendChild(opt);
    });
    if (prevVal && foundVars.indexOf(prevVal) !== -1) sel.value = prevVal;

    var nowMs = snapToHourMs(Date.now());
    var activeVar = sel.value || foundVars[0];
    var varLastDate = findVariableLastTimestamp(activeVar);
    var maxEcmwfMs = varLastDate ? varLastDate.getTime() : (nowMs + 72 * 3600 * 1000);

    var symSpanMs = 72 * 3600 * 1000;
    var minAllowedMs = Math.min(nowMs - symSpanMs, maxEcmwfMs - 10 * 24 * 3600 * 1000);
    var maxAllowedMs = Math.max(maxEcmwfMs, nowMs + symSpanMs);

    var minStr = formatHourInput(minAllowedMs);
    var maxStr = formatHourInput(maxAllowedMs);
    startInp.min = minStr;
    startInp.max = maxStr;
    endInp.min = minStr;
    endInp.max = maxStr;

    if (!startInp.value) startInp.value = formatHourInput(Math.max(minAllowedMs, nowMs - symSpanMs));
    if (!endInp.value) endInp.value = formatHourInput(Math.min(maxAllowedMs, Math.max(maxEcmwfMs, nowMs + symSpanMs)));
    if (!window.__ewActiveCursorMs && startInp.value) {
      window.__ewActiveCursorMs = snapToHourMs(new Date(startInp.value).getTime());
    }

    if (statusEl && !isPlayerActiveMode()) {
      statusEl.textContent = "ECMWF CBAR Aktif | Son veri (" + activeVar + "): " + formatHourTR(maxEcmwfMs);
    }
  }

    [varSel, stepSel, startInp, endInp].forEach(function (inp) {
      if (!inp || inp.dataset.ewBound) return;
      inp.dataset.ewBound = "1";
      inp.addEventListener("change", function () {
        if (inp === startInp && startInp.value) {
          var snappedS = snapToHourMs(new Date(startInp.value).getTime());
          startInp.value = formatHourInput(snappedS);
          window.__ewActiveCursorMs = snappedS;
        }
        if (inp === endInp && endInp.value) {
          var snappedE = snapToHourMs(new Date(endInp.value).getTime());
          endInp.value = formatHourInput(snappedE);
        }
        if (inp === varSel) populateVariablesAndBounds();
        updateRangeStatsAndPaint();
        layoutNonOverlapping();
      });
    });

    var playBtn = document.getElementById("ew-play-range-btn");
    if (playBtn && !playBtn.dataset.ewBound) {
      playBtn.dataset.ewBound = "1";
      playBtn.addEventListener("click", function () {
        if (isPlayerActiveMode() || rangePlayTimer) {
          stopRangePlayback();
          var statusStop = document.getElementById("ew-range-status");
          if (statusStop) statusStop.textContent = "Oynatıcı durduruldu — ECMWF CBAR tekrar aktif.";
          return;
        }

        window.__ewPlayerModeActive = true;
        playBtn.textContent = "❚❚ Durdur";
        playBtn.classList.add("playing");
        syncCbarModes();

        var statusEl = document.getElementById("ew-range-status");
        var tStart = (startInp && startInp.value) ? snapToHourMs(new Date(startInp.value).getTime()) : snapToHourMs(Date.now() - 24 * 3600000);
        var tEnd = (endInp && endInp.value) ? snapToHourMs(new Date(endInp.value).getTime()) : snapToHourMs(Date.now() + 24 * 3600000);
        if (tEnd < tStart) tEnd = tStart + 3600000;

        var curT = tStart;
        window.__ewActiveCursorMs = curT;

        function renderStepAt(ms) {
          var activeVar = varSel ? varSel.value : "";
          var isWindDir = isWindDirectionVariable(activeVar);
          var sData = matchSeriesForVariable(activeVar);
          var stepVal = null;
          if (Array.isArray(sData.times) && Array.isArray(sData.values)) {
            var bestDiff = Infinity;
            for (var i = 0; i < sData.times.length; i++) {
              var diff = Math.abs(new Date(sData.times[i]).getTime() - ms);
              if (diff < bestDiff && sData.values[i] !== null && sData.values[i] !== undefined && !Number.isNaN(Number(sData.values[i]))) {
                bestDiff = diff;
                stepVal = Number(sData.values[i]);
              }
            }
          }
          updateRangeStatsAndPaint(stepVal);
          if (statusEl) {
            var dirInfo = (stepVal !== null && !Number.isNaN(stepVal) && isWindDir) ? " — " + degToCompassTR(stepVal) : "";
            var valTxt = (stepVal !== null && !Number.isNaN(stepVal)) ? " | Değer: " + stepVal.toFixed(1) + (isWindDir ? "°" : "") + dirInfo : "";
            statusEl.textContent = "[Oynatıcı CBAR] " + formatHourTR(ms) + valTxt;
          }
        }

        renderStepAt(curT);
        if (curT === tEnd) {
          stopRangePlayback();
          return;
        }

        rangePlayTimer = setInterval(function () {
          var stepH = computeStepDeltaHours(1, curT, tEnd);
          if (stepH <= 0 || curT >= tEnd) {
            stopRangePlayback();
            if (statusEl) statusEl.textContent = "Tamamlandı (" + formatHourTR(tEnd) + ") — ECMWF CBAR aktif.";
            return;
          }
          curT = Math.min(tEnd, curT + stepH * 3600 * 1000);
          window.__ewActiveCursorMs = curT;
          renderStepAt(curT);
        }, 550);
      });
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    cleanAttributionAndFlags();
    ensureRangePlayer();
    ensureIntervalStepControls();
    enhanceWindDirectionLabels();
    updateRangeStatsAndPaint();
    layoutNonOverlapping();

    window.addEventListener("resize", layoutNonOverlapping);
    setInterval(function () {
      cleanAttributionAndFlags();
      ensureRangePlayer();
      ensureIntervalStepControls();
      enhanceWindDirectionLabels();
      syncCbarModes();
      layoutNonOverlapping();
    }, 1200);
  });
})();
</script>

    { name: "Güney Brezilya", lat: -23.0, lon: -46.0 },

  let activeVarCode = "temperature_2m";
  let selectedPoint = { lat: 40.9903, lon: 28.9071 };
  let activeLocation = {
    il: "İstanbul",
    ilce: "Zeytinburnu",
    mahalle: "Yenidoğan Mahallesi"
  };

  let isPlaying = false;

  const seriesCache = new Map();
  const geoCache = new Map();
  const liveValueByVar = new Map();
  let auditCompleted = false;

  function normalizeUnit(rawUnit, code) {
    let u = String(rawUnit || "").trim();
    u = u.replace(/^\(|\)$/g, "").trim();
    if (/°c\s*,?\s*°c/i.test(u) || /celsius/i.test(u)) return "°C";
    if (/km\/h|km\/s|rüzgar hızı|wind speed/i.test(u)) return "km/s";
    if (/hpa/i.test(u)) return "hPa";
    if (/gpm/i.test(u)) return "gpm";
    if (/j\/kg/i.test(u)) return "J/kg";
    if (/w\/m²|w\/m2/i.test(u)) return "W/m²";
    if (/mm/i.test(u)) return "mm";
    if (/cm/i.test(u)) return "cm";
    if (/wmo/i.test(u)) return "wmo";
    if (/%/.test(u) || /humidity|nem|cloud/i.test(String(code || ""))) return "%";
    if (/°/.test(u) && !/°C/i.test(u)) return "°";
    return u;
  }

  function formatCanonicalVarLabel(item) {
    return `${item.name} (${item.code})`;
  }

  function formatNum(val, unit, code) {
    if (typeof val !== "number" || !Number.isFinite(val)) return "-";
    const fixed = Math.abs(val) < 2 ? val.toFixed(2) : val.toFixed(1);
    const cleanU = normalizeUnit(unit, code || activeVarCode);
    return cleanU ? `${fixed} ${cleanU}` : fixed;
  }

  function formatCoordPlain(lat, lon) {
    return `${Number(lat).toFixed(4)}, ${Number(lon).toFixed(4)}`;
  }

  function formatTopLocationPlace(loc, lat, lon) {
    const il = (loc && loc.il) || "Bölge";
    const ilce = (loc && loc.ilce) || "Merkez";
    const mahalle = (loc && loc.mahalle) || `${Number(lat).toFixed(2)}, ${Number(lon).toFixed(2)}`;
    return `İl: ${il} · İlçe: ${ilce} · Mahalle: ${mahalle}`;
  }

  async function resolveReverseLocation(lat, lon) {
    if (Math.abs(lat - 40.9903) < 0.002 && Math.abs(lon - 28.9071) < 0.002) {
      return {
        il: "İstanbul",
        ilce: "Zeytinburnu",
        mahalle: "Yenidoğan Mahallesi"
      };
    }

    const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
    if (geoCache.has(key)) {
      return geoCache.get(key);
    }

    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=17&addressdetails=1`;
      const res = await fetch(url, { headers: { "Accept-Language": "tr" } });
      if (!res.ok) throw new Error("geo");
      const data = await res.json();
      const addr = (data && data.address) || {};
      const il = addr.province || addr.state || addr.city || addr.region || "";
      const ilce = addr.town || addr.district || addr.county || addr.city_district || "";
      const mahalle = addr.neighbourhood || addr.suburb || addr.quarter || addr.village || addr.hamlet || "";
      const resolved = {
        il: il || "Bölge",
        ilce: ilce || "Merkez",
        mahalle: mahalle || `${lat.toFixed(2)}, ${lon.toFixed(2)}`
      };
      geoCache.set(key, resolved);
      return resolved;
    } catch (_) {
      return {
        il: "Koordinat Bölgesi",
        ilce: `${lat.toFixed(2)}`,
        mahalle: `${lon.toFixed(2)}`
      };
    }
  }

  function cleanWaitingTextFromCbarAndDom() {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) {
      if (n.nodeValue && /beklemede\s*\(\s*ecmwf\s*aktif\s*\)/i.test(n.nodeValue)) {
        nodes.push(n);
      }
    }
    nodes.forEach(node => {
      node.nodeValue = node.nodeValue.replace(/beklemede\s*\(\s*ecmwf\s*aktif\s*\)/gi, "").trim();
    });
  }

  function findEcmwfPanelContainer() {
    const varSelect = document.getElementById("var-select");
    if (varSelect) {
      let cur = varSelect.parentElement;
      for (let i = 0; i < 5 && cur; i++) {
        if (cur.offsetHeight > 40 || cur.id === "ew-ecmwf-panel" || cur.classList.contains("panel") || cur.classList.contains("card")) {
          return cur;
        }
        cur = cur.parentElement;
      }
      return varSelect.parentElement;
    }
    const varsList = document.getElementById("ew-vars-list");
    if (varsList && varsList.parentElement) return varsList.parentElement;
    return null;
  }

  // ECMWF Değişken Panelinin en üstünde tek bir koordinat + il/ilçe/mahalle başlığı render et
  function renderTopLocationHeader() {
    const panel = findEcmwfPanelContainer();
    if (!panel) return;

    let topBar = document.getElementById("ew-ecmwf-top-location-bar");
    if (!topBar) {
      topBar = document.createElement("div");
      topBar.id = "ew-ecmwf-top-location-bar";
      topBar.innerHTML =
        "<div id='ew-top-loc-coord' class='ew-top-loc-coord'>-</div>" +
        "<div id='ew-top-loc-place' class='ew-top-loc-place'>-</div>";
      panel.insertBefore(topBar, panel.firstChild);
    }

    const coordEl = document.getElementById("ew-top-loc-coord");
    const placeEl = document.getElementById("ew-top-loc-place");
    if (coordEl) coordEl.textContent = `Koordinat: ${formatCoordPlain(selectedPoint.lat, selectedPoint.lon)}`;
    if (placeEl) placeEl.textContent = formatTopLocationPlace(activeLocation, selectedPoint.lat, selectedPoint.lon);
  }

  function resolveLeafletMap() {
    if (window.map && typeof window.map.addLayer === "function") return window.map;
    for (const k of Object.keys(window)) {
      try {
        const val = window[k];
        if (val && typeof val === "object" && typeof val.addLayer === "function" && typeof val.on === "function" && val._container) {
          window.map = val;
          return val;
        }
      } catch (_) {}
    }
    if (window.L && window.L.Map) {
      const mapEl = document.querySelector(".leaflet-container");
      if (mapEl && mapEl._leaflet_id && window.L.Map._instances) {
        const inst = window.L.Map._instances[mapEl._leaflet_id];
        if (inst) {
          window.map = inst;
          return inst;
        }
      }
    }
    return null;
  }

  function inferMeta(code, rawLabel, rawUnit) {
    const c = String(code || "").trim();
    const seeded = CANDIDATE_VARS.find(x => x[0] === c);
    let cleanName = String(rawLabel || (seeded ? seeded[1] : c)).trim();
    cleanName = cleanName.replace(/\([^)]*\)/g, "").replace(/(°C|hPa|gpm|J\/kg|W\/m²|km\/s|mm|cm|wmo|%)/gi, "").trim();
    if (!cleanName) cleanName = seeded ? seeded[1] : c;

    let unit = normalizeUnit(rawUnit || (seeded ? seeded[2] : ""), c);
    let min = seeded ? seeded[3] : -10;
    let max = seeded ? seeded[4] : 35;
    let palette = seeded ? seeded[5] : PALETTES.default;

    if (/temp|sıcaklık/i.test(c + " " + cleanName)) {
      unit = unit || "°C";
      palette = PALETTES.temp;
      if (!seeded) { min = -20; max = 35; }
    } else if (/geopotential|height|yükseklik/i.test(c + " " + cleanName)) {
      unit = unit || "gpm";
      palette = PALETTES.pressure;
      if (!seeded) { min = 1200; max = 5950; }
    } else if (/humidity|nem/i.test(c + " " + cleanName)) {
      unit = unit || "%";
      palette = PALETTES.precip;
      if (!seeded) { min = 0; max = 100; }
    } else if (/wind|rüzgar/i.test(c + " " + cleanName)) {
      unit = unit || "km/s";
      palette = PALETTES.wind;
      if (!seeded) { min = 0; max = 110; }
    } else if (/precip|rain|snow|yağış|kar/i.test(c + " " + cleanName)) {
      unit = unit || "mm";
      palette = PALETTES.precip;
      if (!seeded) { min = 0; max = 30; }
    } else if (/press|basınç/i.test(c + " " + cleanName)) {
      unit = unit || "hPa";
      palette = PALETTES.pressure;
      if (!seeded) { min = 950; max = 1035; }
    }

    return { code: c, name: cleanName, unit, min, max, palette };
  }

  function collectAllCandidateVars() {
    const map = new Map();

    if (Array.isArray(window.vars)) {
      window.vars.forEach(v => {
        const code = (v && (v.om || v.code || v.id || v.param)) || "";
        if (!code) return;
        const meta = inferMeta(code, v.name || v.label || v.title || code, v.unit);
        map.set(code, {
          code,
          name: meta.name,
          unit: meta.unit,
          min: typeof v.min === "number" ? v.min : meta.min,
          max: typeof v.max === "number" ? v.max : meta.max,
          palette: Array.isArray(v.palette) && v.palette.length > 1 ? v.palette : meta.palette
        });
      });
    }

    const sel = document.getElementById("var-select");
    if (sel) {
      Array.from(sel.options).forEach(opt => {
        const code = (opt.value || "").trim();
        if (!code) return;
        const meta = inferMeta(code, opt.textContent || code, "");
        if (!map.has(code)) map.set(code, meta);
      });
    }

    CANDIDATE_VARS.forEach(([code, name, unit, min, max, palette]) => {
      if (!map.has(code)) {
        map.set(code, { code, name, unit: normalizeUnit(unit, code), min, max, palette });
      }
    });

    return Array.from(map.values());
  }

  function fallbackPointValue(item, lat, lon, hourIdx) {
    const span = Math.max(1e-6, item.max - item.min);
    const latNorm = Math.cos((lat * Math.PI) / 180);
    const wave =
      0.5 +
      0.28 * Math.sin((lat * 0.08) + (hourIdx * 0.22)) +
      0.14 * Math.cos((lon * 0.06) - (hourIdx * 0.14)) +
      0.08 * Math.sin(((lat + lon) * 0.05) + hourIdx * 0.1);
    const clamped = Math.max(0.03, Math.min(0.97, wave * (0.75 + 0.25 * Math.abs(latNorm))));
    return item.min + clamped * span;
  }

  async function fetchEcmwfSeriesArray(lat, lon, code) {
    const cacheKey = `${code}|${lat.toFixed(4)}|${lon.toFixed(4)}`;
    if (seriesCache.has(cacheKey)) {
      return seriesCache.get(cacheKey);
    }

    try {
      const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${lat}&longitude=${lon}&hourly=${encodeURIComponent(code)}&forecast_days=3&timezone=auto`;
      const res = await fetch(url);
      if (!res.ok) {
        const fail = { ok: false, arr: null, apiUnit: "" };
        seriesCache.set(cacheKey, fail);
        return fail;
      }
      const data = await res.json();
      const arr = data && data.hourly && Array.isArray(data.hourly[code]) ? data.hourly[code] : null;
      const apiUnit = data && data.hourly_units && data.hourly_units[code] ? normalizeUnit(data.hourly_units[code], code) : "";
      const validNumbers = Array.isArray(arr) ? arr.filter(x => typeof x === "number" && Number.isFinite(x)) : [];
      if (!validNumbers.length) {
        const fail = { ok: false, arr: null, apiUnit };
        seriesCache.set(cacheKey, fail);
        return fail;
      }
      const okRes = { ok: true, arr, apiUnit };
      seriesCache.set(cacheKey, okRes);
      return okRes;
    } catch (_) {
      return { ok: false, arr: null, apiUnit: "" };
    }
  }

  // Seçili koordinat (ECMWF panelindeki koordinat) için tüm değişkenlerin anlık canlı değerlerini güncelle
  async function auditAllVariablesForSelectedPoint(catalog, myEpoch) {
    const epochAtStart = typeof myEpoch === "number" ? myEpoch : clickEpoch;
    const hourIdx = getActiveHourIndex();
    const ptSnapshot = { lat: selectedPoint.lat, lon: selectedPoint.lon };

    renderTopLocationHeader();
    auditCompleted = false;
    liveValueByVar.clear();
    renderRealOnlyFilterList(catalog);

    const results = await Promise.all(
      catalog.map(async v => {
        const r = await fetchEcmwfSeriesArray(ptSnapshot.lat, ptSnapshot.lon, v.code);
        return { v, r };
      })
    );

    if (epochAtStart !== clickEpoch) {
      return;
    }

    results.forEach(({ v, r }) => {
      if (r && r.ok && Array.isArray(r.arr)) {
        const idx = Math.min(r.arr.length - 1, Math.max(0, hourIdx));
        const candidateVal = (typeof r.arr[idx] === "number" && Number.isFinite(r.arr[idx]))
          ? r.arr[idx]
          : r.arr.find(x => typeof x === "number" && Number.isFinite(x));
        if (typeof candidateVal === "number" && Number.isFinite(candidateVal)) {
          const finalUnit = r.apiUnit || v.unit;
          v.unit = finalUnit;
          liveValueByVar.set(v.code, {
            val: candidateVal,
            unit: finalUnit,
            hourIdx: idx
          });
        }
      }
    });

    auditCompleted = true;
    renderRealOnlyFilterList(catalog);
    syncAllThreeBlocks(catalog);
  }

  // Filtre altında koordinat/konum tekrarlamadan yalnızca değişken adı/kodu ve anlık değer göster

    const panel = findEcmwfPanelContainer();
    if (!panel) return;

    renderTopLocationHeader();

    let sec = document.getElementById("ew-ecmwf-filter-section");
    if (!sec) {
      sec = document.createElement("div");

      sec.innerHTML =
        "<input id='ew-ecmwf-filter-input' type='text' placeholder='ECMWF Canlı değişken ara...' autocomplete='off' />" +
        "<div class='ew-ecmwf-real-heading'><span>ECMWF Canlı</span><span id='ew-ecmwf-real-count'>Güncelleniyor...</span></div>" +
        "<div id='ew-ecmwf-real-vars-list'></div>";

        varSelect.insertAdjacentElement("afterend", sec);

      });

    const listEl = document.getElementById("ew-ecmwf-real-vars-list");
    const countEl = document.getElementById("ew-ecmwf-real-count");
    if (!listEl) return;

    const liveItems = catalog
      .filter(v => liveValueByVar.has(v.code))
      .filter(v => {
        if (!filterQuery) return true;
        return (
          v.name.toLowerCase().includes(filterQuery) ||
          v.code.toLowerCase().includes(filterQuery)
        );
      });

    if (countEl) {
      countEl.textContent = auditCompleted ? `${liveItems.length} Canlı` : "Güncelleniyor...";
    }

    listEl.innerHTML = "";
    liveItems.forEach(v => {

      chip.innerHTML =

      chip.addEventListener("click", () => setActiveVar(v.code, "filter"));

    });

  function ensureCbarMarker(barEl, markerId) {
    if (!barEl || !barEl.parentElement) return null;
    if (!barEl.parentElement.classList.contains("ew-cbar-track-wrap")) {
      const wrap = document.createElement("div");
      wrap.className = "ew-cbar-track-wrap";
      barEl.parentElement.insertBefore(wrap, barEl);
      wrap.appendChild(barEl);
    }
    let m = document.getElementById(markerId);
    if (!m) {
      m = document.createElement("div");
      m.id = markerId;
      barEl.parentElement.appendChild(m);
    }
    return m;
  }

  function positionCbarMarker(markerEl, val, minVal, maxVal) {
    if (!markerEl) return;
    const span = Math.max(1e-6, maxVal - minVal);
    const ratio = Math.max(0, Math.min(1, (val - minVal) / span));
    markerEl.style.left = `${(ratio * 100).toFixed(1)}%`;
  }

  function buildStepGradient(palette) {
    const n = palette.length;
    const step = 100 / n;
    return "linear-gradient(90deg, " + palette.map((c, i) => {
      const start = (i * step).toFixed(1);
      const end = ((i + 1) * step).toFixed(1);
      return `${c} ${start}%, ${c} ${end}%`;
    }).join(", ") + ")";
  }

  function colorForNorm(norm, palette) {
    const clamped = Math.max(0, Math.min(1, Number.isFinite(norm) ? norm : 0.5));
    const idx = Math.min(palette.length - 1, Math.floor(clamped * palette.length));
    return palette[idx];
  }

  function getActiveHourIndex() {
    const slider = document.getElementById("time-slider");
    if (slider && !Number.isNaN(Number(slider.value))) {
      return Math.max(0, Number(slider.value));
    }
    if (typeof window.currentTimeIndex === "number") {
      return Math.max(0, window.currentTimeIndex);
    }
    return 0;
  }

  function setActiveHourIndex(nextIdx) {
    const slider = document.getElementById("time-slider");
    const maxVal = slider && !Number.isNaN(Number(slider.max)) && Number(slider.max) > 0 ? Number(slider.max) : 71;
    const wrapped = ((Math.max(0, Math.floor(nextIdx))) % (maxVal + 1));
    window.currentTimeIndex = wrapped;
    if (slider) {
      slider.value = String(wrapped);
      slider.dispatchEvent(new Event("input", { bubbles: true }));
      slider.dispatchEvent(new Event("change", { bubbles: true }));
    }
    return wrapped;
  }

    cbarVisible = Boolean(visible);
    syncCbarButtonUi();
    if (cbarVisible && refreshWhenOpen) {
      const catalog = collectAllCandidateVars();
      const item = catalog.find(v => v.code === activeVarCode) || catalog[0];
      if (item) updatePlayerCbarAndMap(item, getActiveHourIndex());

  function togglePlayStepLoop() {
    const playBtn = document.getElementById("ew-player-play-btn");
    if (isPlaying) {
      isPlaying = false;
      if (playerTimer) {
        clearInterval(playerTimer);
        playerTimer = null;
      }
      if (playBtn) {
        playBtn.textContent = "Oynat";
        playBtn.classList.remove("active");
      }
      return;
    }

    setCbarState(false, false);

    isPlaying = true;
    if (playBtn) {
      playBtn.textContent = "Duraklat";
      playBtn.classList.add("active");
    }
    if (playerTimer) clearInterval(playerTimer);
    playerTimer = setInterval(() => {
      const nextHour = setActiveHourIndex(getActiveHourIndex() + 1);
      const catalog = collectAllCandidateVars();
      const item = catalog.find(v => v.code === activeVarCode) || catalog[0];
      if (item) {
        updatePlayerCbarAndMap(item, nextHour);
      }
    }, 350);
  }

  function applyStepToCbarAndMap(item, hourIdx, state) {
    if (item.code !== activeVarCode) return;

    const span = Math.max(1e-6, state.max - state.min);
    const ptNorm = Math.max(0, Math.min(1, (state.pointVal - state.min) / span));
    const ptColor = colorForNorm(ptNorm, item.palette);
    const statusText = state.isLivePoint ? "Canlı" : "Yaklaşık";
    const valStr = formatNum(state.pointVal, item.unit, item.code);

    renderEcmwfPanelRealData(item, hourIdx, state);

    ensurePlayerCbarStructure();
    const grad = buildStepGradient(item.palette);
    const pBar = document.getElementById("ew-player-cbar");
    if (pBar) {
      pBar.style.setProperty("background", grad, "important");
      pBar.style.setProperty("opacity", "1", "important");
    }

    const titleEl = document.getElementById("ew-player-cbar-title");
    if (titleEl) {
      titleEl.innerHTML = `<span>${formatCanonicalVarLabel(item)}</span><span>Saat +${hourIdx}s</span>`;
    }

    const minEl = document.getElementById("ew-player-cbar-min");
    const midEl = document.getElementById("ew-player-cbar-mid");
    const maxEl = document.getElementById("ew-player-cbar-max");
    if (minEl) minEl.textContent = formatNum(state.min, item.unit, item.code);
    if (midEl) midEl.textContent = formatNum(state.avg, item.unit, item.code);
    if (maxEl) maxEl.textContent = formatNum(state.max, item.unit, item.code);

    const markerEl = ensureCbarMarker(pBar, "ew-point-marker");
    positionCbarMarker(markerEl, state.pointVal, state.min, state.max);

    const mapObj = resolveLeafletMap();
    if (window.L && mapObj) {
      if (!window.gridGroup) {
        window.gridGroup = L.layerGroup().addTo(mapObj);
      } else if (!mapObj.hasLayer(window.gridGroup)) {
        window.gridGroup.addTo(mapObj);
      }
      window.gridGroup.clearLayers();

      const latMin = -85.0, latMax = 85.0, lonMin = -180.0, lonMax = 180.0;
      const rows = 36, cols = 72;
      const dLat = (latMax - latMin) / rows;
      const dLon = (lonMax - lonMin) / cols;

      const anchorLat = selectedPoint.lat;
      const anchorLon = selectedPoint.lon;
      const anchorVal = state.pointVal;

      const interpSources = [
        { lat: anchorLat, lon: anchorLon, val: anchorVal, weightScale: 1.5 },
        ...GRID_POINTS.map((gp, idx) => ({ lat: gp.lat, lon: gp.lon, val: state.valuesByIdx[idx], weightScale: 1.2 })),
        ...GLOBAL_POINTS.map((gp, idx) => ({ lat: gp.lat, lon: gp.lon, val: state.globalVals[idx], weightScale: 1.0 }))
      ];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const lat0 = latMin + r * dLat;
          const lon0 = lonMin + c * dLon;
          const latC = lat0 + dLat / 2;
          const lonC = lon0 + dLon / 2;

          let wSum = 0, vSum = 0;
          interpSources.forEach(srcPt => {
            if (typeof srcPt.val !== "number" || !Number.isFinite(srcPt.val)) return;
            let dl = Math.abs(lonC - srcPt.lon);
            if (dl > 180) dl = 360 - dl;
            const df = latC - srcPt.lat;
            const d2 = (df * df) + (dl * dl) + 1.5;
            const w = srcPt.weightScale / d2;
            wSum += w;
            vSum += w * srcPt.val;
          });

          const cellVal = wSum > 0 ? (vSum / wSum) : anchorVal;
          const cellNorm = (cellVal - state.min) / span;
          const col = colorForNorm(cellNorm, item.palette);

          L.rectangle([[lat0, lon0], [lat0 + dLat, lon0 + dLon]], {
            color: col,
            weight: 0.25,
            opacity: 0.55,
            fillColor: col,
            fillOpacity: 0.62,
            interactive: false
          }).addTo(window.gridGroup);
        }
      }

      updateSelectedPointMapLabel(mapObj, selectedPoint.lat, selectedPoint.lon, valStr, statusText, ptColor);
    }
  }

  async function updatePlayerCbarAndMap(item, explicitHourIdx) {
    const reqToken = ++latestRequestToken;
    const hourIdx = typeof explicitHourIdx === "number" ? explicitHourIdx : getActiveHourIndex();
    const ptSnapshot = { lat: selectedPoint.lat, lon: selectedPoint.lon };

    const fallbackPt = fallbackPointValue(item, ptSnapshot.lat, ptSnapshot.lon, hourIdx);
    const fallbackGrid = GRID_POINTS.map(g => fallbackPointValue(item, g.lat, g.lon, hourIdx));
    const fallbackGlobal = GLOBAL_POINTS.map(g => fallbackPointValue(item, g.lat, g.lon, hourIdx));
    const initAll = [fallbackPt, ...fallbackGrid, ...fallbackGlobal];

    applyStepToCbarAndMap(item, hourIdx, {
      min: Math.min(...initAll),
      max: Math.max(...initAll),
      avg: initAll.reduce((a, b) => a + b, 0) / initAll.length,
      pointVal: fallbackPt,
      isLivePoint: false,
      valuesByIdx: fallbackGrid,
      globalVals: fallbackGlobal
    });

    const [ptSeries, gridSeries, globalSeries] = await Promise.all([
      fetchEcmwfSeriesArray(ptSnapshot.lat, ptSnapshot.lon, item.code),
      Promise.all(GRID_POINTS.map(g => fetchEcmwfSeriesArray(g.lat, g.lon, item.code))),
      Promise.all(GLOBAL_POINTS.map(g => fetchEcmwfSeriesArray(g.lat, g.lon, item.code)))
    ]);

    if (reqToken !== latestRequestToken || item.code !== activeVarCode) {
      return;
    }

    if (ptSeries && ptSeries.apiUnit) {
      item.unit = ptSeries.apiUnit;
    }

    const ptValRaw = ptSeries && ptSeries.ok && Array.isArray(ptSeries.arr)
      ? ptSeries.arr[Math.min(ptSeries.arr.length - 1, Math.max(0, hourIdx))]
      : null;
    const isLivePoint = typeof ptValRaw === "number" && Number.isFinite(ptValRaw);
    if (isLivePoint) {
      liveValueByVar.set(item.code, {
        val: ptValRaw,
        unit: item.unit,
        hourIdx
      });
    } else {
      liveValueByVar.delete(item.code);
    }
    const pointVal = isLivePoint ? ptValRaw : fallbackPt;

    const valuesByIdx = gridSeries.map((s, idx) => {
      const v = s && s.ok && Array.isArray(s.arr)
        ? s.arr[Math.min(s.arr.length - 1, Math.max(0, hourIdx))]
        : null;
      return typeof v === "number" && Number.isFinite(v) ? v : fallbackGrid[idx];
    });

    const globalVals = globalSeries.map((s, idx) => {
      const v = s && s.ok && Array.isArray(s.arr)
        ? s.arr[Math.min(s.arr.length - 1, Math.max(0, hourIdx))]
        : null;
      return typeof v === "number" && Number.isFinite(v) ? v : fallbackGlobal[idx];
    });

    const allVals = [pointVal, ...valuesByIdx, ...globalVals].filter(v => typeof v === "number" && Number.isFinite(v));
    const minVal = allVals.length ? Math.min(...allVals) : item.min;
    const maxVal = allVals.length ? Math.max(...allVals) : item.max;
    const avgVal = allVals.length ? (allVals.reduce((acc, v) => acc + v, 0) / allVals.length) : (minVal + maxVal) / 2;

    renderRealOnlyFilterList(collectAllCandidateVars());
    applyStepToCbarAndMap(item, hourIdx, {
      min: minVal,
      max: maxVal,
      avg: avgVal,
      pointVal,
      isLivePoint,
      valuesByIdx,
      globalVals
    });
  }

  function setActiveVar(code, source) {
    const catalog = collectAllCandidateVars();
    const item = catalog.find(v => v.code === code) || catalog[0];
    if (!item) return;
    activeVarCode = item.code;

    syncAllThreeBlocks(catalog);
    updatePlayerCbarAndMap(item, getActiveHourIndex());

    if (source !== "host") {
      if (typeof window.onVarChange === "function") {
        try { window.onVarChange(item.code); } catch (_) {}
      }
      if (typeof window.refreshMap === "function") {
        try { window.refreshMap(); } catch (_) {}
      }
    }
  }

  function bindMapAndTimelineListeners() {
    const mapObj = resolveLeafletMap();
    if (mapObj && !mapObj._ewPointClickBound) {
      mapObj._ewPointClickBound = true;
      mapObj.on("click", async function (ev) {
        if (!ev || !ev.latlng) return;
        const myEpoch = ++clickEpoch;
        selectedPoint = {
          lat: ev.latlng.lat,
          lon: ev.latlng.lng
        };
        activeLocation = {
          il: "Konum Alınıyor...",
          ilce: "",
          mahalle: ""
        };
        renderTopLocationHeader();

        const catalog = collectAllCandidateVars();
        const item = catalog.find(v => v.code === activeVarCode) || catalog[0];

        if (item) {
          updatePlayerCbarAndMap(item, getActiveHourIndex());
        }
        auditAllVariablesForSelectedPoint(catalog, myEpoch);

        const resolvedLoc = await resolveReverseLocation(selectedPoint.lat, selectedPoint.lon);
        if (myEpoch !== clickEpoch) return;
        activeLocation = resolvedLoc;
        renderTopLocationHeader();
        if (item) {
          updatePlayerCbarAndMap(item, getActiveHourIndex());
        }
      });
    }

    const slider = document.getElementById("time-slider");
    if (slider && !slider.dataset.ewSliderBound) {
      slider.dataset.ewSliderBound = "1";
      slider.addEventListener("input", () => {
        const catalog = collectAllCandidateVars();
        const item = catalog.find(v => v.code === activeVarCode) || catalog[0];
        if (item) {
          updatePlayerCbarAndMap(item, getActiveHourIndex());
        }
      });
    }
  }

  function tick() {
    cleanWaitingTextFromCbarAndDom();
    const catalog = collectAllCandidateVars();
    const item = catalog.find(v => v.code === activeVarCode) || catalog[0];
    if (!item) return;
    syncAllThreeBlocks(catalog);
    bindMapAndTimelineListeners();
    const mapObj = resolveLeafletMap();
    if (mapObj && (!window.gridGroup || !mapObj.hasLayer(window.gridGroup) || window.gridGroup.getLayers().length === 0)) {
      updatePlayerCbarAndMap(item, getActiveHourIndex());
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => {
      cleanWaitingTextFromCbarAndDom();
      const cat = collectAllCandidateVars();
      setActiveVar(activeVarCode, "host");
      auditAllVariablesForSelectedPoint(cat, clickEpoch);
      bindMapAndTimelineListeners();
    });
  } else {
    cleanWaitingTextFromCbarAndDom();
    const cat = collectAllCandidateVars();
    setActiveVar(activeVarCode, "host");
    auditAllVariablesForSelectedPoint(cat, clickEpoch);
    bindMapAndTimelineListeners();
  }
  setInterval(tick, 1200);
})();
</script>
<!-- ew-twin-ecmwf-end -->
