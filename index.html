<script>
(function () {
  const PAL = ["#313695", "#4575b4", "#74add1", "#abd9e9", "#fee090", "#fdae61", "#f46d43", "#d73027"];

  const CATS = new Set([
    "sıcaklık", "basınç", "rüzgar", "yağış",
    "nem & bulut & toprak", "nem / bulut / toprak",
    "temperature", "pressure", "wind", "precipitation"
  ]);

  const pt = {
    lat: 41.0082,
    lon: 28.9784,
    place: "Konum bekleniyor...",
    key: "temperature_2m",
    name: "temperature 2m",
    unit: "°C",
    val: NaN,
    min: NaN,
    max: NaN
  };

  let pointGroup = null;
  let reqCounter = 0;

  function getMap() {
    if (window.map && typeof window.map.on === "function") return window.map;
    if (window._map && typeof window._map.on === "function") return window._map;
    return null;
  }

  function fmt(v, u) {
    if (!Number.isFinite(v)) return "-";
    if (u === "m³/m³") return v.toFixed(3);
    if (u === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || u === "hPa" || u === "m" || u === "°" || u === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function colorForValue(v, center) {
    const base = Number.isFinite(center) ? center : 15;
    const spread = Math.max(Math.abs(base) * 0.35, 3);
    const t = Math.max(0, Math.min(1, (v - (base - spread)) / (2 * spread)));
    return PAL[Math.min(PAL.length - 1, Math.floor(t * PAL.length))];
  }

  function renderUI() {
    const coordText = `${pt.lat.toFixed(4)}°N, ${pt.lon.toFixed(4)}°E`;
    const valText = Number.isFinite(pt.val) ? `${fmt(pt.val, pt.unit)} ${pt.unit}`.trim() : `- ${pt.unit}`.trim();

    const cbar = document.getElementById("ew-static-cbar");
    if (cbar) {
      cbar.innerHTML = `
        <div class="ew-sc-row">
          <span>${pt.name} · Birim: ${pt.unit}</span>
          <span>${valText}</span>
        </div>
        <div class="ew-sc-scale"></div>
        <div class="ew-sc-sub">
          <span>${coordText}</span>
          <span>${pt.place}</span>
        </div>
      `;
    }

    const rp = document.getElementById("ew-ui-right");
    if (rp) {
      rp.innerHTML = `
        <div style="font-size:11px;font-weight:700;color:#7dd3fc;">KOORDİNAT: ${coordText}</div>
        <div style="font-size:12px;font-weight:700;margin-top:4px;">${pt.place}</div>
        <div style="font-size:14px;font-weight:800;margin-top:6px;">${pt.name} [${pt.unit}]: ${valText}</div>
      `;
    }

    document.querySelectorAll(".leaflet-popup-content").forEach((el) => {
      el.innerHTML = `<div><b>${pt.place}</b><br/>${coordText}<br/><b>${pt.name}:</b> ${valText}</div>`;
    });

    const mp = getMap();
    if (mp && typeof window.L !== "undefined" && typeof mp.addLayer === "function") {
      if (!pointGroup) {
        pointGroup = window.L.layerGroup().addTo(mp);
      } else if (mp.hasLayer && !mp.hasLayer(pointGroup)) {
        pointGroup.addTo(mp);
      }
      pointGroup.clearLayers();

      const baseVal = Number.isFinite(pt.val) ? pt.val : 15;
      const offsets = [
        [0, 0],
        [0.25, 0], [-0.25, 0], [0, 0.35], [0, -0.35],
        [0.25, 0.35], [0.25, -0.35], [-0.25, 0.35], [-0.25, -0.35]
      ];
      offsets.forEach(([dLat, dLon], idx) => {
        const lat = pt.lat + dLat;
        const lon = pt.lon + dLon;
        const dist = Math.hypot(dLat, dLon);
        const v = baseVal + (0.4 - Math.min(1, dist)) * Math.max(Math.abs(baseVal) * 0.25, 2.5);
        const col = colorForValue(v, baseVal);
        window.L.circle([lat, lon], {
          radius: idx === 0 ? 7500 : 12000,
          stroke: idx === 0,
          color: "#ffffff",
          weight: idx === 0 ? 2 : 0,
          opacity: idx === 0 ? 0.95 : 0,
          fillColor: col,
          fillOpacity: idx === 0 ? 0.9 : 0.48,
          interactive: false
        }).addTo(pointGroup);
      });
    }
  }

  async function fetchPointPlaceAndData(lat, lon, fetchPlace) {
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    const seq = ++reqCounter;
    pt.lat = Number(lat);
    pt.lon = Number(lon);
    if (fetchPlace) {
      pt.place = `${pt.lat.toFixed(4)}, ${pt.lon.toFixed(4)}`;
    }
    pt.val = NaN;
    renderUI();

    if (fetchPlace) {
      try {
        const gUrl = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(pt.lat)}&lon=${encodeURIComponent(pt.lon)}&zoom=17&addressdetails=1&accept-language=tr`;
        const gr = await fetch(gUrl, { headers: { Accept: "application/json" } });
        if (gr.ok && seq === reqCounter) {
          const gj = await gr.json();
          const a = gj.address || {};
          const il = a.province || a.state || a.city || "Açık Deniz / Bölge";
          const ilce = a.town || a.county || a.city_district || a.district || "";
          const mah = a.neighbourhood || a.suburb || a.quarter || a.village || a.road || "-";
          pt.place = `${[il, ilce].filter(Boolean).join(" / ")} · Mahalle: ${mah}`;
          renderUI();
        }
      } catch (_) {}
    }

    try {
      const eUrl = `https://api.open-meteo.com/v1/ecmwf?latitude=${pt.lat.toFixed(4)}&longitude=${pt.lon.toFixed(4)}&hourly=${encodeURIComponent(pt.key)}&timezone=auto&forecast_days=7`;
      const er = await fetch(eUrl);
      if (!er.ok || seq !== reqCounter) return;
      const ej = await er.json();
      const arr = (ej && ej.hourly && Array.isArray(ej.hourly[pt.key])) ? ej.hourly[pt.key] : [];
      const times = (ej && ej.hourly && Array.isArray(ej.hourly.time)) ? ej.hourly.time : [];
      if (ej && ej.hourly_units && ej.hourly_units[pt.key]) {
        pt.unit = ej.hourly_units[pt.key];
      }
      const nums = arr.map(Number).filter(Number.isFinite);
      if (nums.length) {
        let bestIdx = 0, bestDiff = Infinity, now = Date.now();
        times.forEach((t, i) => {
          const d = Math.abs(Date.parse(t) - now);
          if (Number.isFinite(d) && d < bestDiff) { bestDiff = d; bestIdx = i; }
        });
        pt.val = nums[Math.min(nums.length - 1, bestIdx)];
        pt.min = Math.min(...nums);
        pt.max = Math.max(...nums);
      }
      renderUI();
    } catch (_) {}
  }

  document.addEventListener("click", function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (btn) {
      const raw = (btn.textContent || "").trim();
      if (!raw || CATS.has(raw.toLowerCase())) return;
      const um = raw.match(/\[([^\]]+)\]/);
      const unit = (btn.dataset && btn.dataset.unit) || (um ? um[1].trim() : "");
      const name = raw.replace(/\[[^\]]+\]/g, "").trim();
      if (!name) return;
      pt.name = name;
      pt.key = (btn.dataset && (btn.dataset.key || btn.dataset.varKey)) ||
        name.replace(/\s*\([^)]+\)/g, "").trim().replace(/\s+/g, "_");
      if (unit) pt.unit = unit;
      fetchPointPlaceAndData(pt.lat, pt.lon, false);
      return;
    }

    const mp = getMap();
    const mapEl = document.getElementById("map");
    if (mp && mapEl && mapEl.contains(ev.target) && typeof mp.mouseEventToLatLng === "function") {
      try {
        const ll = mp.mouseEventToLatLng(ev);
        if (ll && Number.isFinite(ll.lat) && Number.isFinite(ll.lng)) {
          fetchPointPlaceAndData(ll.lat, ll.lng, true);
        }
      } catch (_) {}
    }
  }, true);

  function bindLeaflet() {
    const mp = getMap();
    if (!mp || typeof mp.on !== "function" || mp.__ewMousePtBound) return;
    mp.__ewMousePtBound = true;
    mp.on("click", function (ev) {
      if (ev && ev.latlng && Number.isFinite(ev.latlng.lat) && Number.isFinite(ev.latlng.lng)) {
        fetchPointPlaceAndData(ev.latlng.lat, ev.latlng.lng, true);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      bindLeaflet();
      fetchPointPlaceAndData(pt.lat, pt.lon, true);
    });
  } else {
    bindLeaflet();
    fetchPointPlaceAndData(pt.lat, pt.lon, true);
  }
})();
</script>

<style>
  #ew-cursor-tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 99998;

    font-family: system-ui, -apple-system, sans-serif;

    box-shadow: 0 8px 20px rgba(2, 6, 23, 0.55);
  }

    font-weight: 700;

<script>
(function () {
  const geoCache = new Map();
  let hoverTimer = null;
  let hoverSeq = 0;

  let curHover = {
    lat: 41.0082,
    lon: 28.9784,
    place: "Konum aranıyor...",
    visible: false,
    x: 0,
    y: 0
  };

  function getMap() {
    if (window.map && typeof window.map.mouseEventToLatLng === "function") return window.map;
    if (window._map && typeof window._map.mouseEventToLatLng === "function") return window._map;
    return null;
  }

  function ensureTip() {
    let tip = document.getElementById("ew-cursor-tooltip");
    if (!tip) {
      tip = document.createElement("div");
      tip.id = "ew-cursor-tooltip";
      document.body.appendChild(tip);
    }
    return tip;
  }

  function formatPlaceFromAddress(addr, lat, lon) {
    const a = addr || {};
    const il = a.province || a.state || a.city || "Açık Deniz / Bölge";
    const ilce = a.town || a.county || a.city_district || a.district || "";
    const mah = a.neighbourhood || a.suburb || a.quarter || a.village || a.road || "-";
    const base = [il, ilce].filter(Boolean).join(" / ");
    if (!base) return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    return `${base} · Mahalle: ${mah}`;
  }

  function pushToRightPanel() {
    const rp = document.getElementById("ew-ui-right");
    if (!rp) return;

    const cStr = `${curHover.lat.toFixed(4)}°N, ${curHover.lon.toFixed(4)}°E`;
    let valLine = "";
    const cbar = document.getElementById("ew-static-cbar");
    if (cbar) {
      const topSpans = cbar.querySelectorAll(".ew-sc-row span");
      if (topSpans.length >= 2) {
        valLine = `${topSpans[0].textContent}: ${topSpans[1].textContent}`;
      }
    }

    rp.innerHTML = `
      <div style="font-size:11px;font-weight:700;color:#7dd3fc;">KOORDİNAT: ${cStr}</div>
      <div style="font-size:12px;font-weight:700;margin-top:4px;color:#f8fafc;">${curHover.place}</div>
      ${valLine ? `<div style="font-size:13px;font-weight:800;margin-top:6px;color:#e0f2fe;">${valLine}</div>` : ""}
    `;
  }

  function renderTip() {
    const tip = ensureTip();
    if (!curHover.visible) {
      tip.style.display = "none";
      return;
    }

    const cStr = `${curHover.lat.toFixed(4)}°N, ${curHover.lon.toFixed(4)}°E`;
    tip.innerHTML = `
      <div class="ew-ct-coord">${cStr}</div>
      <div class="ew-ct-place">${curHover.place}</div>
    `;

    const pad = 14;
    const w = tip.offsetWidth || 220;
    const h = tip.offsetHeight || 44;
    const left = Math.min(window.innerWidth - w - 10, Math.max(10, curHover.x + pad));
    const top = Math.min(window.innerHeight - h - 10, Math.max(10, curHover.y + pad));

    tip.style.left = `${left}px`;
    tip.style.top = `${top}px`;
    tip.style.display = "block";
  }

  async function lookupPlace(lat, lon) {
    const key = `${lat.toFixed(3)},${lon.toFixed(3)}`;
    if (geoCache.has(key)) {
      curHover.place = geoCache.get(key);
      renderTip();
      pushToRightPanel();
      return;
    }

    const seq = ++hoverSeq;
    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=17&addressdetails=1&accept-language=tr`;
      const res = await fetch(url, { headers: { Accept: "application/json" } });
      if (!res.ok || seq !== hoverSeq) return;
      const json = await res.json();
      const text = formatPlaceFromAddress(json.address, lat, lon);
      geoCache.set(key, text);
      curHover.place = text;
      renderTip();
      pushToRightPanel();
    } catch (_) {}
  }

  document.addEventListener("mousemove", function (ev) {
    const mp = getMap();
    const mapEl = document.getElementById("map");
    if (!mp || !mapEl || !mapEl.contains(ev.target)) {
      if (curHover.visible) {
        curHover.visible = false;
        renderTip();
      }
      return;
    }

    try {
      const ll = mp.mouseEventToLatLng(ev);
      if (!ll || !Number.isFinite(ll.lat) || !Number.isFinite(ll.lng)) return;

      curHover.lat = Number(ll.lat);
      curHover.lon = Number(ll.lng);
      curHover.x = ev.clientX;
      curHover.y = ev.clientY;
      curHover.visible = true;

      const cacheKey = `${curHover.lat.toFixed(3)},${curHover.lon.toFixed(3)}`;
      if (geoCache.has(cacheKey)) {
        curHover.place = geoCache.get(cacheKey);
        pushToRightPanel();
      }

      renderTip();

      if (hoverTimer) clearTimeout(hoverTimer);
      hoverTimer = setTimeout(function () {
        lookupPlace(curHover.lat, curHover.lon);
      }, 420);
    } catch (_) {}
  }, true);
})();
</script>

<!-- EW_FIX_GARBLED_LOC_START -->
<script>
(function () {
  const placeCache = new Map();
  let activeKey = "";
  let activePlace = "Konum bekleniyor...";
  let seq = 0;
  let timer = null;
  let busy = false;

  function cleanCoordPair(text) {
    if (!text) return null;
    const m = text.match(/(-?\d{1,2}\.\d{3,6})°?N?,\s*(-?\d{1,3}\.\d{3,6})°?E?/i);
    if (!m) return null;
    const lat = Number(m[1]);
    const lon = Number(m[2]);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
    return {
      lat,
      lon,
      dms: `${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E`,
      dec: `${lat.toFixed(4)}, ${lon.toFixed(4)}`
    };
  }

  function buildPlaceString(addr, displayName, lat, lon) {
    const a = addr || {};
    const il = a.province || a.state || a.city || "";
    const ilce = a.town || a.county || a.city_district || a.district || a.municipality || "";
    const mah = a.neighbourhood || a.suburb || a.quarter || a.village || a.hamlet || a.road || "";

    const mainParts = [];
    if (il) mainParts.push(il);
    if (ilce && ilce !== il) mainParts.push(ilce);

    if (mainParts.length && mah) {
      return `${mainParts.join(" / ")} · ${mah}`;
    }
    if (mainParts.length) {
      return mainParts.join(" / ");
    }
    if (mah) {
      return mah;
    }
    if (displayName) {
      const shortDisp = String(displayName).split(",").slice(0, 2).map(s => s.trim()).filter(Boolean).join(" / ");
      if (shortDisp && !/^\d/.test(shortDisp)) return shortDisp;
    }
    return `Bölge (${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E)`;
  }

  function renderAllTargets(lat, lon, placeText) {
    if (busy) return;
    busy = true;
    try {
      const dms = `${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E`;
      const dec = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;

      // Eski hatalı konum etiketlerini temizle
      document.querySelectorAll(".ew-inline-place-tag").forEach((n) => n.remove());

      const nodes = Array.from(document.querySelectorAll("div, p, span, b, strong, small, label"));
      for (const el of nodes) {
        if (el.id === "ew-cursor-tooltip" || el.id === "ew-static-cbar" || el.id === "ew-ui-right") continue;
        if (el.children && el.children.length > 2) continue;

        const raw = (el.textContent || "").trim();
        if (!raw || raw.length > 220) continue;
        if (raw.includes("Konum:") && /\d{5,}/.test(raw)) {
          el.textContent = dms;
        }
      }

      // Sağ panel (#ew-ui-right) koordinat ve il/ilçe satırı
      const rp = document.getElementById("ew-ui-right");
      if (rp) {
        const lines = Array.from(rp.querySelectorAll("div"));
        if (lines.length >= 1) {
          lines[0].textContent = `KOORDİNAT: ${dms} (${dec})`;
        }
        let locRow = rp.querySelector(".ew-rp-place-line");
        if (!locRow) {
          locRow = document.createElement("div");
          locRow.className = "ew-rp-place-line";
          locRow.style.cssText = "font-size:12px;font-weight:700;color:#7dd3fc;margin-top:4px;";
          if (lines.length >= 2) {
            lines[1].insertAdjacentElement("afterend", locRow);
          } else {
            rp.appendChild(locRow);
          }
        }
        locRow.textContent = `İl / İlçe: ${placeText}`;
      }

      // İmleç kutusu (#ew-cursor-tooltip)
      const tip = document.getElementById("ew-cursor-tooltip");
      if (tip && tip.style.display !== "none") {
        tip.innerHTML = `
          <div class="ew-ct-coord">${dms}</div>
          <div class="ew-ct-place">${placeText}</div>
        `;
      }
    } finally {
      busy = false;
    }
  }

  async function fetchReversePlace(lat, lon) {
    const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
    if (placeCache.has(key)) {
      activePlace = placeCache.get(key);
      renderAllTargets(lat, lon, activePlace);
      return;
    }

    const mySeq = ++seq;
    activePlace = "İl / ilçe alınıyor...";
    renderAllTargets(lat, lon, activePlace);

    for (const zoom of [15, 10]) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=${zoom}&addressdetails=1&accept-language=tr`;
        const res = await fetch(url, { headers: { Accept: "application/json" } });
        if (!res.ok || mySeq !== seq) return;
        const data = await res.json();
        const formatted = buildPlaceString(data.address, data.display_name, lat, lon);
        if (formatted && !formatted.startsWith("Bölge (")) {
          placeCache.set(key, formatted);
          activePlace = formatted;
          renderAllTargets(lat, lon, activePlace);
          return;
        }
      } catch (_) {}
    }

    if (mySeq === seq) {
      const fallback = `Açık Alan · ${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E`;
      placeCache.set(key, fallback);
      activePlace = fallback;
      renderAllTargets(lat, lon, activePlace);
    }
  }

  function scheduleFromCoord(lat, lon) {
    const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
    if (key === activeKey) {
      renderAllTargets(lat, lon, activePlace);
      return;
    }
    activeKey = key;
    if (placeCache.has(key)) {
      activePlace = placeCache.get(key);
      renderAllTargets(lat, lon, activePlace);
      return;
    }
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => fetchReversePlace(lat, lon), 260);
  }

  function inspectDomCoord() {
    if (busy) return;
    const nodes = Array.from(document.querySelectorAll("div, p, span, small"));
    for (const el of nodes) {
      if (el.id === "ew-cursor-tooltip") continue;
      const txt = (el.textContent || "").trim();
      const parsed = cleanCoordPair(txt);
      if (parsed) {
        scheduleFromCoord(parsed.lat, parsed.lon);
        break;
      }
    }
  }

  const mo = new MutationObserver(() => {
    if (!busy) inspectDomCoord();
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => {
      inspectDomCoord();
      if (document.body) mo.observe(document.body, { childList: true, subtree: true });
    });
  } else {
    inspectDomCoord();
    if (document.body) mo.observe(document.body, { childList: true, subtree: true });
  }
})();
</script>
