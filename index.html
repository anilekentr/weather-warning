    ["wind_speed_500hPa", "km/h"], ["wind_direction_500hPa", "°"], ["vertical_velocity_500hPa", "m/s"],
    ["temperature_400hPa", "°C"], ["geopotential_height_400hPa", "m"], ["relative_humidity_400hPa", "%"], ["dew_point_400hPa", "°C"],
    ["wind_speed_400hPa", "km/h"], ["wind_direction_400hPa", "°"], ["vertical_velocity_400hPa", "m/s"],
    ["temperature_300hPa", "°C"], ["geopotential_height_300hPa", "m"], ["relative_humidity_300hPa", "%"], ["dew_point_300hPa", "°C"],
    ["wind_speed_300hPa", "km/h"], ["wind_direction_300hPa", "°"], ["vertical_velocity_300hPa", "m/s"],
    ["temperature_250hPa", "°C"], ["geopotential_height_250hPa", "m"], ["relative_humidity_250hPa", "%"], ["dew_point_250hPa", "°C"],
    ["wind_speed_250hPa", "km/h"], ["wind_direction_250hPa", "°"], ["vertical_velocity_250hPa", "m/s"],
    ["temperature_200hPa", "°C"], ["geopotential_height_200hPa", "m"], ["relative_humidity_200hPa", "%"], ["dew_point_200hPa", "°C"],
    ["wind_speed_200hPa", "km/h"], ["wind_direction_200hPa", "°"], ["vertical_velocity_200hPa", "m/s"],
    ["temperature_150hPa", "°C"], ["geopotential_height_150hPa", "m"], ["relative_humidity_150hPa", "%"], ["dew_point_150hPa", "°C"],
    ["wind_speed_150hPa", "km/h"], ["wind_direction_150hPa", "°"], ["vertical_velocity_150hPa", "m/s"],
    ["temperature_100hPa", "°C"], ["geopotential_height_100hPa", "m"], ["relative_humidity_100hPa", "%"], ["dew_point_100hPa", "°C"],
    ["wind_speed_100hPa", "km/h"], ["wind_direction_100hPa", "°"], ["vertical_velocity_100hPa", "m/s"],
    ["temperature_50hPa", "°C"], ["geopotential_height_50hPa", "m"], ["relative_humidity_50hPa", "%"], ["dew_point_50hPa", "°C"],
    ["wind_speed_50hPa", "km/h"], ["wind_direction_50hPa", "°"], ["vertical_velocity_50hPa", "m/s"]
  ];

  const CATS = ["Sıcaklık", "Basınç", "Rüzgar", "Yağış", "Nem & Bulut & Toprak"];
  const PAL = ["#313695", "#4575b4", "#74add1", "#abd9e9", "#fee090", "#fdae61", "#f46d43", "#d73027"];

  let curCat = "Sıcaklık";
  let curVar = VARS_125[0][0];
  let curUnit = VARS_125[0][1];
  let ptState = { lat: 41.0082, lon: 28.9784, il: "İstanbul", ilce: "Fatih", mahalle: "Eminönü", val: NaN, minV: NaN, maxV: NaN, series: [] };
  let pinMarker = null;
  let colorGridGroup = null;
  let seqId = 0;
  const mapsFound = new Set();
  const geoMemo = new Map();
  const varMemo = new Map();

  function catOf(key) {
    if (key.startsWith("temperature_") || key === "apparent_temperature") return "Sıcaklık";
    if (key === "pressure_msl" || key === "surface_pressure" || key.startsWith("geopotential_height_")) return "Basınç";
    if (key.startsWith("wind_") || key.startsWith("vertical_velocity_")) return "Rüzgar";
    if (["precipitation", "rain", "snowfall", "snow_depth", "weather_code"].includes(key)) return "Yağış";
    return "Nem & Bulut & Toprak";
  }

  function prettyName(key) {
    return key.replace(/_(\d+)hPa$/, " ($1 hPa)").replace(/_/g, " ");
  }

  function fmtNum(v, unit) {
    if (!Number.isFinite(v)) return "-";
    if (unit === "m³/m³") return v.toFixed(3);
    if (unit === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || unit === "hPa" || unit === "m" || unit === "°" || unit === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function colorForRatio(t) {
    const k = Math.max(0, Math.min(1, Number.isFinite(t) ? t : 0.5));
    const idx = Math.min(PAL.length - 1, Math.floor(k * PAL.length));
    return PAL[idx];
  }

  function ensureShellElements() {
    let leftPanel = document.getElementById("ew-ecmwf-var-bar");
    if (!leftPanel) {
      leftPanel = document.createElement("div");
      leftPanel.id = "ew-ecmwf-var-bar";
      document.body.appendChild(leftPanel);
    }
    if (!leftPanel.dataset.ready) {
      leftPanel.innerHTML = `<div class="ew-pro-cat-bar" id="ew-pro-cat-bar"></div><div class="ew-pro-var-list" id="ew-pro-var-list"></div>`;
      leftPanel.dataset.ready = "1";
    }

    let rightPanel = document.getElementById("ew-dual-panel");
    if (!rightPanel) {
      rightPanel = document.createElement("aside");
      rightPanel.id = "ew-dual-panel";
      document.body.appendChild(rightPanel);
    }
    if (!rightPanel.dataset.ready) {
      rightPanel.innerHTML = `
        <div class="ew-pro-top-coord">
          <span>KOORDİNAT</span>
          <span class="ew-pro-coord-pill" id="ew-pro-coord-val">41.0082°N, 28.9784°E</span>
        </div>
        <div class="ew-pro-loc-box">
          <div class="ew-pro-loc-il-ilce" id="ew-pro-il-ilce">İstanbul / Fatih</div>
          <div class="ew-pro-loc-mahalle" id="ew-pro-mahalle">Mahalle: -</div>
        </div>
        <div class="ew-pro-val-box">
          <div class="ew-pro-card">
            <div class="ew-pro-card-lbl">Seçili Değişken</div>
            <div class="ew-pro-card-val" id="ew-pro-var-val">-</div>
            <div class="ew-pro-card-sub" id="ew-pro-var-name">-</div>
          </div>
          <div class="ew-pro-card">
            <div class="ew-pro-card-lbl">Min .. Max</div>
            <div class="ew-pro-card-val" id="ew-pro-range-val">-</div>
            <div class="ew-pro-card-sub" id="ew-pro-unit-sub">Birim: -</div>
          </div>
        </div>
      `;
      rightPanel.dataset.ready = "1";
    }

    let cbar = document.getElementById("ew-cbar");
    if (!cbar) {
      cbar = document.createElement("div");
      cbar.id = "ew-cbar";
      document.body.appendChild(cbar);
    }
    if (!cbar.dataset.ready) {
      cbar.innerHTML = `
        <div class="ew-pro-cbar-head">
          <span id="ew-pro-cbar-title">Değişken</span>
          <span id="ew-pro-cbar-val">-</span>
        </div>
        <div class="ew-pro-cbar-grad" id="ew-pro-cbar-grad"></div>
        <div class="ew-pro-cbar-bins" id="ew-pro-cbar-bins"></div>
      `;
      cbar.dataset.ready = "1";
    }
  }

  function renderCategoryAndVarButtons() {
    ensureShellElements();
    const catBar = document.getElementById("ew-pro-cat-bar");
    const varList = document.getElementById("ew-pro-var-list");
    if (!catBar || !varList) return;

    catBar.innerHTML = "";
    CATS.forEach(cat => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ew-pro-cat-btn" + (cat === curCat ? " is-active" : "");
      const cnt = VARS_125.filter(([k]) => catOf(k) === cat).length;
      btn.textContent = `${cat} (${cnt})`;
      btn.addEventListener("click", ev => {
        ev.stopPropagation();
        curCat = cat;
        renderCategoryAndVarButtons();
      });
      catBar.appendChild(btn);
    });

    varList.innerHTML = "";
    const items = VARS_125.filter(([k]) => catOf(k) === curCat);
    items.forEach(([k, u]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "ew-pro-var-btn" + (k === curVar ? " is-active" : "");
      b.dataset.key = k;
      b.dataset.unit = u;
      b.textContent = `${prettyName(k)} [${u}]`;
      b.addEventListener("click", ev => {
        ev.stopPropagation();
        activateVariable(k, u);
      });
      varList.appendChild(b);
    });
  }

  function paintFullMapWithVariable(centerLat, centerLon, series, nowVal, lo, hi) {
    if (typeof window.L === "undefined") return;
    const mp = mapsFound.values().next().value || window.map || window._map;
    if (!mp || typeof mp.addLayer !== "function") return;

    if (!colorGridGroup) {
      colorGridGroup = window.L.layerGroup().addTo(mp);
    } else if (mp.hasLayer && !mp.hasLayer(colorGridGroup)) {
      colorGridGroup.addTo(mp);
    }
    colorGridGroup.clearLayers();

    const valid = (Array.isArray(series) ? series : []).filter(Number.isFinite);
    const minV = Number.isFinite(lo) ? lo : (valid.length ? Math.min(...valid) : 0);
    const maxV = Number.isFinite(hi) ? hi : (valid.length ? Math.max(...valid) : 1);
    const span = Math.max(1e-6, maxV - minV);

    // Harita üzerinde seçili değişkenin değerine göre geniş bölgesel grid/renk katmanı oluştur
    const cols = 7;
    const rows = 5;
    const dLat = 0.45;
    const dLon = 0.65;

    for (let r = -Math.floor(rows / 2); r <= Math.floor(rows / 2); r++) {
      for (let c = -Math.floor(cols / 2); c <= Math.floor(cols / 2); c++) {
        const dist = Math.hypot(r, c);
        const sampleIdx = Math.min(valid.length - 1, Math.max(0, Math.floor(((r + 2) * cols + (c + 3)) / (rows * cols) * Math.max(1, valid.length - 1))));
        const baseCellVal = valid.length ? valid[sampleIdx] : (Number.isFinite(nowVal) ? nowVal : minV);
        const cellVal = Number.isFinite(nowVal)
          ? (nowVal * 0.72 + baseCellVal * 0.28)
          : baseCellVal;
        const ratio = (cellVal - minV) / span;
        const fillCol = colorForRatio(ratio);

        const lat0 = centerLat + r * dLat - dLat * 0.5;
        const lat1 = centerLat + r * dLat + dLat * 0.5;
        const lon0 = centerLon + c * dLon - dLon * 0.5;
        const lon1 = centerLon + c * dLon + dLon * 0.5;

        const rect = window.L.rectangle([[lat0, lon0], [lat1, lon1]], {
          stroke: false,
          fillColor: fillCol,
          fillOpacity: Math.max(0.14, 0.34 - dist * 0.03),
          interactive: false
        });
        colorGridGroup.addLayer(rect);
      }
    }
  }

  function refreshCbarAndRightPanel() {
    ensureShellElements();
    const pName = prettyName(curVar);
    const unit = curUnit || "";
    const valStr = Number.isFinite(ptState.val) ? `${fmtNum(ptState.val, unit)} ${unit}`.trim() : `- ${unit}`.trim();

    let lo = ptState.minV;
    let hi = ptState.maxV;
    if (!Number.isFinite(lo) || !Number.isFinite(hi)) {
      const s = (ptState.series || []).filter(Number.isFinite);
      if (s.length) {
        lo = Math.min(...s);
        hi = Math.max(...s);
      }
    }
    if (Number.isFinite(lo) && Number.isFinite(hi) && lo === hi) {
      lo -= 1;
      hi += 1;
    }

    // Sağ panel güncelle
    const coordEl = document.getElementById("ew-pro-coord-val");
    const ilIlceEl = document.getElementById("ew-pro-il-ilce");
    const mahEl = document.getElementById("ew-pro-mahalle");
    const vValEl = document.getElementById("ew-pro-var-val");
    const vNameEl = document.getElementById("ew-pro-var-name");
    const rValEl = document.getElementById("ew-pro-range-val");
    const uSubEl = document.getElementById("ew-pro-unit-sub");

    if (coordEl) coordEl.textContent = `${ptState.lat.toFixed(4)}°N, ${ptState.lon.toFixed(4)}°E`;
    if (ilIlceEl) ilIlceEl.textContent = [ptState.il, ptState.ilce].filter(Boolean).join(" / ") || "Konum";
    if (mahEl) mahEl.textContent = `Mahalle: ${ptState.mahalle || "-"}`;
    if (vValEl) vValEl.textContent = valStr;
    if (vNameEl) vNameEl.textContent = pName;
    if (rValEl) rValEl.textContent = (Number.isFinite(lo) && Number.isFinite(hi)) ? `${fmtNum(lo, unit)}..${fmtNum(hi, unit)}` : "-";
    if (uSubEl) uSubEl.textContent = `Birim: ${unit || "-"}`;

    // CBAR güncelle (İsim + Birim + Değer + Renk Skalası)
    const cbarTitle = document.getElementById("ew-pro-cbar-title");
    const cbarVal = document.getElementById("ew-pro-cbar-val");
    const cbarGrad = document.getElementById("ew-pro-cbar-grad");
    const cbarBins = document.getElementById("ew-pro-cbar-bins");

    if (cbarTitle) cbarTitle.textContent = `${pName} · Birim: ${unit || "-"}`;
    if (cbarVal) cbarVal.textContent = `${valStr}`;

    if (cbarGrad && cbarBins && Number.isFinite(lo) && Number.isFinite(hi)) {
      const bins = 6;
      const step = (hi - lo) / bins;
      const stops = [];
      const pills = [];
      for (let i = 0; i < bins; i++) {
        const a = lo + i * step;
        const b = i === bins - 1 ? hi : lo + (i + 1) * step;
        const col = PAL[Math.min(PAL.length - 1, Math.floor((i / bins) * PAL.length))];
        stops.push(`${col} ${((i / (bins - 1)) * 100).toFixed(1)}%`);
        pills.push(`<span class="ew-pro-bin" style="border-left:4px solid ${col};">${fmtNum(a, unit)}..${fmtNum(b, unit)}</span>`);
      }
      cbarGrad.style.background = `linear-gradient(90deg, ${stops.join(", ")})`;
      cbarBins.innerHTML = pills.join("");
    }

    paintFullMapWithVariable(ptState.lat, ptState.lon, ptState.series, ptState.val, lo, hi);
  }

  async function resolvePlace(lat, lon) {
    const k = `${lat.toFixed(4)},${lon.toFixed(4)}`;
    if (geoMemo.has(k)) return geoMemo.get(k);
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=17&addressdetails=1&accept-language=tr`;
    const r = await fetch(url, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error("geo");
    const j = await r.json();
    const a = (j && j.address) || {};
    const out = {
      il: a.province || a.state || a.city || a.region || "Açık Alan / Deniz",
      ilce: a.town || a.county || a.city_district || a.district || a.municipality || "",
      mahalle: a.neighbourhood || a.suburb || a.quarter || a.village || a.hamlet || a.road || "-"
    };
    geoMemo.set(k, out);
    return out;
  }

  async function resolveEcmwfVar(lat, lon, key, fallbackUnit) {
    const k = `${lat.toFixed(3)},${lon.toFixed(3)}:${key}`;
    if (varMemo.has(k)) return varMemo.get(k);
    const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&hourly=${encodeURIComponent(key)}&timezone=auto&forecast_days=7`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("ecmwf");
    const j = await r.json();
    const raw = (j && j.hourly && Array.isArray(j.hourly[key])) ? j.hourly[key] : [];
    const times = (j && j.hourly && Array.isArray(j.hourly.time)) ? j.hourly.time : [];
    const unit = (j && j.hourly_units && j.hourly_units[key]) ? j.hourly_units[key] : fallbackUnit;
    const series = raw.map(Number).filter(Number.isFinite);

    let bestIdx = 0, bestDiff = Infinity;
    const nowMs = Date.now();
    for (let i = 0; i < times.length; i++) {
      const ms = Date.parse(times[i]);
      if (Number.isFinite(ms) && Math.abs(ms - nowMs) < bestDiff) {
        bestDiff = Math.abs(ms - nowMs);
        bestIdx = i;
      }
    }
    const val = series.length ? series[Math.min(series.length - 1, bestIdx)] : NaN;
    const minV = series.length ? Math.min(...series) : NaN;
    const maxV = series.length ? Math.max(...series) : NaN;
    const out = { val, minV, maxV, series, unit };
    varMemo.set(k, out);
    return out;
  }

  function placePin(mp, lat, lon, htmlPopup) {
    if (!mp || typeof window.L === "undefined") return;
    try {
      if (pinMarker && mp.hasLayer(pinMarker)) mp.removeLayer(pinMarker);
      const icon = window.L.divIcon({
        className: "ew-blue-pin-wrap",
        html: '<div class="ew-blue-pin-dot"></div>',
        iconSize: [15, 15],
        iconAnchor: [7, 7]
      });
      pinMarker = window.L.marker([lat, lon], { icon, interactive: true }).addTo(mp);
      if (htmlPopup) pinMarker.bindPopup(htmlPopup).openPopup();
    } catch (_) {}
  }

  async function inspectPointAndVar(lat, lon, key, unit, showPopup) {
    const seq = ++seqId;
    ptState.lat = lat;
    ptState.lon = lon;
    ptState.val = NaN;
    refreshCbarAndRightPanel();

    const mp = mapsFound.values().next().value || window.map || window._map;
    if (showPopup && mp) {
      placePin(mp, lat, lon, `<b>${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E</b><br/>Yükleniyor...`);
    }

    const [pRes, vRes] = await Promise.allSettled([
      resolvePlace(lat, lon),
      resolveEcmwfVar(lat, lon, key, unit)
    ]);

    if (seq !== seqId) return;

    if (pRes.status === "fulfilled" && pRes.value) {
      ptState.il = pRes.value.il;
      ptState.ilce = pRes.value.ilce;
      ptState.mahalle = pRes.value.mahalle;
    }
    if (vRes.status === "fulfilled" && vRes.value) {
      ptState.val = vRes.value.val;
      ptState.minV = vRes.value.minV;
      ptState.maxV = vRes.value.maxV;
      ptState.series = vRes.value.series;
      curUnit = vRes.value.unit || unit || curUnit;
    }

    refreshCbarAndRightPanel();

    if (showPopup && mp) {
      const placeStr = [ptState.il, ptState.ilce, ptState.mahalle].filter(x => x && x !== "-").join(" / ");
      const valStr = Number.isFinite(ptState.val) ? `${fmtNum(ptState.val, curUnit)} ${curUnit}`.trim() : `- ${curUnit}`.trim();
      placePin(mp, lat, lon, `<b>${placeStr || "Konum"}</b><br/>${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E<br/><b>${prettyName(curVar)}:</b> ${valStr}`);
    }
  }

  async function activateVariable(key, unit) {
    curCat = catOf(key);
    curVar = key;
    curUnit = unit || curUnit;
    renderCategoryAndVarButtons();
    await inspectPointAndVar(ptState.lat, ptState.lon, curVar, curUnit, false);
  }

  function hookMapInstance(mp) {
    if (!mp || typeof mp.on !== "function" || mp.__ewProBound) return;
    mp.__ewProBound = true;
    mapsFound.add(mp);
    mp.on("click", function (ev) {
      if (ev && ev.latlng && Number.isFinite(ev.latlng.lat) && Number.isFinite(ev.latlng.lng)) {
        inspectPointAndVar(Number(ev.latlng.lat), Number(ev.latlng.lng), curVar, curUnit, true);
      }
    });
  }

  if (typeof window.L !== "undefined" && window.L.Map && window.L.Map.addInitHook && !window.__ewProInitHook) {
    window.__ewProInitHook = true;
    window.L.Map.addInitHook(function () {
      hookMapInstance(this);
    });
  }

  function scanGlobalMaps() {
    if (window.map) hookMapInstance(window.map);
    if (window._map) hookMapInstance(window._map);
    for (const k of Object.keys(window)) {
      try {
        const obj = window[k];
        if (obj && typeof obj === "object" && typeof obj.on === "function" && typeof obj.getCenter === "function") {
          hookMapInstance(obj);
        }
      } catch (_) {}
    }
  }

  function startProUi() {
    scanGlobalMaps();
    renderCategoryAndVarButtons();
    inspectPointAndVar(ptState.lat, ptState.lon, curVar, curUnit, false);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(startProUi, 200));
  } else {
    setTimeout(startProUi, 200);
  }

  setInterval(() => {
    scanGlobalMaps();
    const list = document.getElementById("ew-pro-var-list");
    if (list && list.children.length === 0) {
      renderCategoryAndVarButtons();
    }
  }, 1500);
})();
</script>



<script>
(function () {
  const SCALE = ["#313695", "#4575b4", "#74add1", "#abd9e9", "#fee090", "#fdae61", "#f46d43", "#d73027"];
  let activeKey = "temperature_2m";
  let activeUnit = "°C";
  let activeSeries = [];
  let activeNowVal = NaN;
  let activeCoord = { lat: 41.0082, lon: 28.9784 };
  let gridGroup = null;
  const boundMaps = new Set();

  function prettyVarName(key) {
    return String(key || "")
      .replace(/_(\d+)hPa$/, " ($1 hPa)")
      .replace(/_(\d+)m$/, " ($1 m)")
      .replace(/_/g, " ")
      .trim();
  }

  function fmtVal(v, unit) {
    if (!Number.isFinite(v)) return "-";
    if (unit === "m³/m³") return v.toFixed(3);
    if (unit === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || unit === "hPa" || unit === "m" || unit === "°" || unit === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function colorByNorm(t) {
    const k = Math.max(0, Math.min(1, Number.isFinite(t) ? t : 0.5));
    const i = Math.min(SCALE.length - 1, Math.floor(k * SCALE.length));
    return SCALE[i];
  }

  function getMap() {
    if (window.map) return window.map;
    if (window._map) return window._map;
    for (const m of boundMaps) return m;
    for (const k of Object.keys(window)) {
      try {
        const v = window[k];
        if (v && typeof v === "object" && typeof v.on === "function" && typeof v.addLayer === "function") return v;
      } catch (_) {}
    }
    return null;
  }

  function registerMap(m) {
    if (!m || typeof m.on !== "function" || m.__ewFullGridHook) return;
    m.__ewFullGridHook = true;
    boundMaps.add(m);

    const redraw = () => paintDataGridOnMap();
    m.on("moveend", redraw);
    m.on("zoomend", redraw);
    m.on("click", function (ev) {
      if (ev && ev.latlng && Number.isFinite(ev.latlng.lat) && Number.isFinite(ev.latlng.lng)) {
        activeCoord = { lat: Number(ev.latlng.lat), lon: Number(ev.latlng.lng) };
        loadAndApplyVariable(activeKey, activeUnit);
      }
    });
  }

  if (typeof window.L !== "undefined" && window.L.Map && window.L.Map.addInitHook && !window.__ewFullGridInitHook) {
    window.__ewFullGridInitHook = true;
    window.L.Map.addInitHook(function () {
      registerMap(this);
    });
  }

  function paintDataGridOnMap() {
    if (typeof window.L === "undefined") return;
    const mp = getMap();
    if (!mp || typeof mp.getBounds !== "function" || typeof mp.addLayer !== "function") return;

    if (!gridGroup) {
      gridGroup = window.L.layerGroup().addTo(mp);
    } else if (mp.hasLayer && !mp.hasLayer(gridGroup)) {
      gridGroup.addTo(mp);
    }
    gridGroup.clearLayers();

    const vals = (Array.isArray(activeSeries) ? activeSeries : []).filter(Number.isFinite);
    if (!vals.length && !Number.isFinite(activeNowVal)) return;

    let minV = vals.length ? Math.min(...vals) : activeNowVal;
    let maxV = vals.length ? Math.max(...vals) : activeNowVal;
    if (minV === maxV) {
      const pad = Math.max(Math.abs(minV) * 0.1, 1);
      minV -= pad;
      maxV += pad;
    }
    const span = Math.max(1e-6, maxV - minV);

    const b = mp.getBounds();
    const s = b.getSouth(), n = b.getNorth(), w = b.getWest(), e = b.getEast();
    const cols = 12;
    const rows = 9;
    const latStep = (n - s) / rows;
    const lonStep = (e - w) / cols;
    const centerLat = Number.isFinite(activeCoord.lat) ? activeCoord.lat : (n + s) * 0.5;
    const centerLon = Number.isFinite(activeCoord.lon) ? activeCoord.lon : (w + e) * 0.5;
    const maxDist = Math.max(1e-4, Math.hypot((n - s) * 0.5, (e - w) * 0.5));

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const y0 = s + r * latStep;
        const y1 = y0 + latStep;
        const x0 = w + c * lonStep;
        const x1 = x0 + lonStep;
        const cy = (y0 + y1) * 0.5;
        const cx = (x0 + x1) * 0.5;

        const idx = Math.min(vals.length - 1, Math.max(0, (r * cols + c) % Math.max(1, vals.length)));
        const serieSample = vals.length ? vals[idx] : activeNowVal;
        const distWeight = 1 - Math.min(1, Math.hypot(cy - centerLat, cx - centerLon) / maxDist);
        const cellVal = Number.isFinite(activeNowVal)
          ? (activeNowVal * (0.45 + 0.35 * distWeight) + serieSample * (0.55 - 0.35 * distWeight))
          : serieSample;

        const norm = (cellVal - minV) / span;
        const col = colorByNorm(norm);

        const cellRect = window.L.rectangle([[y0, x0], [y1, x1]], {
          stroke: false,
          fillColor: col,
          fillOpacity: 0.30,
          interactive: false
        });
        gridGroup.addLayer(cellRect);
      }
    }
  }

  function updateCbarWithVarAndUnit() {
    const cbar = document.getElementById("ew-cbar");
    if (!cbar) return;

    const pName = prettyVarName(activeKey);
    const unitTxt = activeUnit || "-";
    const nowFormatted = Number.isFinite(activeNowVal) ? `${fmtVal(activeNowVal, activeUnit)} ${activeUnit}`.trim() : `- ${activeUnit}`.trim();

    const vals = (Array.isArray(activeSeries) ? activeSeries : []).filter(Number.isFinite);
    let minV = vals.length ? Math.min(...vals) : NaN;
    let maxV = vals.length ? Math.max(...vals) : NaN;
    if (Number.isFinite(minV) && Number.isFinite(maxV) && minV === maxV) {
      minV -= 1;
      maxV += 1;
    }

    const titleEl = document.getElementById("ew-pro-cbar-title") || document.getElementById("ew-cbar-name") || document.getElementById("cbar-title");
    const valEl = document.getElementById("ew-pro-cbar-val") || document.getElementById("ew-cbar-cur");
    const gradEl = document.getElementById("ew-pro-cbar-grad") || document.getElementById("ew-cbar-gradient") || document.getElementById("ew-cbar-grad-bar");
    const binsEl = document.getElementById("ew-pro-cbar-bins") || document.getElementById("ew-cbar-bins") || document.getElementById("ew-cbar-bins-detail");

    if (titleEl) {
      titleEl.textContent = `${pName} · Birim: ${unitTxt}`;
    }
    if (valEl) {
      valEl.textContent = `${pName}: ${nowFormatted}`;
    }

    if (gradEl && binsEl && Number.isFinite(minV) && Number.isFinite(maxV)) {
      const bins = 6;
      const step = (maxV - minV) / bins;
      const stops = [];
      const pills = [];
      for (let i = 0; i < bins; i++) {
        const a = minV + i * step;
        const b = i === bins - 1 ? maxV : minV + (i + 1) * step;
        const col = SCALE[Math.min(SCALE.length - 1, Math.floor((i / bins) * SCALE.length))];
        stops.push(`${col} ${((i / (bins - 1)) * 100).toFixed(1)}%`);
        pills.push(`<span class="ew-pro-bin" style="border-left:4px solid ${col};">${fmtVal(a, activeUnit)}..${fmtVal(b, activeUnit)}</span>`);
      }
      gradEl.style.background = `linear-gradient(90deg, ${stops.join(", ")})`;
      binsEl.innerHTML = pills.join("");
    }

    document.querySelectorAll("button").forEach(btn => {
      const k = btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om);
      if (k) btn.classList.toggle("is-active", k === activeKey);
    });
  }

  async function loadAndApplyVariable(key, unitHint) {
    if (!key) return;
    activeKey = key;
    if (unitHint) activeUnit = unitHint;

    const cKey = `${activeCoord.lat.toFixed(3)},${activeCoord.lon.toFixed(3)}:${key}`;
    if (seriesCache.has(cKey)) {
      const hit = seriesCache.get(cKey);
      activeSeries = hit.series;
      activeNowVal = hit.nowVal;
      activeUnit = hit.unit || activeUnit;
      updateCbarWithVarAndUnit();
      paintDataGridOnMap();
      return;
    }

    updateCbarWithVarAndUnit();

    try {
      const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${activeCoord.lat.toFixed(4)}&longitude=${activeCoord.lon.toFixed(4)}&hourly=${encodeURIComponent(key)}&timezone=auto&forecast_days=7`;
      const res = await fetch(url);
      if (!res.ok) return;
      const json = await res.json();
      const raw = (json && json.hourly && Array.isArray(json.hourly[key])) ? json.hourly[key] : [];
      const times = (json && json.hourly && Array.isArray(json.hourly.time)) ? json.hourly.time : [];
      const apiUnit = (json && json.hourly_units && json.hourly_units[key]) ? json.hourly_units[key] : activeUnit;
      const series = raw.map(Number).filter(Number.isFinite);

      let bestIdx = 0, bestDiff = Infinity;
      const nowMs = Date.now();
      for (let i = 0; i < times.length; i++) {
        const ms = Date.parse(times[i]);
        if (Number.isFinite(ms) && Math.abs(ms - nowMs) < bestDiff) {
          bestDiff = Math.abs(ms - nowMs);
          bestIdx = i;
        }
      }
      const nowVal = series.length ? series[Math.min(series.length - 1, bestIdx)] : NaN;
      const pack = { series, nowVal, unit: apiUnit };
      seriesCache.set(cKey, pack);

      if (activeKey === key) {
        activeSeries = series;
        activeNowVal = nowVal;
        activeUnit = apiUnit;
        updateCbarWithVarAndUnit();
        paintDataGridOnMap();
      }
    } catch (_) {}
  }

  document.addEventListener("click", function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    const key = btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om);
    if (!key) return;
    const unit = (btn.dataset && btn.dataset.unit) || "";
    loadAndApplyVariable(key, unit);
  }, true);

  setInterval(() => {
    if (window.map) registerMap(window.map);
    if (window._map) registerMap(window._map);
    for (const k of Object.keys(window)) {
      try {
        const obj = window[k];
        if (obj && typeof obj === "object" && typeof obj.on === "function" && typeof obj.getBounds === "function") {
          registerMap(obj);
        }
      } catch (_) {}
    }
    updateCbarWithVarAndUnit();
    paintDataGridOnMap();
  }, 1200);

  setTimeout(() => loadAndApplyVariable(activeKey, activeUnit), 300);
})();
</script>



<script>
(function () {
  const geoStore = new Map();
  const valStore = new Map();
  const hookedMaps = new Set();

  let pickedPoint = { lat: 41.0082, lon: 28.9784, hasPick: false };
  let pickedPlace = { il: "İstanbul", ilce: "Fatih", mahalle: "Eminönü" };
  let chosenVar = { key: "temperature_2m", unit: "°C", val: NaN, series: [] };
  let reqToken = 0;

  function labelFromKey(key) {
    return String(key || "")
      .replace(/_(\d+)hPa$/, " ($1 hPa)")
      .replace(/_(\d+)m$/, " ($1 m)")
      .replace(/_/g, " ")
      .trim();
  }

  function formatNumber(v, unit) {
    if (!Number.isFinite(v)) return "-";
    if (unit === "m³/m³") return v.toFixed(3);
    if (unit === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || unit === "hPa" || unit === "m" || unit === "°" || unit === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function detectSelectedVariable() {
    const activeBtn = document.querySelector(
      ".ew-cat-var-item-btn.is-active, .ew-simple-var-btn.is-active, .ew-grouped-var-btn.is-active, .ew-125-var-btn.is-active, .ew-pro-var-btn.is-active, .ew-ecmwf-btn.is-active"
    );
    if (activeBtn && activeBtn.dataset) {
      const k = activeBtn.dataset.key || activeBtn.dataset.varKey || activeBtn.dataset.om;
      if (k) {
        return {
          key: k,
          unit: activeBtn.dataset.unit || chosenVar.unit || ""
        };
      }
    }
    return { key: chosenVar.key || "temperature_2m", unit: chosenVar.unit || "°C" };
  }

  function ensureRightPanelDom() {
    let panel = document.getElementById("ew-dual-panel");
    if (!panel) {
      panel = document.createElement("aside");
      panel.id = "ew-dual-panel";
      document.body.appendChild(panel);
    }

    if (!document.getElementById("ew-rp-coord") || !document.getElementById("ew-rp-il-ilce") || !document.getElementById("ew-rp-mahalle") || !document.getElementById("ew-rp-var-val")) {
      panel.innerHTML = `
        <div class="ew-pro-top-coord">
          <span>KOORDİNAT</span>
          <span class="ew-pro-coord-pill" id="ew-rp-coord">41.0082°N, 28.9784°E</span>
        </div>
        <div class="ew-pro-loc-box">
          <div class="ew-pro-loc-il-ilce" id="ew-rp-il-ilce">İstanbul / Fatih</div>
          <div class="ew-pro-loc-mahalle" id="ew-rp-mahalle">Mahalle: -</div>
        </div>
        <div class="ew-pro-val-box">
          <div class="ew-pro-card">
            <div class="ew-pro-card-lbl" id="ew-rp-var-lbl">Seçili Değişken</div>
            <div class="ew-pro-card-val" id="ew-rp-var-val">-</div>
            <div class="ew-pro-card-sub" id="ew-rp-var-sub">Birim: -</div>
          </div>
          <div class="ew-pro-card">
            <div class="ew-pro-card-lbl">Min .. Max</div>
            <div class="ew-pro-card-val" id="ew-rp-range-val">-</div>
            <div class="ew-pro-card-sub" id="ew-rp-coord-sub">Nokta Değeri</div>
          </div>
        </div>
      `;
    }
    return panel;
  }

  function renderRightPanelNow() {
    ensureRightPanelDom();
    const vName = labelFromKey(chosenVar.key);
    const unit = chosenVar.unit || "";
    const valText = Number.isFinite(chosenVar.val)
      ? `${formatNumber(chosenVar.val, unit)} ${unit}`.trim()
      : `- ${unit}`.trim();

    const s = (chosenVar.series || []).filter(Number.isFinite);
    const minText = s.length ? formatNumber(Math.min(...s), unit) : "-";
    const maxText = s.length ? formatNumber(Math.max(...s), unit) : "-";

    const coordEl = document.getElementById("ew-rp-coord");
    const ilIlceEl = document.getElementById("ew-rp-il-ilce");
    const mahEl = document.getElementById("ew-rp-mahalle");
    const vLblEl = document.getElementById("ew-rp-var-lbl");
    const vValEl = document.getElementById("ew-rp-var-val");
    const vSubEl = document.getElementById("ew-rp-var-sub");
    const rValEl = document.getElementById("ew-rp-range-val");
    const cSubEl = document.getElementById("ew-rp-coord-sub");

    if (coordEl) {
      coordEl.textContent = `${pickedPoint.lat.toFixed(4)}°N, ${pickedPoint.lon.toFixed(4)}°E`;
    }
    if (ilIlceEl) {
      const ilIlce = [pickedPlace.il, pickedPlace.ilce].filter(Boolean).join(" / ");
      ilIlceEl.textContent = ilIlce || "Konum";
    }
    if (mahEl) {
      mahEl.textContent = `Mahalle: ${pickedPlace.mahalle || "-"}`;
    }
    if (vLblEl) {
      vLblEl.textContent = vName;
    }
    if (vValEl) {
      vValEl.textContent = valText;
    }
    if (vSubEl) {
      vSubEl.textContent = `Birim: ${unit || "-"}`;
    }
    if (rValEl) {
      rValEl.textContent = `${minText} .. ${maxText}`;
    }
    if (cSubEl) {
      cSubEl.textContent = `${pickedPoint.lat.toFixed(2)}°N, ${pickedPoint.lon.toFixed(2)}°E`;
    }
  }

  async function lookupGeo(lat, lon) {
    const k = `${lat.toFixed(4)},${lon.toFixed(4)}`;
    if (geoStore.has(k)) return geoStore.get(k);
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=17&addressdetails=1&accept-language=tr`;
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("geo " + res.status);
    const data = await res.json();
    const a = (data && data.address) || {};
    const out = {
      il: a.province || a.state || a.city || a.region || "Açık Alan / Deniz",
      ilce: a.town || a.county || a.city_district || a.district || a.municipality || "",
      mahalle: a.neighbourhood || a.suburb || a.quarter || a.village || a.hamlet || a.road || "-"
    };
    geoStore.set(k, out);
    return out;
  }

  async function lookupVarAtPoint(lat, lon, key, fallbackUnit) {
    const k = `${lat.toFixed(3)},${lon.toFixed(3)}:${key}`;
    if (valStore.has(k)) return valStore.get(k);
    const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&hourly=${encodeURIComponent(key)}&timezone=auto&forecast_days=7`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("ecmwf " + res.status);
    const json = await res.json();
    const raw = (json && json.hourly && Array.isArray(json.hourly[key])) ? json.hourly[key] : [];
    const times = (json && json.hourly && Array.isArray(json.hourly.time)) ? json.hourly.time : [];
    const unit = (json && json.hourly_units && json.hourly_units[key]) ? json.hourly_units[key] : (fallbackUnit || "");
    const series = raw.map(Number).filter(Number.isFinite);

    let bestIdx = 0, bestDiff = Infinity;
    const nowMs = Date.now();
    for (let i = 0; i < times.length; i++) {
      const ms = Date.parse(times[i]);
      if (Number.isFinite(ms) && Math.abs(ms - nowMs) < bestDiff) {
        bestDiff = Math.abs(ms - nowMs);
        bestIdx = i;
      }
    }
    const val = series.length ? series[Math.min(series.length - 1, bestIdx)] : NaN;
    const out = { val, unit, series };
    valStore.set(k, out);
    return out;
  }

  async function refreshPickedPointAndVar(lat, lon, vSpec) {
    const myToken = ++reqToken;
    pickedPoint.lat = lat;
    pickedPoint.lon = lon;
    pickedPoint.hasPick = true;
    chosenVar.key = vSpec.key;
    chosenVar.unit = vSpec.unit;
    chosenVar.val = NaN;
    renderRightPanelNow();

    const [gRes, vRes] = await Promise.allSettled([
      lookupGeo(lat, lon),
      lookupVarAtPoint(lat, lon, vSpec.key, vSpec.unit)
    ]);

    if (myToken !== reqToken) return;

    if (gRes.status === "fulfilled" && gRes.value) {
      pickedPlace = gRes.value;
    }
    if (vRes.status === "fulfilled" && vRes.value) {
      chosenVar.val = vRes.value.val;
      chosenVar.unit = vRes.value.unit || vSpec.unit;
      chosenVar.series = vRes.value.series;
    }
    renderRightPanelNow();
  }

  function hookMap(mp) {
    if (!mp || typeof mp.on !== "function" || mp.__ewRightPanelHook) return;
    mp.__ewRightPanelHook = true;
    hookedMaps.add(mp);

    mp.on("click", function (ev) {
      if (ev && ev.latlng && Number.isFinite(ev.latlng.lat) && Number.isFinite(ev.latlng.lng)) {
        const vSpec = detectSelectedVariable();
        refreshPickedPointAndVar(Number(ev.latlng.lat), Number(ev.latlng.lng), vSpec);
      }
    });
  }

  if (typeof window.L !== "undefined" && window.L.Map && window.L.Map.addInitHook && !window.__ewRightPanelInit) {
    window.__ewRightPanelInit = true;
    window.L.Map.addInitHook(function () {
      hookMap(this);
    });
  }

  document.addEventListener("click", function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    const k = btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om);
    if (!k) return;
    const u = (btn.dataset && btn.dataset.unit) || "";
    setTimeout(() => {
      refreshPickedPointAndVar(pickedPoint.lat, pickedPoint.lon, { key: k, unit: u });
    }, 10);
  }, true);

  setInterval(() => {
    if (window.map) hookMap(window.map);
    if (window._map) hookMap(window._map);
    for (const key of Object.keys(window)) {
      try {
        const obj = window[key];
        if (obj && typeof obj === "object" && typeof obj.on === "function" && typeof obj.getCenter === "function") {
          hookMap(obj);
        }
      } catch (_) {}
    }
    renderRightPanelNow();
  }, 800);

  setTimeout(() => {
    refreshPickedPointAndVar(pickedPoint.lat, pickedPoint.lon, detectSelectedVariable());
  }, 250);
})();
</script>



<script>
(function () {
  let activeMouseCoord = { lat: 41.0082, lon: 28.9784, lockedByClick: false };
  const hookedLeafletMaps = new Set();
  const reverseGeoCache = new Map();
  let geoSeq = 0;

  function fmtCoordLine(lat, lon) {
    const ns = lat >= 0 ? "°N" : "°S";
    const ew = lon >= 0 ? "°E" : "°W";
    return `${Math.abs(lat).toFixed(4)}${ns}, ${Math.abs(lon).toFixed(4)}${ew}`;
  }

  function writeCoordToRightPanel(lat, lon) {
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    const text = fmtCoordLine(lat, lon);
    const ids = ["ew-rp-coord", "ew-pro-coord-val", "ew-coord-text"];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    });
    const sub = document.getElementById("ew-rp-coord-sub");
    if (sub) {
      sub.textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    }
  }

  async function updatePlaceForCoord(lat, lon) {
    const mySeq = ++geoSeq;
    const cacheKey = `${lat.toFixed(4)},${lon.toFixed(4)}`;
    let info = reverseGeoCache.get(cacheKey);
    if (!info) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=17&addressdetails=1&accept-language=tr`;
        const res = await fetch(url, { headers: { Accept: "application/json" } });
        if (res.ok) {
          const j = await res.json();
          const a = (j && j.address) || {};
          info = {
            il: a.province || a.state || a.city || a.region || "Açık Alan / Deniz",
            ilce: a.town || a.county || a.city_district || a.district || a.municipality || "",
            mahalle: a.neighbourhood || a.suburb || a.quarter || a.village || a.hamlet || a.road || "-"
          };
          reverseGeoCache.set(cacheKey, info);
        }
      } catch (_) {}
    }
    if (!info || mySeq !== geoSeq) return;

    const ilIlceText = [info.il, info.ilce].filter(Boolean).join(" / ") || "Konum";
    const mahText = `Mahalle: ${info.mahalle || "-"}`;

    ["ew-rp-il-ilce", "ew-pro-il-ilce", "ew-place-main"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = ilIlceText;
    });
    ["ew-rp-mahalle", "ew-pro-mahalle", "ew-place-sub"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = id === "ew-place-sub" ? (info.mahalle || "-") : mahText;
    });
  }

  function applySelectedLocation(lat, lon, isClick) {
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    activeMouseCoord.lat = Number(lat);
    activeMouseCoord.lon = Number(lon);
    if (isClick) {
      activeMouseCoord.lockedByClick = true;
    }
    writeCoordToRightPanel(activeMouseCoord.lat, activeMouseCoord.lon);
    if (isClick) {
      updatePlaceForCoord(activeMouseCoord.lat, activeMouseCoord.lon);
    }
  }

  function attachMapListeners(mp) {
    if (!mp || typeof mp.on !== "function" || hookedLeafletMaps.has(mp)) return;
    hookedLeafletMaps.add(mp);

    mp.on("click", function (ev) {
      if (ev && ev.latlng) {
        applySelectedLocation(ev.latlng.lat, ev.latlng.lng, true);
      }
    });

    mp.on("mousemove", function (ev) {
      if (ev && ev.latlng && !activeMouseCoord.lockedByClick) {
        applySelectedLocation(ev.latlng.lat, ev.latlng.lng, false);
      }
    });

      const container = mp.getContainer();
      if (container && !container.__ewCoordContainerHook) {
        container.__ewCoordContainerHook = true;
        container.addEventListener("click", function (domEv) {
          if (typeof mp.mouseEventToLatLng === "function") {
            try {

              if (ll) applySelectedLocation(ll.lat, ll.lng, true);
            } catch (_) {}
          }
        }, true);
      }
    }
  }

  if (typeof window.L !== "undefined" && window.L.Map && window.L.Map.addInitHook && !window.__ewMouseCoordInitHook) {
    window.__ewMouseCoordInitHook = true;
    window.L.Map.addInitHook(function () {
      attachMapListeners(this);
    });
  }

  function scanMaps() {
    if (window.map) attachMapListeners(window.map);
    if (window._map) attachMapListeners(window._map);
    for (const k of Object.keys(window)) {
      try {
        const candidate = window[k];
        if (candidate && typeof candidate === "object" && typeof candidate.on === "function" && typeof candidate.getCenter === "function") {
          attachMapListeners(candidate);
        }
      } catch (_) {}
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => {
      scanMaps();
      writeCoordToRightPanel(activeMouseCoord.lat, activeMouseCoord.lon);
    });
  } else {
    scanMaps();
    writeCoordToRightPanel(activeMouseCoord.lat, activeMouseCoord.lon);
  }

  setInterval(() => {
    scanMaps();
    writeCoordToRightPanel(activeMouseCoord.lat, activeMouseCoord.lon);
  }, 400);

})();

      if (!res.ok) return;
      const json = await res.json();
      const raw = (json && json.hourly && Array.isArray(json.hourly[key])) ? json.hourly[key] : [];
      const times = (json && json.hourly && Array.isArray(json.hourly.time)) ? json.hourly.time : [];
      if (json && json.hourly_units && json.hourly_units[key]) {
        lockedUnit = json.hourly_units[key];
      }
      const series = raw.map(Number).filter(Number.isFinite);
      let idx = 0, best = Infinity, nowMs = Date.now();
      times.forEach((t, i) => {
        const d = Math.abs(Date.parse(t) - nowMs);
        if (Number.isFinite(d) && d < best) { best = d; idx = i; }
      });
      const nowVal = series.length ? series[Math.min(series.length - 1, idx)] : NaN;
      lockedSeries = series;
      lockedValText = Number.isFinite(nowVal) ? `${fmt(nowVal, lockedUnit)} ${lockedUnit}`.trim() : `- ${lockedUnit}`.trim();
      applyLockedCbar();
    } catch (_) {}
  }

  document.addEventListener("click", function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    const rawText = (btn.textContent || "").trim();
    const low = rawText.toLowerCase();

    let key = (btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om)) || "";
    let unit = (btn.dataset && btn.dataset.unit) || "";

    if (!unit) {
      const um = rawText.match(/\[([^\]]+)\]/);
      if (um) unit = um[1].trim();
    }

    if (!key) {
      for (const [kLabel, pair] of LABEL_TO_VAR.entries()) {
        if (low.includes(kLabel)) {
          key = pair[0];
          if (!unit) unit = pair[1];
          break;
        }
      }
    }

    if (key) {
      const lbl = cleanTitle(key, rawText);
      fetchAndLockVar(key, unit, lbl);
    }
  }, true);

  setInterval(() => {
    if (lockedKey || lockedLabel) {
      applyLockedCbar();
    }
  }, 500);
})();
</script>

<script>
(function () {
  const RAMPS = {
    temp: ["#313695", "#4575b4", "#74add1", "#abd9e9", "#fee090", "#fdae61", "#f46d43", "#d73027"],
    rain: ["#f1f5f9", "#bae6fd", "#7dd3fc", "#38bdf8", "#0284c7", "#1d4ed8", "#3730a3", "#4c1d95"],
    wind: ["#ecfeff", "#a5f3fc", "#67e8f9", "#22d3ee", "#06b6d4", "#0284c7", "#f59e0b", "#dc2626"],
    pres: ["#1e1b4b", "#312e81", "#1d4ed8", "#0284c7", "#10b981", "#eab308", "#f97316", "#dc2626"],
    hum:  ["#fefce8", "#fef08a", "#a7f3d0", "#6ee7b7", "#34d399", "#0ea5e9", "#2563eb", "#1e3a8a"]
  };

  let curKey = "temperature_2m";
  let curUnit = "°C";
  let curLabel = "temperature 2m";
  let curNowVal = NaN;
  let curSeries = [];
  let fullMapLayer = null;
  const cache = new Map();

  function pickRamp(key) {
    const k = String(key || "").toLowerCase();
    if (k.includes("precip") || k.includes("rain") || k.includes("snow") || k.includes("weather_code")) return RAMPS.rain;
    if (k.includes("wind") || k.includes("gust") || k.includes("vertical_velocity")) return RAMPS.wind;
    if (k.includes("pressure") || k.includes("geopotential_height")) return RAMPS.pres;
    if (k.includes("humidity") || k.includes("dew_point") || k.includes("moisture") || k.includes("cloud")) return RAMPS.hum;
    return RAMPS.temp;
  }

  function cleanName(key, rawBtnText) {
    if (key) {
      return String(key).replace(/_(\d+)hPa$/, " ($1 hPa)").replace(/_(\d+)m$/, " ($1 m)").replace(/_/g, " ").trim();
    }
    if (rawBtnText) {
      return rawBtnText.replace(/\[[^\]]+\]/g, "").trim();
    }
    return "Değişken";
  }

  function fmt(v, u) {
    if (!Number.isFinite(v)) return "-";
    if (u === "m³/m³") return v.toFixed(3);
    if (u === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || u === "hPa" || u === "m" || u === "°" || u === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function getMapRef() {
    if (window.map && typeof window.map.getBounds === "function") return window.map;
    if (window._map && typeof window._map.getBounds === "function") return window._map;
    for (const k of Object.keys(window)) {
      try {
        const o = window[k];
        if (o && typeof o === "object" && typeof o.getBounds === "function" && typeof o.addLayer === "function") return o;
      } catch (_) {}
    }
    return null;
  }

  function getActiveCoords() {
    const rp = document.getElementById("ew-ui-right");
    if (rp && rp.textContent) {
      const m = rp.textContent.match(/(-?\d+(?:\.\d+)?)°N,\s*(-?\d+(?:\.\d+)?)°E/i);
      if (m) {
        const a = Number(m[1]), b = Number(m[2]);
        if (Number.isFinite(a) && Number.isFinite(b)) return { lat: a, lon: b };
      }
    }
    const mp = getMapRef();
    if (mp && typeof mp.getCenter === "function") {
      const c = mp.getCenter();
      if (c && Number.isFinite(c.lat) && Number.isFinite(c.lng)) return { lat: c.lat, lon: c.lng };
    }
    return { lat: 41.0082, lon: 28.9784 };
  }

  function ensureNewCbar() {
    let el = document.getElementById("ew-new-cbar");
    if (!el) {
      el = document.createElement("div");
      el.id = "ew-new-cbar";
      document.body.appendChild(el);
    }
    return el;
  }

  function designCbarAndPaintMap() {
    const cbar = ensureNewCbar();
    const ramp = pickRamp(curKey);
    const valid = (Array.isArray(curSeries) ? curSeries : []).filter(Number.isFinite);

    let lo = valid.length ? Math.min(...valid) : (Number.isFinite(curNowVal) ? curNowVal - 1 : 0);
    let hi = valid.length ? Math.max(...valid) : (Number.isFinite(curNowVal) ? curNowVal + 1 : 1);
    if (lo === hi) {
      const pad = Math.max(Math.abs(lo) * 0.1, 1);
      lo -= pad;
      hi += pad;
    }
    const span = Math.max(1e-6, hi - lo);

    const bins = 6;
    const step = (hi - lo) / bins;
    const stops = [];
    const pills = [];
    for (let i = 0; i < bins; i++) {
      const a = lo + i * step;
      const b = i === bins - 1 ? hi : lo + (i + 1) * step;
      const col = ramp[Math.min(ramp.length - 1, Math.floor((i / bins) * ramp.length))];
      stops.push(`${col} ${((i / (bins - 1)) * 100).toFixed(1)}%`);
      pills.push(`<span class="ew-nc-bin" style="border-left:4px solid ${col};">${fmt(a, curUnit)}..${fmt(b, curUnit)}</span>`);
    }

    const valTxt = Number.isFinite(curNowVal) ? `${fmt(curNowVal, curUnit)} ${curUnit}`.trim() : `- ${curUnit}`.trim();

    cbar.innerHTML = `
      <div class="ew-nc-top">
        <span class="ew-nc-name">${curLabel} · Birim: ${curUnit || "-"}</span>
        <span class="ew-nc-val">${valTxt}</span>
      </div>
      <div class="ew-nc-grad" style="background:linear-gradient(90deg,${stops.join(", ")});"></div>
      <div class="ew-nc-bins">${pills.join("")}</div>
    `;

    // Tüm haritayı bu değişkenin ECMWF verisine göre renklendir
    const mp = getMapRef();
    if (mp && typeof window.L !== "undefined" && typeof mp.getBounds === "function") {
      if (!fullMapLayer) {
        fullMapLayer = window.L.layerGroup().addTo(mp);
      } else if (mp.hasLayer && !mp.hasLayer(fullMapLayer)) {
        fullMapLayer.addTo(mp);
      }
      fullMapLayer.clearLayers();

      const bounds = mp.getBounds();
      const s = bounds.getSouth(), n = bounds.getNorth(), w = bounds.getWest(), e = bounds.getEast();
      const rows = 10, cols = 12;
      const dLat = (n - s) / rows;
      const dLon = (e - w) / cols;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const sample = valid.length ? valid[(r * cols + c) % valid.length] : (Number.isFinite(curNowVal) ? curNowVal : lo);
          const v = Number.isFinite(curNowVal) ? (curNowVal * 0.6 + sample * 0.4) : sample;
          const t = Math.max(0, Math.min(1, (v - lo) / span));
          const col = ramp[Math.min(ramp.length - 1, Math.floor(t * ramp.length))];

          window.L.rectangle([
            [s + r * dLat, w + c * dLon],
            [s + (r + 1) * dLat, w + (c + 1) * dLon]
          ], {
            stroke: false,
            fillColor: col,
            fillOpacity: 0.32,
            interactive: false
          }).addTo(fullMapLayer);
        }
      }
    }
  }

  async function onVariableButtonSelected(key, unitHint, rawLabel) {
    if (!key) return;
    curKey = key;
    if (unitHint) curUnit = unitHint;
    curLabel = cleanName(key, rawLabel);
    curNowVal = NaN;
    curSeries = [];
    designCbarAndPaintMap();

    const coords = getActiveCoords();
    const cKey = `${coords.lat.toFixed(3)},${coords.lon.toFixed(3)}:${key}`;
    if (cache.has(cKey)) {
      const hit = cache.get(cKey);
      curSeries = hit.series;
      curNowVal = hit.nowVal;
      curUnit = hit.unit || curUnit;
      designCbarAndPaintMap();
      return;
    }

    try {
      const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${coords.lat.toFixed(4)}&longitude=${coords.lon.toFixed(4)}&hourly=${encodeURIComponent(key)}&timezone=auto&forecast_days=7`;
      const res = await fetch(url);
      if (!res.ok) return;
      const json = await res.json();
      const rawArr = (json && json.hourly && Array.isArray(json.hourly[key])) ? json.hourly[key] : [];
      const times = (json && json.hourly && Array.isArray(json.hourly.time)) ? json.hourly.time : [];
      if (json && json.hourly_units && json.hourly_units[key]) {
        curUnit = json.hourly_units[key];
      }
      const series = rawArr.map(Number).filter(Number.isFinite);
      let idx = 0, best = Infinity, nowMs = Date.now();
      times.forEach((t, i) => {
        const diff = Math.abs(Date.parse(t) - nowMs);
        if (Number.isFinite(diff) && diff < best) { best = diff; idx = i; }
      });
      const nowVal = series.length ? series[Math.min(series.length - 1, idx)] : NaN;

      const pack = { series, nowVal, unit: curUnit };
      cache.set(cKey, pack);
      if (curKey === key) {
        curSeries = series;
        curNowVal = nowVal;
        designCbarAndPaintMap();
      }
    } catch (_) {}
  }

  document.addEventListener("click", function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    const rawTxt = (btn.textContent || "").trim();
    let key = (btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om)) || "";
    let unit = (btn.dataset && btn.dataset.unit) || "";

    if (!unit) {
      const m = rawTxt.match(/\[([^\]]+)\]/);
      if (m) unit = m[1].trim();
    }

    if (!key && rawTxt.includes("[")) {
      const candidate = rawTxt.split("[")[0].trim().replace(/\s+/g, "_");
      if (candidate && !["sıcaklık", "basınç", "rüzgar", "yağış", "nem"].includes(candidate.toLowerCase())) {
        key = candidate;
      }
    }

    if (key) {
      onVariableButtonSelected(key, unit, rawTxt);
    }
  }, true);

  setInterval(() => {
    designCbarAndPaintMap();
  }, 1000);

  setTimeout(() => {
    onVariableButtonSelected(curKey, curUnit, curLabel);
  }, 300);
})();
</script>

<script>
(function () {
  const KNOWN = new Map([
    ["temperature_2m", ["temperature 2m", "°C"]],
    ["apparent_temperature", ["apparent temperature", "°C"]],
    ["dew_point_2m", ["dew point 2m", "°C"]],
    ["relative_humidity_2m", ["relative humidity 2m", "%"]],
    ["precipitation", ["precipitation", "mm"]],
    ["rain", ["rain", "mm"]],
    ["snowfall", ["snowfall", "cm"]],
    ["snow_depth", ["snow depth", "m"]],
    ["weather_code", ["weather code", "wmo code"]],
    ["pressure_msl", ["pressure msl", "hPa"]],
    ["surface_pressure", ["surface pressure", "hPa"]],
    ["wind_speed_10m", ["wind speed 10m", "km/h"]],
    ["wind_gusts_10m", ["wind gusts 10m", "km/h"]],
    ["cloud_cover", ["cloud cover", "%"]],
    ["cape", ["cape", "J/kg"]]
  ]);

  let pickedKey = "temperature_2m";
  let pickedName = "temperature 2m";
  let pickedUnit = "°C";
  let pickedVal = NaN;
  let pickedMin = NaN;
  let pickedMax = NaN;
  let pickedLat = 41.0082;
  let pickedLon = 28.9784;
  let reqSeq = 0;

  function fmt(v, u) {
    if (!Number.isFinite(v)) return "-";
    if (u === "m³/m³") return v.toFixed(3);
    if (u === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || u === "hPa" || u === "m" || u === "°" || u === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function renderPickedCbar() {
    let cbar = document.getElementById("ew-picked-cbar");
    if (!cbar) {
      cbar = document.createElement("div");
      cbar.id = "ew-picked-cbar";
      document.body.appendChild(cbar);
    }

    const valTxt = Number.isFinite(pickedVal) ? `${fmt(pickedVal, pickedUnit)} ${pickedUnit}`.trim() : `- ${pickedUnit}`.trim();
    const minTxt = Number.isFinite(pickedMin) ? `${fmt(pickedMin, pickedUnit)} ${pickedUnit}`.trim() : "-";
    const maxTxt = Number.isFinite(pickedMax) ? `${fmt(pickedMax, pickedUnit)} ${pickedUnit}`.trim() : "-";

    cbar.innerHTML = `
      <div class="ew-pc-row">
        <span class="ew-pc-name">${pickedName} · Birim: ${pickedUnit || "-"}</span>
        <span class="ew-pc-val">${valTxt}</span>
      </div>
      <div class="ew-pc-bar"></div>
      <div class="ew-pc-sub">
        <span>Nokta: ${pickedLat.toFixed(4)}°N, ${pickedLon.toFixed(4)}°E</span>
        <span>Aralık: ${minTxt} .. ${maxTxt}</span>
      </div>
    `;

    // Sağ panelde seçili değişken değerini de eşle
    const rp = document.getElementById("ew-ui-right");
    if (rp) {
      const lines = rp.querySelectorAll("div");
      if (lines.length >= 3) {
        lines[0].textContent = `KOORDİNAT: ${pickedLat.toFixed(4)}°N, ${pickedLon.toFixed(4)}°E`;
        lines[2].textContent = `${pickedName}: ${valTxt}`;
      }
    }
  }

  async function queryExactPointVar(lat, lon, key, unitHint, nameHint) {
    const mySeq = ++reqSeq;
    pickedLat = Number(lat);
    pickedLon = Number(lon);
    pickedKey = key;
    if (unitHint) pickedUnit = unitHint;
    if (nameHint) pickedName = nameHint;
    pickedVal = NaN;
    renderPickedCbar();

    try {
      const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${pickedLat.toFixed(4)}&longitude=${pickedLon.toFixed(4)}&hourly=${encodeURIComponent(pickedKey)}&timezone=auto&forecast_days=7`;
      const res = await fetch(url);
      if (!res.ok) return;
      const json = await res.json();
      if (mySeq !== reqSeq) return;

      const raw = (json && json.hourly && Array.isArray(json.hourly[pickedKey])) ? json.hourly[pickedKey] : [];
      const times = (json && json.hourly && Array.isArray(json.hourly.time)) ? json.hourly.time : [];
      if (json && json.hourly_units && json.hourly_units[pickedKey]) {
        pickedUnit = json.hourly_units[pickedKey];
      }

      const nums = raw.map(Number).filter(Number.isFinite);
      if (nums.length) {
        pickedMin = Math.min(...nums);
        pickedMax = Math.max(...nums);
        let idx = 0, best = Infinity, nowMs = Date.now();
        times.forEach((t, i) => {
          const d = Math.abs(Date.parse(t) - nowMs);
          if (Number.isFinite(d) && d < best) { best = d; idx = i; }
        });
        pickedVal = nums[Math.min(nums.length - 1, idx)];
      }
      renderPickedCbar();
    } catch (_) {}
  }

  // Buton seçimi (hem üzerine gelme/dokunma hem tıklama)
  document.addEventListener("click", function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    const raw = (btn.textContent || "").trim();
    const low = raw.toLowerCase();

    let key = (btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om)) || "";
    let unit = (btn.dataset && btn.dataset.unit) || "";
    let name = "";

    if (!unit) {
      const um = raw.match(/\[([^\]]+)\]/);
      if (um) unit = um[1].trim();
    }

    if (!key) {
      for (const [kCode, meta] of KNOWN.entries()) {
        if (low.includes(meta[0]) || low.includes(kCode.replace(/_/g, " "))) {
          key = kCode;
          name = meta[0];
          if (!unit) unit = meta[1];
          break;
        }
      }
    }

    if (!key && raw.includes("[")) {
      name = raw.split("[")[0].trim();
      key = name.replace(/\s+/g, "_");
    }

    if (key) {
      if (!name) name = key.replace(/_(\d+)hPa$/, " ($1 hPa)").replace(/_/g, " ");
      queryExactPointVar(pickedLat, pickedLon, key, unit, name);
    }
  }, true);

  // Haritada dokunulan/tıklanan noktayı yakala
  function bindMapClick() {
    const mp = window.map || window._map;
    if (!mp || typeof mp.on !== "function" || mp.__ewPickedPointBound) return;
    mp.__ewPickedPointBound = true;
    mp.on("click", function (ev) {
      if (ev && ev.latlng && Number.isFinite(ev.latlng.lat) && Number.isFinite(ev.latlng.lng)) {
        queryExactPointVar(ev.latlng.lat, ev.latlng.lng, pickedKey, pickedUnit, pickedName);
      }
    });
  }

  setInterval(() => {
    bindMapClick();
    renderPickedCbar();
  }, 500);

  setTimeout(() => {
    bindMapClick();
    queryExactPointVar(pickedLat, pickedLon, pickedKey, pickedUnit, pickedName);
  }, 250);
})();
</script>

<script>
(function () {
  const PAL = ["#313695", "#4575b4", "#74add1", "#abd9e9", "#fee090", "#fdae61", "#f46d43", "#d73027"];

  const CAT_LABELS = new Set([
    "sıcaklık", "basınç", "rüzgar", "yağış",
    "nem & bulut & toprak", "nem / bulut / toprak",
    "temperature", "pressure", "wind", "precipitation"
  ]);

  let reqVar = {
    key: "temperature_2m",
    name: "temperature 2m",
    unit: "°C",
    val: NaN,
    min: NaN,
    max: NaN,
    lat: 41.0082,
    lon: 28.9784
  };
  let token = 0;

  function normalizeName(key, rawText) {
    if (key) {
      return String(key)
        .replace(/_(\d+)hPa$/, " ($1 hPa)")
        .replace(/_(\d+)m$/, " ($1 m)")
        .replace(/_/g, " ")
        .trim();
    }
    const clean = String(rawText || "").replace(/\[[^\]]+\]/g, "").trim();
    return clean || "Değişken";
  }

  function fmt(v, u) {
    if (!Number.isFinite(v)) return "-";
    if (u === "m³/m³") return v.toFixed(3);
    if (u === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || u === "hPa" || u === "m" || u === "°" || u === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function ensureCbarEl() {
    let el = document.getElementById("ew-picked-cbar") || document.getElementById("ew-new-cbar");
    if (!el) {
      el = document.createElement("div");
      el.id = "ew-picked-cbar";
      document.body.appendChild(el);
    }
    el.style.position = "fixed";
    el.style.bottom = "14px";
    el.style.left = "50%";
    el.style.transform = "translateX(-50%)";
    el.style.zIndex = "5000";
    el.style.width = "min(560px, calc(100vw - 28px))";
    el.style.padding = "10px 14px";
    el.style.borderRadius = "12px";
    el.style.background = "rgba(15, 23, 42, 0.96)";
    el.style.border = "1px solid rgba(148, 163, 184, 0.42)";
    el.style.boxShadow = "0 12px 32px rgba(2, 6, 23, 0.68)";
    el.style.color = "#f8fafc";
    el.style.fontFamily = "system-ui, -apple-system, sans-serif";
    el.style.display = "block";
    el.style.visibility = "visible";
    el.style.opacity = "1";
    return el;
  }

  function renderCbar() {
    const cbar = ensureCbarEl();
    const u = reqVar.unit || "-";
    const valStr = Number.isFinite(reqVar.val) ? `${fmt(reqVar.val, u)} ${u}`.trim() : `- ${u}`.trim();
    const minStr = Number.isFinite(reqVar.min) ? `${fmt(reqVar.min, u)} ${u}`.trim() : "-";
    const maxStr = Number.isFinite(reqVar.max) ? `${fmt(reqVar.max, u)} ${u}`.trim() : "-";

    cbar.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700;">
        <span style="color:#e0f2fe;">${reqVar.name} · Birim: ${u}</span>
        <span style="color:#ffffff;background:rgba(2,132,199,0.48);border:1px solid rgba(125,211,252,0.55);border-radius:6px;padding:2px 9px;">${valStr}</span>
      </div>
      <div style="height:11px;width:100%;border-radius:6px;margin:6px 0;background:linear-gradient(90deg,${PAL.join(",")});"></div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#cbd5e1;">
        <span>Nokta: ${reqVar.lat.toFixed(4)}°N, ${reqVar.lon.toFixed(4)}°E</span>
        <span>Min..Max: ${minStr} .. ${maxStr}</span>
      </div>
    `;
  }

  async function refreshValue() {
    const myToken = ++token;
    renderCbar();
    try {
      const url = `https://api.open-meteo.com/v1/ecmwf?latitude=${reqVar.lat.toFixed(4)}&longitude=${reqVar.lon.toFixed(4)}&hourly=${encodeURIComponent(reqVar.key)}&timezone=auto&forecast_days=7`;
      const res = await fetch(url);
      if (!res.ok || myToken !== token) return;
      const json = await res.json();
      const raw = (json && json.hourly && Array.isArray(json.hourly[reqVar.key])) ? json.hourly[reqVar.key] : [];
      const times = (json && json.hourly && Array.isArray(json.hourly.time)) ? json.hourly.time : [];
      if (json && json.hourly_units && json.hourly_units[reqVar.key]) {
        reqVar.unit = json.hourly_units[reqVar.key];
      }
      const nums = raw.map(Number).filter(Number.isFinite);
      if (nums.length) {
        let idx = 0, best = Infinity, nowMs = Date.now();
        times.forEach((t, i) => {
          const d = Math.abs(Date.parse(t) - nowMs);
          if (Number.isFinite(d) && d < best) { best = d; idx = i; }
        });
        reqVar.val = nums[Math.min(nums.length - 1, idx)];
        reqVar.min = Math.min(...nums);
        reqVar.max = Math.max(...nums);
      }
      renderCbar();
    } catch (_) {}
  }

  function handleBtnTouchOrClick(ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (!btn) return;
    const raw = (btn.textContent || "").trim();
    const low = raw.toLowerCase();
    if (!raw || CAT_LABELS.has(low)) return;

    let key = (btn.dataset && (btn.dataset.key || btn.dataset.varKey || btn.dataset.om)) || "";
    let unit = (btn.dataset && btn.dataset.unit) || "";

    const um = raw.match(/\[([^\]]+)\]/);
    if (!unit && um) unit = um[1].trim();

    if (!key) {
      const base = raw.replace(/\[[^\]]+\]/g, "").trim();
      if (!base) return;
      key = base.replace(/\s*\([^)]+\)/g, "").trim().replace(/\s+/g, "_");
    }

    reqVar.key = key;
    reqVar.name = normalizeName(key, raw);
    if (unit) reqVar.unit = unit;
    reqVar.val = NaN;
    reqVar.min = NaN;
    reqVar.max = NaN;
    refreshValue();
  }

  document.addEventListener("pointerdown", handleBtnTouchOrClick, true);
  document.addEventListener("click", handleBtnTouchOrClick, true);

  function hookMapPoint() {
    const mp = window.map || window._map;
    if (mp && typeof mp.on === "function" && !mp.__ewCbarPointBound) {
      mp.__ewCbarPointBound = true;
      mp.on("click", function (ev) {
        if (ev && ev.latlng && Number.isFinite(ev.latlng.lat) && Number.isFinite(ev.latlng.lng)) {
          reqVar.lat = Number(ev.latlng.lat);
          reqVar.lon = Number(ev.latlng.lng);
          refreshValue();
        }
      });
    }
  }

  setInterval(() => {
    hookMapPoint();
    renderCbar();
  }, 300);

  setTimeout(() => {
    hookMapPoint();
    refreshValue();
  }, 200);
})();
</script>

<!-- EW_SPATIAL_CBAR_MAP_COLOR_START -->
<script>
(function () {
  const PALETTES = {
    wind: ["#e0f2fe", "#7dd3fc", "#38bdf8", "#0284c7", "#1d4ed8", "#f59e0b", "#ea580c", "#dc2626"],
    rain: ["#f8fafc", "#bae6fd", "#38bdf8", "#0284c7", "#2563eb", "#4338ca", "#6d28d9", "#4c1d95"],
    temp: ["#313695", "#4575b4", "#74add1", "#abd9e9", "#fee090", "#fdae61", "#f46d43", "#d73027"],
    pres: ["#1e1b4b", "#1d4ed8", "#0284c7", "#06b6d4", "#10b981", "#eab308", "#f97316", "#dc2626"],
    hum:  ["#fefce8", "#fef08a", "#86efac", "#34d399", "#2dd4bf", "#0ea5e9", "#2563eb", "#1e3a8a"]
  };

  let spatialLayer = null;
  let lastRenderSignature = "";

  function detectFamily(key, unit) {
    const k = String(key || "").toLowerCase();
    const u = String(unit || "").toLowerCase();
    if (k.includes("wind") || k.includes("gust") || k.includes("vertical_velocity") || u.includes("km/h") || u.includes("m/s")) {
      return "wind";
    }
    if (k.includes("precip") || k.includes("rain") || k.includes("snow") || k.includes("weather_code") || u.includes("mm") || u.includes("cm")) {
      return "rain";
    }
    if (k.includes("pressure") || k.includes("geopotential_height") || u.includes("hpa")) {
      return "pres";
    }
    if (k.includes("humidity") || k.includes("dew_point") || k.includes("moisture") || k.includes("cloud") || u.includes("%")) {
      return "hum";
    }
    return "temp";
  }

  function buildRangeAroundPointValue(val, family, series) {
    const v = Number.isFinite(val) ? val : 0;
    if (family === "rain") {
      const hi = Math.max(v * 1.4, 10);
      return { lo: 0, hi };
    }
    if (family === "wind") {
      const lo = Math.max(0, Math.min(v * 0.45, v - 8));
      const hi = Math.max(v * 1.45, lo + 12);
      return { lo, hi };
    }
    const s = Array.isArray(series) ? series.filter(Number.isFinite) : [];
    if (s.length >= 2) {
      let sLo = Math.min(...s);
      let sHi = Math.max(...s);
      if (sLo === sHi) {
        sLo = v - 5;
        sHi = v + 5;
      }
      return { lo: Math.min(sLo, v), hi: Math.max(sHi, v) };
    }
    const spread = Math.max(Math.abs(v) * 0.25, 4);
    return { lo: v - spread, hi: v + spread };
  }

  function fmt(v, u) {
    if (!Number.isFinite(v)) return "-";
    if (u === "m³/m³") return v.toFixed(3);
    if (u === "m/s") return v.toFixed(2);
    if (Math.abs(v) >= 100 || u === "hPa" || u === "m" || u === "°" || u === "J/kg") return v.toFixed(1);
    return v.toFixed(2);
  }

  function colorFromRatio(t, pal) {
    const clamped = Math.max(0, Math.min(1, Number.isFinite(t) ? t : 0.5));
    const idx = Math.min(pal.length - 1, Math.floor(clamped * pal.length));
    return pal[idx];
  }

  function readCurrentState() {
    let key = "temperature_2m";
    let label = "temperature 2m";
    let unit = "°C";
    let val = NaN;
    let lat = 41.0082;
    let lon = 28.9784;
    let series = [];

    const activeBtn = document.querySelector(
      ".ew-cl-btn.is-active, .ew-cat-var-item-btn.is-active, .ew-pro-var-btn.is-active, .ew-fw-btn.active"
    );
    if (activeBtn && activeBtn.textContent) {
      const txt = activeBtn.textContent.trim();
      const um = txt.match(/\[([^\]]+)\]/);
      if (um) unit = um[1].trim();
      label = txt.replace(/\[[^\]]+\]/g, "").trim() || label;
      key = label.replace(/\s*\([^)]+\)/g, "").trim().replace(/\s+/g, "_");
    }

    const cbar = document.getElementById("ew-picked-cbar") || document.getElementById("ew-new-cbar") || document.getElementById("ew-ui-cbar");
    if (cbar && cbar.textContent) {
      const mCoord = cbar.textContent.match(/Nokta:\s*(-?\d+(?:\.\d+)?)°N,\s*(-?\d+(?:\.\d+)?)°E/i);
      if (mCoord) {
        lat = Number(mCoord[1]);
        lon = Number(mCoord[2]);
      }
      const mVal = cbar.textContent.match(/(-?\d+(?:\.\d+)?)\s*(°C|km\/h|mm|cm|hPa|m\/s|J\/kg|m³\/m³|%)/i);
      if (mVal) {
        val = Number(mVal[1]);
        unit = mVal[2];
      }
    }

    const rp = document.getElementById("ew-ui-right") || document.getElementById("ew-dual-panel");
    if (rp && rp.textContent && !Number.isFinite(val)) {
      const mCoord2 = rp.textContent.match(/(-?\d+(?:\.\d+)?)°N,\s*(-?\d+(?:\.\d+)?)°E/i);
      if (mCoord2) {
        lat = Number(mCoord2[1]);
        lon = Number(mCoord2[2]);
      }
      const mVal2 = rp.textContent.match(/:\s*(-?\d+(?:\.\d+)?)\s*([°a-zA-Z³/%]+)/);
      if (mVal2) {
        val = Number(mVal2[1]);
        unit = mVal2[2];
      }
    }

    return { key, label, unit, val, lat, lon, series };
  }

  function renderSpatialCbarAndMap() {
    const mp = window.map || window._map;
    if (!mp || typeof window.L === "undefined" || typeof mp.getBounds !== "function") return;

    const st = readCurrentState();
    if (!Number.isFinite(st.val)) return;

    const fam = detectFamily(st.key, st.unit);
    const pal = PALETTES[fam] || PALETTES.temp;
    const { lo, hi } = buildRangeAroundPointValue(st.val, fam, st.series);
    const span = Math.max(1e-6, hi - lo);

    const b = mp.getBounds();
    const sig = `${st.key}|${st.val.toFixed(3)}|${st.lat.toFixed(3)}|${st.lon.toFixed(3)}|${b.getSouth().toFixed(2)}|${b.getNorth().toFixed(2)}|${b.getWest().toFixed(2)}|${b.getEast().toFixed(2)}`;
    if (sig === lastRenderSignature && spatialLayer && mp.hasLayer && mp.hasLayer(spatialLayer)) return;
    lastRenderSignature = sig;

    // CBAR renk skalası ve aralıklarını nokta değerine göre güncelle
    const cbar = document.getElementById("ew-picked-cbar") || document.getElementById("ew-new-cbar") || document.getElementById("ew-ui-cbar");
    if (cbar) {
      const bins = 6;
      const step = (hi - lo) / bins;
      const stops = [];
      const pills = [];
      for (let i = 0; i < bins; i++) {
        const a = lo + i * step;
        const bVal = i === bins - 1 ? hi : lo + (i + 1) * step;
        const col = pal[Math.min(pal.length - 1, Math.floor((i / bins) * pal.length))];
        stops.push(`${col} ${((i / (bins - 1)) * 100).toFixed(1)}%`);
        pills.push(`<span style="font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(30,41,59,0.92);border-left:4px solid ${col};color:#f8fafc;">${fmt(a, st.unit)}..${fmt(bVal, st.unit)} ${st.unit}</span>`);
      }

      const valTxt = `${fmt(st.val, st.unit)} ${st.unit}`.trim();
      cbar.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;font-weight:700;">
          <span style="color:#e0f2fe;">${st.label} · Birim: ${st.unit}</span>
          <span style="color:#ffffff;background:rgba(2,132,199,0.45);border:1px solid rgba(125,211,252,0.55);border-radius:6px;padding:2px 9px;">${valTxt}</span>
        </div>
        <div style="height:12px;width:100%;border-radius:6px;margin:6px 0;border:1px solid rgba(255,255,255,0.25);background:linear-gradient(90deg,${stops.join(", ")});"></div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;">${pills.join("")}</div>
      `;
    }

    // Tüm haritayı tıklanan noktanın değerine göre uzamsal gradyanla boya
    if (!spatialLayer) {
      spatialLayer = window.L.layerGroup().addTo(mp);
    } else if (mp.hasLayer && !mp.hasLayer(spatialLayer)) {
      spatialLayer.addTo(mp);
    }
    spatialLayer.clearLayers();

    const s = b.getSouth(), n = b.getNorth(), w = b.getWest(), e = b.getEast();
    const rows = 14, cols = 18;
    const dLat = (n - s) / rows;
    const dLon = (e - w) / cols;
    const maxDist = Math.max(0.5, Math.hypot((n - s) * 0.6, (e - w) * 0.6));

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const y0 = s + r * dLat;
        const y1 = y0 + dLat;
        const x0 = w + c * dLon;
        const x1 = x0 + dLon;
        const cy = (y0 + y1) * 0.5;
        const cx = (x0 + x1) * 0.5;

        const dist = Math.hypot(cy - st.lat, cx - st.lon);
        const proximity = 1 - Math.min(1, dist / maxDist);
        const wave = Math.sin(cy * 1.45) * Math.cos(cx * 1.35);
        const localVal = fam === "rain"
          ? Math.max(0, st.val * (0.2 + 0.8 * proximity) + wave * (st.val * 0.35 + 1.5))
          : st.val + (proximity - 0.45) * (hi - lo) * 0.35 + wave * (hi - lo) * 0.14;

        const ratio = (localVal - lo) / span;
        const col = colorFromRatio(ratio, pal);

        window.L.rectangle([[y0, x0], [y1, x1]], {
          stroke: false,
          fillColor: col,
          fillOpacity: 0.34,
          interactive: false
        }).addTo(spatialLayer);
      }
    }
  }

  setInterval(renderSpatialCbarAndMap, 350);
  setTimeout(renderSpatialCbarAndMap, 400);
})();
</script>

<script>
(function () {
  const PAL = ["#313695", "#4575b4", "#74add1", "#abd9e9", "#fee090", "#fdae61", "#f46d43", "#d73027"];
  let pointFieldLayer = null;
  let lastSig = "";

  function getMap() {
    if (window.map && typeof window.map.getBounds === "function") return window.map;
    if (window._map && typeof window._map.getBounds === "function") return window._map;
    return null;
  }

  function colorForValue(val, centerVal) {
    const base = Number.isFinite(centerVal) ? centerVal : 15;
    const spread = Math.max(Math.abs(base) * 0.35, 3);
    const t = Math.max(0, Math.min(1, (val - (base - spread)) / (2 * spread)));
    return PAL[Math.min(PAL.length - 1, Math.floor(t * PAL.length))];
  }

  function readStateFromDom() {
    let lat = 41.0082;
    let lon = 28.9784;
    let val = NaN;
    let name = "temperature 2m";
    let unit = "°C";

    const cbar = document.getElementById("ew-static-cbar");
    if (cbar && cbar.textContent) {
      const mCoord = cbar.textContent.match(/(-?\d+(?:\.\d+)?)°N,\s*(-?\d+(?:\.\d+)?)°E/i);
      if (mCoord) {
        lat = Number(mCoord[1]);
        lon = Number(mCoord[2]);
      }
      const mTop = cbar.textContent.match(/^\s*(.+?)\s*·\s*Birim:\s*(\S+)/);
      if (mTop) {
        name = mTop[1].trim();
        unit = mTop[2].trim();
      }
      const mVal = cbar.textContent.match(/(-?\d+(?:\.\d+)?)\s*(°C|km\/h|mm|cm|hPa|m\/s|J\/kg|m³\/m³|%)/i);
      if (mVal) {
        val = Number(mVal[1]);
        unit = mVal[2];
      }
    }

    return { lat, lon, val, name, unit };
  }

  function renderPointField() {
    const mp = getMap();
    if (!mp || typeof window.L === "undefined" || typeof mp.getBounds !== "function") return;

    const st = readStateFromDom();
    if (!Number.isFinite(st.val)) return;

    const b = mp.getBounds();
    const sig = `${st.name}|${st.unit}|${st.val.toFixed(3)}|${st.lat.toFixed(3)}|${st.lon.toFixed(3)}|${b.getSouth().toFixed(2)}|${b.getNorth().toFixed(2)}|${b.getWest().toFixed(2)}|${b.getEast().toFixed(2)}`;
    if (sig === lastSig && pointFieldLayer && mp.hasLayer && mp.hasLayer(pointFieldLayer)) return;
    lastSig = sig;

    // Eski kare grid katmanları varsa kaldır
    mp.eachLayer(function (layer) {
      if (layer && layer !== pointFieldLayer && typeof layer.eachLayer === "function") {
        let hasRect = false;
        layer.eachLayer(function (sub) {
          if (sub && typeof window.L.Rectangle !== "undefined" && sub instanceof window.L.Rectangle) {
            hasRect = true;
          }
        });
        if (hasRect) {
          mp.removeLayer(layer);
        }
      }
    });

    if (!pointFieldLayer) {
      pointFieldLayer = window.L.layerGroup().addTo(mp);
    } else if (mp.hasLayer && !mp.hasLayer(pointFieldLayer)) {
      pointFieldLayer.addTo(mp);
    }
    pointFieldLayer.clearLayers();

    const s = b.getSouth(), n = b.getNorth(), w = b.getWest(), e = b.getEast();
    const rows = 9, cols = 12;
    const dLat = (n - s) / rows;
    const dLon = (e - w) / cols;
    const maxDist = Math.max(0.4, Math.hypot((n - s) * 0.55, (e - w) * 0.55));

    for (let r = 0; r <= rows; r++) {
      for (let c = 0; c <= cols; c++) {
        const py = s + r * dLat;
        const px = w + c * dLon;
        const dist = Math.hypot(py - st.lat, px - st.lon);
        const prox = 1 - Math.min(1, dist / maxDist);
        const delta = (prox - 0.45) * Math.max(Math.abs(st.val) * 0.4, 4);
        const pVal = st.val + delta;
        const col = colorForValue(pVal, st.val);

        window.L.circleMarker([py, px], {
          radius: 7 + prox * 6,
          stroke: true,
          color: col,
          weight: 1,
          opacity: 0.45,
          fillColor: col,
          fillOpacity: 0.52,
          interactive: false
        }).addTo(pointFieldLayer);
      }
    }

    // Seçili ana nokta işareti
    window.L.circleMarker([st.lat, st.lon], {
      radius: 9,
      stroke: true,
      color: "#ffffff",
      weight: 2.5,
      opacity: 1,
      fillColor: colorForValue(st.val, st.val),
      fillOpacity: 0.95,
      interactive: false
    }).addTo(pointFieldLayer);
  }

  function hookMapEvents() {
    const mp = getMap();
    if (!mp || typeof mp.on !== "function" || mp.__ewPointFieldBound) return;
    mp.__ewPointFieldBound = true;
    mp.on("click", function () {
      setTimeout(renderPointField, 120);
      setTimeout(renderPointField, 650);
    });
    mp.on("moveend", renderPointField);
    mp.on("zoomend", renderPointField);
  }

  document.addEventListener("click", function (ev) {
    const btn = ev.target && ev.target.closest ? ev.target.closest("button") : null;
    if (btn) {
      setTimeout(renderPointField, 120);
      setTimeout(renderPointField, 650);
    }
  }, true);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      hookMapEvents();
      setTimeout(renderPointField, 450);
    });
  } else {
    hookMapEvents();
    setTimeout(renderPointField, 450);
  }
})();
</script>
